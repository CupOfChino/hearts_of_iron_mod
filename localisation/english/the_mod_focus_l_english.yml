 FRA_start_industry: "Industrial Revitalization"
 FRA_start_industry_desc: "Despite a long industrial tradition, France's industrial system showed signs of fatigue by the 1930s. Fragmented small enterprises, outdated production techniques, frequent strikes, and political instability severely constrained output. Steel plants were inefficient, military factories underutilized, and there was little coordination between civilian and military production. The nation was unprepared for the industrial demands of modern warfare."

