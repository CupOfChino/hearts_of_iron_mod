 FRA_straighten_out_house_affairs: "Straighten Out Internal Affairs"
 FRA_straighten_out_house_affairs_desc: "The Emperor of France has returned to his loyal Paris. It is time to reorganize the chaotic domestic politics."

 FRA_improve_people_livelihood: "Improve People's Livelihood"
 FRA_improve_people_livelihood_desc: "The domestic economic situation is grim. The government will prioritize building civilian infrastructure to secure the people's livelihood."

 FRA_improve_engage_in_production: "Boost Production"
 FRA_improve_engage_in_production_desc: "Next, we must stimulate production and restore the nation's productive capacity."

 FRA_plant_site_expansion: "Factory Site Expansion"
 FRA_plant_site_expansion_desc: "Change land use in certain areas to meet the requirements for factory construction."

 FRA_improve_army: "Develop the Military"
 FRA_improve_army_desc: "While neighbors stockpile grain, I stockpile guns. My neighbor is my granary."

 FRA_improve_military_reform: "Military Reform"
 FRA_improve_military_reform_desc: "Some old guard remain obsessed with the victories of the last war. If we face a new great war with such a stagnant mindset, we will be buried by it."

 FRA_building_high_military_command: "Establish Supreme Military Command"
 FRA_building_high_military_command_desc: "The German General Staff is indeed effective. We should establish our own Supreme Military Command."

 FRA_defence_unsafe_neighboor: "Defend Against Unfriendly Neighbors"
 FRA_defence_unsafe_neighboor_desc: "Our neighboring countries are not friendly. France must prepare for potential invasions at any moment."

 FRA_organize_militia: "Organize Irregular Forces"
 FRA_organize_militia_desc: "Training irregular forces can ease our defense burden and save military expenditures during peacetime."

 FRA_enlargement_citizenship: "Expansion of Citizenship"
 FRA_enlargement_citizenship_desc: "If we heavily promote that joining the French Army grants full citizenship, many cannon fodder recruits will swell our manpower pool."

 FRA_attach_hol: "Attack the Low Countries"
 FRA_attach_hol_desc: "The time has come. March forth today!"

 FRA_allied_with_ger: "Alliance with the German Emperor"
 FRA_allied_with_ger_desc: "The German Emperor has reclaimed his throne and established his sphere of influence. Perhaps we should attempt an alliance?"

 FRA_attack_spr: "March Southward"
 FRA_attack_spr_desc: "The Iberian Peninsula to the south poses a threat to the Empire's rear. We must eliminate this threat completely."

 FRA_attack_ita: "March on Rome"
 FRA_attack_ita_desc: "All roads lead to Rome."

 FRA_the_france_empire: "Restore the Empire's Glory"
 FRA_the_france_empire_desc: "Sweep across the continent. Return to our rightful place."

