l_english:
 USA_great_depression_categories: "The Great Depression Crisis"
 USA_great_depression_categories_desc: "The Great Depression of 1929 still hangs over America. President Roosevelt's New Deal is unfolding, but the wounds of the economy are far from healed — every measure is buying time for the nation's recovery."

 USA_gd_deterrent_mission: "Ease the Depression"
 USA_gd_deterrent_mission_desc: "The economic crisis continues. Keep the current policies steady and calm the markets; in a year the grip of the Depression will loosen.\n\n(An automatic 365-day governance cycle; when it ends, the Depression drops one level)"
 USA_gd_work_relief: "Work Relief"
 USA_gd_work_relief_desc: "Put the unemployed to work on public projects, trading labour for a livelihood and breathing life into the stricken economy."
 USA_gd_public_works_mission: "Public Works Underway"
 USA_gd_public_works_mission_desc: "Public projects are spreading across the country, and workers are busy on the sites..."
 USA_gd_reject_new_deal: "Reject the New Deal"
 USA_gd_reject_new_deal_desc: "The President is not Roosevelt — the new administration abandons the New Deal. Suppressing the crisis by drastic means may remove one level of the Depression at once, but its lingering effects will not be quickly resolved."
 USA_gd_emergency_banking: "Emergency Banking Act"
 USA_gd_emergency_banking_desc: "Declare a bank holiday and restore public confidence in the financial system."
 USA_gd_agricultural_adjustment: "Agricultural Adjustment Act"
 USA_gd_agricultural_adjustment_desc: "Stabilise farm prices by limiting output and subsidising farmers, easing the agricultural crisis."
 USA_gd_national_recovery: "National Industrial Recovery Act"
 USA_gd_national_recovery_desc: "Set fair competition rules and drive industrial recovery, putting factories back to work."
 USA_gd_wpa: "Works Progress Administration"
 USA_gd_wpa_desc: "Hire the unemployed on a massive scale for infrastructure projects, turning relief into work."
 USA_gd_tva: "Tennessee Valley Authority"
 USA_gd_tva_desc: "Undertake large-scale water engineering in the Tennessee Valley, building a level-1 dam and infrastructure in two states (Tennessee and Alabama).\n\n(Consumes 15 civilian factories for 180 days while active)"
 USA_gd_research_boost: "Temporary Research Incentives"
 USA_gd_research_boost_desc: "Allocate special funds to encourage research institutions and enterprises, building technical strength for the future."
 USA_gd_nya: "National Youth Administration"
 USA_gd_nya_desc: "Provide work and training opportunities for young people, so a generation is not lost to unemployment."
 USA_gd_rearmament_orders: "Rearmament Procurement Orders"
 USA_gd_rearmament_orders_desc: "Place large orders with armament firms; government demand will drive the industrial machine.\n\n(Click to start a 90-day rearmament procurement task)"

 USA_the_third_empire_categories_07: "The Military-Industrial Complex"
 USA_the_third_empire_categories_07_desc: "War clouds gather. We place massive orders with our armament industries — arms production will drive the whole industrial system, making America a true arsenal."

 change_usa.20.t: "The Grip of the Depression Loosens"
 change_usa.20.d: "After another year of tireless governance, the darkest hour of the economy is passing. The crisis is not over yet, but things are getting better."
 change_usa.20.a: "Keep Going"
 change_usa.21.t: "The Great Depression Is Over"
 change_usa.21.d: "Economic indicators are fully recovering, unemployment is falling and factories are running at full capacity — the Great Depression is finally over."
 change_usa.21.a: "The American Recovery!"
 change_usa.22.t: "The New Deal Takes Effect"
 change_usa.22.d: "President Roosevelt's New Deal is being implemented across the board: banking reform, work relief, agricultural and industrial recovery... the New Deal is changing the nation."
 change_usa.22.a: "Begin the New Deal"
 change_usa.23.t: "Public Works Completed"
 change_usa.23.d: "A public project has been completed across the country; new infrastructure adds strength to the recovery."
 change_usa.23.a: "Well Done"

 USA_new_deal_underway_flag: "The New Deal is Underway"
 USA_gd_mississippi_valley: "Mississippi Valley Project"
 USA_gd_mississippi_valley_desc: "Undertake large-scale water engineering in the Mississippi Valley, building a level-1 dam and infrastructure in two states (Mississippi and Louisiana).\n\n(Consumes 15 civilian factories for 180 days while active)"
 USA_gd_rearmament_mission: "Rearmament Procurement Underway"
 USA_gd_rearmament_mission_desc: "Arms orders are flowing through the production lines; the factories are running at full capacity..."

 USA_military_industrial_complex: "The Military-Industrial Complex"
 USA_military_industrial_complex_desc: "Arms orders pour in endlessly; the armament industry and the Pentagon form a tight community of interests, and the industrial machine runs at full tilt."
 USA_gd_work_relief_effect_tt: "Starts the 30-day 'Public Works Underway' task. On completion: adds 1 infrastructure level to a random US core state with infrastructure below 5, and reduces the 'Ease the Depression' countdown by 30 days."
 USA_gd_reject_new_deal_effect_tt: "Reduces the 'Ease the Depression' countdown by 270 days (removing one Depression level almost instantly), but removes 'The New Deal is Underway' and all New Deal decisions are lost."
 USA_gd_emergency_banking_effect_tt: "Stability +5%, Political Power +50, and the 'Ease the Depression' countdown is reduced by 10 days."
 USA_gd_agricultural_adjustment_effect_tt: "Runs for 90 days (Consumer Goods −5% while active). On completion: Stability +2% and the 'Ease the Depression' countdown is reduced by 10 days."
 USA_gd_national_recovery_effect_tt: "Runs for 120 days (Civilian factory construction +10%, factory efficiency gain +10% while active). On completion: Stability +2% and the 'Ease the Depression' countdown is reduced by 15 days."
 USA_gd_wpa_effect_tt: "Runs for 90 days (Building construction +15% while active). On completion: Stability +2%, War Support +2% and the 'Ease the Depression' countdown is reduced by 10 days."
 USA_gd_tva_effect_tt: "Runs for 180 days (consuming 15 civilian factories while active). On completion: a level-1 dam and infrastructure in both Tennessee and Alabama."
 USA_gd_mississippi_valley_effect_tt: "Runs for 180 days (consuming 15 civilian factories while active). On completion: a level-1 dam and infrastructure in both Mississippi and Louisiana."
 USA_gd_research_boost_effect_tt: "Runs for 120 days (Research speed +15% while active). On completion: the 'Ease the Depression' countdown is reduced by 5 days."
 USA_gd_nya_effect_tt: "Runs for 60 days (Conscription factor +5% while active). On completion: Manpower +1000 and the 'Ease the Depression' countdown is reduced by 5 days."
 USA_gd_rearmament_orders_effect_tt: "Starts the 90-day 'Rearmament Procurement Underway' task. On completion: gain 2 military factories, +15 army/navy/air experience, and the 'Ease the Depression' countdown is reduced by 5 days."
 change_usa.24.t: "Tennessee Valley Project Completed"
 change_usa.24.d: "The dam and supporting infrastructure in the Tennessee Valley are complete; power and irrigation will drive the whole region's recovery."
 change_usa.24.a: "The Dam Is Finished!"
 change_usa.25.t: "Mississippi Valley Project Completed"
 change_usa.25.d: "The dam and supporting infrastructure in the Mississippi Valley are complete; floods are contained and shipping and power enter a new chapter."
 change_usa.25.a: "The Dam Is Finished!"
 USA_gd_public_works_flag: "Public Works Underway"
 USA_gd_rearmament_flag: "Rearmament Procurement Underway"

 USA_american_industry_dynamic_modifier: "American Industry"
 USA_american_industry_dynamic_modifier_desc: "American industrial capacity rises and falls with the Great Depression. From idle smokestacks to roaring assembly lines, the fate of American factories mirrors the nation's slow climb back to prosperity."

 change_usa.26.t: "American Industry Status Update"
 change_usa.26.d: "The Great Depression has entered a new phase, and American industrial capacity is adjusting accordingly. Smoke rises again from the smokestacks, and the assembly lines slowly pick up speed."
 change_usa.26.a: "Industry Adjusts Accordingly"
