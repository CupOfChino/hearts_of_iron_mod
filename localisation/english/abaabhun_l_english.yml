 PRC_land_reform: "Land Reform"
 PRC_land_reform_desc: "In the old semi-colonial, semi-feudal China, the feudal land system persisted. Landlords and rich peasants, constituting less than 10% of the rural population, owned 70%–80% of the arable land. Rent rates commonly took 50% or more of the harvest, reaching 70%–80% or higher in some areas. The land reform movement shattered the feudal chains binding peasants for thousands of years, transforming the old rural production relations. This earth-shaking change liberated hundreds of millions of peasants politically and economically, unleashing immeasurable revolutionary fervor."
 PRC_Valuing_the_handicraft_industry: "Valuing the Handicraft Industry"
 PRC_Valuing_the_handicraft_industry_desc: "Our country essentially lacks an industrial base and the conditions to develop industry. Therefore, we should focus on the handicraft industry."
 PRC_Expand_production_in_base_areas: "Expand Production in Base Areas"
 PRC_Construction_of_an_underground_factory: "Construct Underground Factories"
 PRC_Literacy_campaign: "Literacy Campaign"
 PRC_Rectification_movement: "Rectification Movement"
 PRC_Rectification_movement_desc: "The failure of the Fifth Counter-Encirclement Campaign was precisely due to ideological errors within the Party, nearly extinguishing the spark of the workers' and peasants' revolution. We must learn from this lesson and never repeat the same mistake."
 PRC_Comintern_aid: "Comintern Aid"
 PRC_Overseas_Chinese_donations: "Overseas Chinese Donations"
 PRC_Overseas_Chinese_donations_desc: "Patriotic overseas Chinese have raised a large amount of weapons for us; we should make good use of these hard-won arms."
 PRC_Rapid_industrialization: "Rapid Industrialization"
 PRC_Rapid_industrialization_desc: "The world situation is ever-changing. As a new major power, we remain a backward agricultural nation. Changing this reality is extremely difficult, but for national security, we must have the courage of a warrior cutting off his own arm."
