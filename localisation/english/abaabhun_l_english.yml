 PRC_commusic: "CCP Support for Japanese Communist Activities"
 PRC_commusic_desc: "The red ghost has returned to our side. If we can reduce red support below 5%, then no matter how much the CCP interferes, it will be difficult to cause trouble; if we let red support rise above 50%, then the red demon will threaten our regime with the support of the CCP."
 

