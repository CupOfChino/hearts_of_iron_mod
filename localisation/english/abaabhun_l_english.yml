 #####event######
 change_germany.0:0 "Changelog"
 change_germany.0.t:0 "Changelog"
 change_germany.0.d:0 "§R2026/07/03§! \n1. Completed adaptation for the new version and fixed some long-standing issues. \nPS: The author hasn't been motivated to play this game recently, so new content won't be added for now. Please bear with us. \n  Finally, if you have any §Rgood ideas§! or are §Rwilling to help§!, feel free to leave a message in the §RWorkshop comments§!."
 change_germany.0.a:0 "Acknowledged"

 change_germany.1:0 "German Imperial Succession Candidate"
 change_germany.1.t:0 "Choose the Emperor"
 change_germany.1.d:0 "Restoring the German Empire has widespread support. Now it's time to choose who shall ascend the throne.\nFirst is Wilhelm II, the former Emperor of Germany. His experience in governance is unmatched, and he will undoubtedly rule wisely. However, he has... unique views on foreign policy.\nSecond is Crown Prince Wilhelm III, the undisputed legitimate heir. Perhaps it's time to entrust the Empire to a younger generation.\nLast is Crown Princess Viktoria. After amending the succession law, she has become a rightful claimant. Germany's democracy takes a bold step forward."
 change_germany.1.a:0 "Undoubtedly, the Kaiser has more experience in ruling."
 change_germany.1.b:0 "Time for the old man to cash out."
 change_germany.1.c:0 "Germany's democracy takes a giant leap forward."

 change_germany.2:0 "Provide Aid to East Asian Powers"
 change_germany.2.t:0 "Provide Aid to East Asian Powers"
 change_germany.2.d:0 "East Asia is vast and resource-rich, close to key rubber sources. If we extend aid, they may support us in future conflicts. But the region is complex—boosting our influence is best achieved by helping China unify. Now, which faction should we support? The choice requires careful thought."
 change_germany.2.a:0 "Aid the PRC"
 change_germany.2.b:0 "Aid the ROC"

 change_germany.3:0 "Germany Offers Us Aid"
 change_germany.3.t:0 "Germany Offers Us Aid"
 change_germany.3.d:0 "Germany has expressed support for our unification of China. Of course, we must guarantee we won't join any war against Germany."
 change_germany.3.a:0 "Of course, why not?"

 change_germany.4:0 "The Triple Empire"
 change_germany.4.t:0 "The Triple Empire"
 change_germany.4.d:0 "Napoleon III proposes a Triple Empire alliance between Germany, Austria-Hungary, and France to dominate continental Europe. This will forge the world's most powerful military bloc.\nFor Britain, a massive threat now looms over the continent. They will stop at nothing to form a rival alliance to counter our hegemony, greatly hindering our expansion."
 change_germany.4.a:0 "A magnificent proposal! Let us join hands and reclaim our glory!"

 change_germany.5:0 "The Old Allies"
 change_germany.5.t:0 "The Old Allies"
 change_germany.5.d:0 "The Austro-Hungarian Empire has returned, and His Majesty has been crowned. It is time for us to reunite once more. Let our fury of revenge consume our enemies."
 change_germany.5.a:0 "Welcome back, loyal friend."

 change_germany.6:0 "Italy's Fate"
 change_germany.6.t:0 "Decide Italy's Fate"
 change_germany.6.d:0 "Aside from Britain, only Italy remains as a major European power. Now, it's time for Italy to choose: will they go out with dignity, or shall we help them do so?"
 change_germany.6.a:0 "Let them decide for themselves."
 change_germany.6.b:0 "Why talk so much? Just crush them."

 change_germany.7:0 "In Dire Peril"
 change_germany.7.t:0 "In Dire Peril"
 change_germany.7.d:0 "Germany has issued us an ultimatum: accept their proposal, or face invasion. Perhaps we can appeal to Britain for help?"
 change_germany.7.a:0 "Surrender meow, surrender meow..."
 change_germany.7.b:0 "No, Italy's fate is not sealed!"
 change_germany.7.c:0 "Croak! British bastards, save me!"

 change_germany.8:0 "Italy Submits"
 change_germany.8.t:0 "Italy Submits"
 change_germany.8.d:0 "In the end, Italy accepted our proposal."
 change_germany.8.a:0 "No bloodshed—better this way."

 change_germany.9:0 "Italy Rejects Our Proposal"
 change_germany.9.t:0 "Italy Rejects Our Proposal"
 change_germany.9.d:0 "It seems Italy has made new friends? Daring to reject our offer... We were allies once. Sigh, I really don't want to fight."
 change_germany.9.a:0 "Naughty children must be punished harshly."

 change_germany.10:0 "Italy Seeks Our Protection"
 change_germany.10.t:0 "Italy Seeks Our Protection"
 change_germany.10.d:0 "Germany has bared its fangs at Italy. Facing the threat of the Triple Empire, Italy knows it stands no chance and seeks our protection. Even if we protect Italy, Germany will likely still attack—but this could open a secondary front, relieving pressure in Eastern Europe. However, it may draw the Entente into war earlier. We must weigh our own and our allies' readiness before deciding."
 change_germany.10.a:0 "Tying down part of the Central Powers' forces? Why not?"
 change_germany.10.b:0 "We're still racing against time."

 change_germany.11:0 "Britain Refuses Shelter"
 change_germany.11.t:0 "Britain Refuses Shelter"
 change_germany.11.d:0 "Britain says: 'Given our allies' current war readiness, we must avoid direct conflict with the Central Powers.' In short—cowards."
 change_germany.11.a:0 "Bloody British cowards... guess we're doomed."
 change_germany.11.b:0 "Bloody British cowards... I'll haunt you even as a ghost!"

 change_germany.12:0 "Join the Faction"
 change_germany.12.t:0 "Invitation to Join"
 change_germany.12.d:0 "They invite us to fight side by side."
 change_germany.12.a:0 "Of course."
 change_germany.12.b:0 "Forget it."

 change_germany.13:0 "[Root.GetNameDefCap] Civil War Ends"
 change_germany.13.t:0 "[Root.GetNameDefCap] Reunified"
 change_germany.13.d:0 "The terrible civil war that ravaged our homeland has ended. Political reconciliation has been achieved. Our [Root.GetAdjective] people are united once more, ready to rebuild our great nation together. Enemies who hoped to exploit our divisions now face a united [Root.GetAdjective] state.\n\nThe new [Root.GetRulingIdeology] [Root.GetName] shall never be divided again!"
 change_germany.13.a:0 "Finally reunited!"

 change_germany.14:0 "Germany Invests in Our Oil Field Development"
 change_germany.14.t:0 "Germany Invests in Our Oil Field Development"
 change_germany.14.d:0 "Upon learning our domestic oil fields were underdeveloped due to technological limitations, our German allies generously shared their expertise and invested heavily in joint development. Thanks to German assistance, our oil production has surged dramatically."
 change_germany.14.a:0 "Allies should help each other."

 change_germany.15:0 "Rebuilding the Nation"
 change_germany.15.t:0 "Rebuilding the Nation"
 change_germany.15.d:0 "We have finally liberated our homeland from fascist rule—but at great cost. The fascists left our nation in ruins.\nNow that the civil war is over, it's time to focus on reconstruction. We will prove to our people that a future free from fascism is brighter than ever!"
 change_germany.15.a:0 "For a better tomorrow!"

 change_germany.16:0 "The Glory of the Prussian Army"
 change_germany.16.t:0 "The Glory of the Prussian Army"
 change_germany.16.d:0 "Military reforms are complete. We now declare: our army is a mighty force, inheriting the spirit of the Prussian military."
 change_germany.16.a:0 "Ready to strike!"

 change_germany.17:0 "Demand the Return of Alsace"
 change_germany.17.t:0 "Demand the Return of Alsace"
 change_germany.17.d:0 "Germany demands the return of Alsace-Lorraine."
 change_germany.17.a:0 "We're practically brothers anyway."
 change_germany.17.b:0 "Can't just hand it over."

 change_germany.18:0 "Concession?"
 change_germany.18.t:0 "Concession?"
 change_germany.18.d:0 "They demand we make concessions."
 change_germany.18.a:0 "Great opportunity."

 change_germany.19:0 "Naval Construction"
 change_germany.19.t:0 "Naval Construction"
 change_germany.19.d:0 "The enemy's navy is their strongest shield. Even if we dominate land and air, naval inferiority prevents us from threatening their homeland.\nOur admirals Raeder and Dönitz have drafted a detailed naval expansion plan. With sufficient resources, they will build a powerful Imperial Navy to break through the enemy's maritime barrier."
 change_germany.19.a:0 "Why not?"
 change_germany.19.b:0 "Not necessary."

 change_germany.20:0 "High Seas Fleet"
 change_germany.20.t:0 "High Seas Fleet"
 change_germany.20.d:0 "Our fleet has taken shape, becoming a formidable force on the open seas. But this is far from enough. We shall continue to build in secret, expanding our navy to finally crush the Royal Navy in the next great war!"
 change_germany.20.a:0 "Keep launching ships!"

 change_germany.21:0 "Germany Massively Expands Navy"
 change_germany.21.t:0 "Germany Massively Expands Navy"
 change_germany.21.d:0 "Germany has suddenly begun massive naval expansion—an obvious challenge to our supremacy. We cannot surrender our advantage!"
 change_germany.21.a:0 "Bring it on."
 change_germany.21.b:0 "What's it to me?"

 change_germany.22:0 "Troop Training Complete"
 change_germany.22.t:0 "Troop Training Complete"
 change_germany.22.d:0 "Our troops trained in Germany have returned home."
 change_germany.22.a:0 "Good."

 change_germany.23:0 "Mobilization Level Increased"
 change_germany.23.t:0 "Mobilization Level Increased"
 change_germany.23.d:0 "Through our relentless efforts, our mobilization level has improved!"
 change_germany.23.a:0 "Excellent."

 change_germany.24:0 "War Mobilization"
 change_germany.24.t:0 "War Mobilization Act"
 change_germany.24.d:0 "War has broken out. It's time to choose our mobilization strategy: slow but comprehensive total mobilization, or rapid mobilization?"
 change_germany.24.a:0 "Slow but comprehensive total mobilization"
 change_germany.24.b:0 "Rapid total mobilization"

 change_germany.25:0 "Mechanical Design Bureau Completed"
 change_germany.25.t:0 "Mechanical Design Bureau Completed"
 change_germany.25.d:0 "Under the Kaiser's leadership, the Mechanical Design Bureau has been established. It will ensure our future military designs surpass those of other nations."
 change_germany.25.a:0 "Excellent."

 change_germany.26:0 "Timely Mobilization Complete"
 change_germany.26.t:0 "Timely Mobilization Complete"
 change_germany.26.d:0 "Through our relentless efforts, our war mobilization plan is complete—ensuring we're ready for any conflict that may arise."
 change_germany.26.a:0 "o_O"

 change_germany.27:0 "Absolute Continental Hegemony"
 change_germany.27.t:0 "Absolute Continental Hegemony"
 change_germany.27.d:0 "With the last nation falling under our control, continental Europe is now largely in our grasp."
 change_germany.27.a:0 "Our alliance is unstoppable."

 change_germany.28:0 "Newbie?"
 change_germany.28.t:0 "§RNeed a beginner's starter pack?§!"
 change_germany.28.d:0 "Due to extensive §Roptimizations§! to AI §Runit templates§! and §Rproduction lines§!, and the presence of some §R'Martian' troops§! (§Ractual difficulty is lower than dedicated AI-enhancement mods§!), inexperienced players may struggle and get crushed quickly, ruining the experience.\nTo help, we've prepared a special player starter pack. If you're not confident in high-difficulty mods, we recommend taking it.\n§RPS.§! The mod only helps AI with §RMartian troops§! and only Germany gets one §Rsynthetic refinery§!. There are §Rabsolutely no§! hidden AI-only buffs. Any buff the AI gets, players can obtain through normal gameplay—§Roften even more, due to AI's stupidity§!. And AI 'Martian' troops §Rdo NOT include planes or ships§!—only extra land units.\n§RAttached this image just because it's too hilarious.§!"
 change_germany.28.a:0 "I've beaten AI-enhanced mods. This weak AI is just pathetic."
 change_germany.28.b:0 "I'm here to enjoy the game, §Yso give me a little buff§!"
 change_germany.28.c:0 "§RBaby's Bath, launch!!§!"
 change_germany.28.e:0 "§RIf I say I'm coming in a wheelchair, will you go easy on me?§!"

 change_germany.29:0 "Aid to East Asia"
 change_germany.29.t:0 "Aid to East Asia"
 change_germany.29.d:0 "Japan is invading China. If we aid China, they may side with us after the war, giving us a powerful ally in East Asia."
 change_germany.29.a:0 "The more friends, the better"
 change_germany.29.b:0 "What East? What Asia? Never heard of it"

 change_germany.30:0 "Aid from the Allies"
 change_germany.30.t:0 "Unexpected Aid"
 change_germany.30.d:0 "Germany and its allies have sent us aid. These supplies and support are crucial to our fight against the Japanese invaders."
 change_germany.30.a:0 "A timely help!"

 change_germany.31:0 "The Bold Eagle and the Awakening Dragon"
 change_germany.31.t:0 "The Bold Eagle and the Awakening Dragon"
 change_germany.31.d:0 "With the invaders driven back, Germany proposes that we join their camp. This is a great opportunity to strengthen ourselves and jointly maintain stability in East Asia."
 change_germany.31.a:0 "Not bad"
 change_germany.31.b:0 "Forget it..."

 change_germany.32:0 "Germany Supports a Unified China"
 change_germany.32.t:0 "Germany Supports a Unified China"
 change_germany.32.d:0 "After joining the German camp, they expressed support for us to unify all of China. This means we can end division and become a strong nation."
 change_germany.32.a:0 "Seize the opportunity!"

 change_germany.33:0 "Cultivating Japan"
 change_germany.33.t:0 "Cultivating Japan"
 change_germany.33.d:0 "China has fully sided with the Germans. We must take action! Japan has just emerged from the shadow of defeat; surely they have realized the importance of having allies. We will promise them East Asia in order to win them over. Faced with an existential threat, they cannot possibly refuse."
 change_germany.33.a:0 "Time to choose your destiny"

 change_germany.34:0 "Britain Invites Us to Join"
 change_germany.34.t:0 "Britain Invites Us to Join"
 change_germany.34.d:0 "Britain has not only invited us to join their alliance but also promised us all of China. This is a great opportunity to wash away our shame!"
 change_germany.34.a:0 "Excellent!"

 change_germany.35:0 "Japan Has Agreed"
 change_germany.35.t:0 "Japan Has Accepted"
 change_germany.35.d:0 "Japan has accepted our proposal. Now our influence in East Asia is balanced."
 change_germany.35.a:0 "Good."

 change_germany.36:0 "German Aid Completed"
 change_germany.36.t:0 "German Aid Completed"
 change_germany.36.d:0 "Germany's promised aid program has been completed. Now it's time for us to fulfill our promise."
 change_germany.36.a:0 "Of course"

 change_germany.37:0 "German Aid Completed"
 change_germany.37.t:0 "German Aid Completed"
 change_germany.37.d:0 "Germany's promised aid program has been completed. Now it's time for us to fulfill our promise."
 change_germany.37.a:0 "Of course"

 change_germany.38:0 "Germany Invites Us to Join"
 change_germany.38.t:0 "Germany Invites Us to Join"
 change_germany.38.d:0 "After their great victory on the battlefield, the Germans have extended an olive branch: as long as we help them defeat the Entente, all our demands will be met."
 change_germany.38.a:0 "A good deal"
 change_germany.38.b:0 "Better not"

 change_germany.39:0 "Central America Agrees"
 change_germany.39.t:0 "Central America Agrees"
 change_germany.39.d:0 "Having witnessed the strength of our alliance and the weakness of our enemies, Central America has finally chosen to join us and fight for our coalition."
 change_germany.39.a:0 "The right choice"

 change_germany.40:0 "Central America Refuses"
 change_germany.40.t:0 "Central America Refuses"
 change_germany.40.d:0 "In the end, Central America turned down our proposal and chose to remain neutral in this global war."
 change_germany.40.a:0 "Fine..."


 change_france.0:0 "Welcome to Back to Optimization, meow!"
 change_france.0.t:0 "Welcome to Back to Optimization, meow!"
 change_france.0.d:0 "Welcome, meow! To get the full experience, please select the desired timeline in the 'Back to' mod settings at the beginning of the game.\n This mod enhances AI to a certain extent. If you've chosen the corresponding enhancement option, the target nation will gain decisions to spawn 'Mars troops' and equipment. For example, in the Three Emperors' League, AI for Germany, Hungary, France, Britain, the USA, and the USSR will receive the Mars troops decision; whichever nation you choose in other regions will similarly gain the Mars troops decision.\n The basic framework of the mod's timeline is now preliminarily complete, with content still being refined. Personally, I'm not entirely satisfied with the current quality, but to be honest, I often lose motivation while working on this mod (sadness)\n I initially created this mod purely for my own enjoyment, wanting to improve my personal gameplay experience, and before I knew it, I had created this much content.\n Please leave a comment if you encounter bugs or events that fail to trigger! Although future update timing isn't guaranteed, I will fix any bugs as soon as possible. ^.^"
 change_france.0.a:0 "Acknowledged"

 change_france.1:0 "Appease the German Emperor"
 change_france.1.t:0 "Alliance with the German Emperor"
 change_france.1.d:0 "Germany and our nation have long disputed the Alsace region. If we voluntarily cede this area to Germany, the German Emperor surely won't refuse. But should we really do this?"
 change_france.1.a:0 "Let's first see the German Emperor's attitude"
 change_france.1.b:0 "Let's just do it"

 change_france.2:0 "The German Emperor's response to Napoleon's desire for direct alliance"
 change_france.2.t:0 "Napoleon wants to laugh off past grievances"
 change_france.2.d:0 "Although our nation and France have always harbored hatred, since they've taken the initiative to back down, perhaps we can unite? Considering we are the sacred body that attracts turncoats, perhaps we should demand some sincerity from France?"
 change_france.2.a:0 "Come on, buddy, we were just kids playing around before"
 change_france.2.b:0 "The rules of the江湖 require a token of sincerity"
 change_france.2.c:0 "Who the hell are you calling buddy?"

 change_france.3:0 "The German Emperor demands Alsace-Lorraine"
 change_france.3.t:0 "Germany requests discussion on the status of Alsace-Lorraine"
 change_france.3.d:0 "As expected, Germany still covets Alsace-Lorraine. It seems we won't gain Germany's complete trust without making some concessions."
 change_france.3.a:0 "To the German Emperor: Impossible"
 change_france.3.b:0 "Let the two nations henceforth be eternally united"
 change_france.3.c:0 "But resource extraction rights must still belong to us"

 change_france.4:0 "The German Emperor's Decision 2"
 change_france.4.t:0 "France demands extraction rights"
 change_france.4.d:0 "France agrees to return the Alsace-Lorraine region. However, considering the coal and iron ore in this region are of great significance to them, France requests to retain their resource extraction rights."
 change_france.4.a:0 "This is a perfect proposal"
 change_france.4.b:0 "Everything in Alsace-Lorraine belongs to Germany"

 change_france.5:0 "The German Emperor's Decision 3"
 change_france.5.t:0 "France returns Alsace-Lorraine"
 change_france.5.d:0 "Our dear French friends are willing to return Alsace-Lorraine and form a friendly alliance with our nation. This is simply incredible! We open our arms to welcome them."
 change_france.5.a:0 "In fact, Germany and France have long been one family."

 change_france.6:0 "Germany rejects the proposal"
 change_france.6.t:0 "Germany rejects our proposal"
 change_france.6.d:0 "The greedy Germans still harbor their despicable intentions. Despite our enormous concessions, Germany shows no gratitude."
 change_france.6.a:0 "Foolish"

 change_france.7:0 "France rejects the proposal"
 change_france.7.t:0 "France rejects our further proposal"
 change_france.7.d:0 "The ignorant French have rejected the proposal to exchange territory for protection. Even if we cannot obtain it at the negotiating table, the Empire will reclaim our territory by force."
 change_france.7.a:0 "Foolish"

 change_france.8:0 "France demands unification"
 change_france.8.t:0 "France demands unification"
 change_france.8.d:0 "The Emperor of France has issued us an ultimatum: surrender voluntarily and you shall still retain a marquisate, or be crushed by their army."
 change_france.8.a:0 "The wise adapt to circumstances, meow"
 change_france.8.b:0 "Who the hell do you think you are?"

 change_france.9:0 "Our national prestige has been challenged"
 change_france.9.t:0 "The Iberian nation chooses to refuse"
 change_france.9.d:0 "This morning, our diplomat received a reply from the Iberian nation. They said, 'Has the Emperor of France lost his mind? Wanting our nation to surrender? Pah!'\nIt seems we should let them know who's boss."
 change_france.9.a:0 "They have just signed their own death warrant"

 change_france.10:0 "France demands unification"
 change_france.10.t:0 "France demands unification"
 change_france.10.d:0 "The Emperor of France has issued us an ultimatum: surrender voluntarily and you shall still retain a marquisate, or be crushed by their army."
 change_france.10.a:0 "The wise adapt to circumstances, meow"
 change_france.10.b:0 "Who the hell do you think you are?"

 change_france.11:0 "Factory Conversion"
 change_france.11.t:0 "Factory Conversion"
 change_france.11.d:0 "Since you want to convert factories, which type of factory do you want to convert to which other type, meow ^·^~"
 change_france.11.a:0 "Military to Civilian"
 change_france.11.b:0 "Civilian to Military"

 change_france.12:0 "Civilian to Military"
 change_france.12.t:0 "Civilian to Military"
 change_france.12.d:0 "Alright meow ^·^~ So how many factories would you like to convert, meow ^·^~"
 change_france.12.a:0 "Convert three"
 change_france.12.b:0 "Convert six"

 change_france.13:0 "Military to Civilian"
 change_france.13.t:0 "Military to Civilian"
 change_france.13.d:0 "Alright meow ^·^~ So how many factories would you like to convert, meow ^·^~"
 change_france.13.a:0 "Convert three"
 change_france.13.b:0 "Convert six"

 change_france.14:0 "Submit or Die"
 change_france.14.t:0 "Submit or Die"
 change_france.14.d:0 "The French Empire has issued an ultimatum: submit to them and jointly develop the oil fields—we won't take your extraction rights—or they will come and take it themselves."
 change_france.14.a:0 "Surrender meow, surrender meow"

 change_france.15:0 "Mobilization not yet complete"
 change_france.15.t:0 "Mobilization not yet complete"
 change_france.15.d:0 "Mobilization is not yet complete, yet world war has already arrived. We need time to mobilize; we hope time will be on our side..."
 change_france.15.a:0 "Accelerate mobilization!"

 change_france.16:0 "Mobilization level increased"
 change_france.16.t:0 "Mobilization level increased"
 change_france.16.d:0 "Fortunately, after two months of propaganda, our war mobilization has progressed further."
 change_france.16.a:0 "Good"

 change_france.17:0 "The Paris Conference"
 change_france.17.t:0 "A Special Meeting"
 change_france.17.d:0 "The flags of Berlin, Paris, and Budapest overlap in the Hall of Mirrors at Versailles, with portraits of Kaiser Wilhelm II, Napoleon IV, and Archduke Otto hanging high. Staff officers spread out a yellowed copy of the 'Treaty of Versailles,' and the Three Emperors' representatives use red ink to strike out clauses such as 'Rhineland demilitarized zone' and 'disarmament provisions,' signing the 'Final Three Emperors' Protocol.'"
 change_france.17.a:0 "'The shackles of 1918 are broken; the anvil of 1941 shall be forged by us!'"

 change_france.18:0 "Accelerate Arms Buildup"
 change_france.18.t:0 "Accelerate Arms Buildup"
 change_france.18.d:0 "The steel mills of the Ruhr belch black smoke, tank assembly lines in Lorraine roar day and night, and the 'Toldi' heavy tank prototype rumbles over farmland on the Hungarian plains. The cabinets of the three nations announce the 'Total Productivity Control Act,' conscripting women and colonial laborers into arms factories. Newspaper headlines scream:"
 change_france.18.a:0 "'Every shell shall be engraved with the name of a Versailles traitor!'"

 change_france.19:0 "Joint Exercise"
 change_france.19.t:0 "Joint Military Exercise"
 change_france.19.d:0 "\"General, how is my army's training going?\"\n\"Everything is proceeding as planned. Various new weapons are being mass-issued to army groups, and officers have undergone systematic training to adapt to modern warfare. However, frontline units still lack experience in modern warfare. Before the major conflict, we need a large-scale exercise to help our soldiers understand the war that's coming.\"\n\"I understand. I will contact our allies to conduct a large-scale military exercise. Let's call it:\""
 change_france.19.a:0 "\"Joint Sword\""

 change_france.20:0 "Mobilization Speech"
 change_france.20.t:0 "Mobilization Speech"
 change_france.20.d:0 "\"The economic collapse of the Tal'darim is imminent. For all who wish to leave that wasteland to seek a better life, Aiur is a safe haven for you all.\"\n\"To protect the Nerazim from the ravages of the Zerg, I have done more than their own Dark Prelate. No matter how they slander me, I will continue to strive for the greatest interests of all the Protoss.\"\n\"As your Hierarch, I have led the Protoss to expand the territory and economy of the Dalaran Dominion. We will continue to grow, using action to respond to those naysayers who are unwilling to move forward with us.\"\n\"Countless outstanding sons and daughters of the Dalaran Armed Forces are constantly guarding the gates of our homeland, but they stand alone. All who enlist today will receive a brand-new solar axe.\"\n\"Radicals and dissidents hope you will abandon years of peace and prosperity at the sound of gunfire. They lack the courage and ability to lead the Protoss through a dangerous galaxy.\"\n\"The rule of law is our lifeline, yet it faces unprecedented challenges. I will restore the glory of our Protoss and never bow to any alien force.\"\n\"I have tamed humanity, crushed the Zerg. Now their creators want to take everything we have. Always remember, who is the one who can best protect you.\"\n\"Do not believe the slander, I am not some Purifier.\""
 change_france.20.a:0 "What the hell is this? Is this even Earth anymore?"

 change_france.21:0 "Central Powers Air Force invades Entente airspace"
 change_france.21.t:0 "Central Powers Air Force invades Entente airspace"
 change_france.21.d:0 "\"Team A, gather intelligence\"\n\"Team B, intercept the Entente aircraft with me\"\n\"Lieutenant, 12 enemy aircraft at 7 o'clock\"\n\"Team B, conduct interception, lure the enemy into attack, prepare to disengage at any moment; Team A, move towards the border, prepare to rendezvous with reinforcements.\""
 change_france.21.a:0 "\"Let's see if the Entente can keep their cool\""

 change_france.22:0 "Central Powers Navy conducts large-scale sortie"
 change_france.22.t:0 "Central Powers Navy conducts large-scale sortie"
 change_france.22.d:0 "The German High Seas Fleet, the French Strasbourg battleship division, and the Hungarian converted merchant raider fleet gather at Wilhelmshaven. The Scharnhorst bombards abandoned target ships at Scapa Flow, French submarines surface at the Suez Canal entrance flying the Imperial flag, and the Hungarian 'Riverbank Killer' torpedo boat flotilla advances along the Danube towards the Iron Gate Gorge."
 change_france.22.a:0 "'Our anchor chains are cast off; next docking will be on enemy shores!'"

 change_france.23:0 "Central Powers troops mass at the border"
 change_france.23.t:0 "Central Powers troops mass at the border"
 change_france.23.d:0 "Large numbers of troops are gradually deployed along the border with the Entente Powers, with both blocs at each other's throats along the frontier."
 change_france.23.a:0 "War is imminent"

 change_france.24:0 "French Army border skirmish"
 change_france.24.t:0 "French Army border skirmish"
 change_france.24.d:0 "The French Army and British Army engaged in a small-scale conflict, punching, throwing stones, and clubbing each other with rifle butts, with a tacit understanding that no one fired their weapons. This farce ended when large reinforcements arrived from both sides, neither willing to back down. Ultimately, multiple soldiers from both sides were injured, and one French soldier died from severe injuries despite treatment."
 change_france.24.a:0 "I saw it, they started it"

 change_france.25.a:0 "Cross the Border"
 change_france.25.t:0 "Cross the Border"
 change_france.25.d:0 "Let us avenge the brave warriors who fell in the conflict!"
 change_france.25.a:0 "Charge!"

 change_france.26:0 "French Army crosses the border"
 change_france.26.t:0 "French Army crosses the border"
 change_france.26.d:0 "The French Army begins assaulting the enemy's defensive lines. As their ally, we will stand with them."
 change_france.26.a:0 "Fight!"

 change_france.27:0 "French Army crosses the border"
 change_france.27.t:0 "French Army crosses the border"
 change_france.27.d:0 "The French have finally dropped their pretense and begun attacking our ally's defensive lines. We must assist our ally."
 change_france.27.a:0 "Fight!"

 change_eng.1:0 "Anglo-French Alliance"
 change_eng.1.t:0 "Anglo-French Alliance"
 change_eng.1.d:0 "The old Central Powers have returned, like demons from hell, determined to bring the fury of revenge upon this world. The French government proposes a union, forming a military alliance to counter this impending vengeance."
 change_eng.1.a:0 "We have no choice"

 change_eng.2:0 "Triple Entente"
 change_eng.2.t:0 "Triple Entente"
 change_eng.2.d:0 "A powerful military alliance has emerged on the European continent, posing a massive threat. Of course, this idea isn't unique to us; the Soviet Union in the East and the United States in the West are also deeply wary of this alliance. What we must do now is set aside our grudges, unite, and avoid being picked off one by one."
 change_eng.2.a:0 "We have no choice"

 change_eng.3:0 "Britain proposes to set aside grudges"
 change_eng.3.t:0 "British government proposes to set aside grudges"
 change_eng.3.d:0 "The formation of the 'League of the Three Emperors' has put immense pressure on nations worldwide. The British government proactively approached us, suggesting we set aside our grudges. Only by uniting can we counter the 'League of the Three Emperors.' Otherwise, the only thing awaiting us is being trampled by cavalry."
 change_eng.3.a:0 "Yes, we have no choice"

 change_eng.4:0 "Britain invites us to join"
 change_eng.4.t:0 "Britain invites us to join"
 change_eng.4.d:0 "Britain invites us to join the Entente and promises to guarantee our safety."
 change_eng.4.a:0 "Alright"
 change_eng.4.b:0 "Forget it, too dangerous"

 change_eng.5:0 "Britain invites us to join"
 change_eng.5.t:0 "Britain invites us to join"
 change_eng.5.d:0 "Britain invites us to join the Entente and promises to guarantee our safety."
 change_eng.5.a:0 "Alright"
 change_eng.5.b:0 "Forget it, too dangerous"

 change_eng.6:0 "Rejected"
 change_eng.6.t:0 "Rejected..."
 change_eng.6.d:0 "It seems they are still afraid of the Central Powers' strength..."
 change_eng.6.a:0 "Then let them fend for themselves"

 change_eng.7:0 "Central Powers conduct large-scale military exercise!"
 change_eng.7.t:0 "Central Powers conduct large-scale military exercise"
 change_eng.7.d:0 "The Central Powers have recently conducted an ultra-large-scale exercise, focusing on training joint operations among various branches and coordination between the forces of different nations. This exercise is undoubtedly aimed at us."
 change_eng.7.a:0 "...Prepare to mobilize the army"

 change_eng.8:0 "Central Powers Air Force invasion!!"
 change_eng.8.t:0 "Central Powers Air Force invasion!!"
 change_eng.8.d:0 "The Central Powers' air force that invaded our airspace has been driven away. The Central Powers' increasingly bold actions are reminding us that a storm is approaching."
 change_eng.8.a:0 "..."

 change_eng.9:0 "Central Powers Navy unusual movements!!"
 change_eng.9.t:0 "Central Powers Navy unusual movements!!"
 change_eng.9.d:0 "According to a report from the British Royal Navy's 7th Fleet, the fleets of the French Empire and the German Empire sortied yesterday. The 7th Fleet chose to tail them and dispatched reconnaissance aircraft for surveillance. Their destination is currently unknown."
 change_eng.9.a:0 "Report any unusual enemy fleet movements immediately"

 change_eng.10:0 "Central Powers Army large-scale mobilization!!"
 change_eng.10.t:0 "Central Powers Army large-scale mobilization!!"
 change_eng.10.d:0 "Tensions rise! Our spy, before going dark, sent back one final重磅 message: The Central Powers have begun large-scale troop movements! Various corps are boarding trains and heading for the border!"
 change_eng.10.a:0 "Immediately mobilize the army, prepare to respond to surprise attacks at any moment!"

 change_eng.11:0 "French Army creates border friction!!!!"
 change_eng.11.t:0 "French Army creates border friction!!!!"
 change_eng.11.d:0 "The French Army disregarded warnings and擅自 entered our border, clashing with our soldiers. In this conflict, both sides tacitly agreed not to use weapons. Our soldiers, with tenacious will, repelled the troublemaking French forces. In this incident, multiple soldiers from both sides were injured, and one French soldier was seriously wounded."
 change_eng.11.a:0 "Well done! But the other side definitely won't let this go easily"

 change_eng.12:0 "Marine Corps Training"
 change_eng.12.t:0 "Marine Corps Training"
 change_eng.12.d:0 "Considering future warfare, our British ally has invited us to establish a joint Marine Corps Training Committee responsible for modernizing marine corps training to prepare for future operations."
 change_eng.12.a:0 "Of course"

 change_eng.13:0 "Marine Corps Training Complete"
 change_eng.13.t:0 "Marine Corps Training Complete"
 change_eng.13.d:0 "After a period of training, our Marine Corps' strength has greatly improved! They will become daggers, piercing through enemy coastal defenses and striking straight at the enemy's heart!"
 change_eng.13.a:0 "Cool!"

 change_eng.14:0 "Enemy abnormal troop movements"
 change_eng.14.t:0 "Enemy abnormal troop movements"
 change_eng.14.d:0 "Intelligence indicates that enemy forces are abnormally gathering at various ports, seemingly foreshadowing a massive amphibious operation about to unfold..."
 change_eng.14.a:0 "Don't get distracted"



 

 change_sov.1:0 "The Soviet Union Invites East Asia"
 change_sov.1.t:0 "The Soviet Union Invites East Asia"
 change_sov.1.d:0 "After joining the Triple Entente, the Soviet Union has extended an olive branch to us. Should we fight side by side with them? Or should we remain neutral?"
 change_sov.1.a:0 "The Three Emperors' League is our greatest threat"
 change_sov.1.b:0 "We don't need to get involved in this mess"

 change_sov.2:0 "Troops Blocked from Entering Bukovina!"
 change_sov.2.t:0 "Troops Blocked from Entering Bukovina!"
 change_sov.2.d:0 "The cunning Austro-Hungarian crown prince played both sides. He verbally agreed at the negotiating table for our troops to enter Bukovina as a buffer zone. However, as our army approached, they were blocked by Austro-Hungarian forces, who declared they would defend the border at all costs—even by force. For prudence, our commanding officer chose to stand firm rather than force entry."
 change_sov.2.a:0 "We should avoid escalating the conflict"
 change_sov.2.b:0 "We will take what we demand by force"

 change_sov.3:0 "Final Ultimatum"
 change_sov.3.t:0 "Final Ultimatum"
 change_sov.3.d:0 "Moscow has issued us a final ultimatum, demanding we lay down our arms, cease resistance, and submit to Moscow's control."
 change_sov.3.a:0 "No chance of winning—we surrender"
 change_sov.3.b:0 "We will never surrender!"

 change_sov.4:0 "Finland Rejects Our Proposal"
 change_sov.4.t:0 "Finland Rejects Our Proposal"
 change_sov.4.d:0 "Finland rejects our proposal"
 change_sov.4.b:0 "If they won't drink the wine, they'll taste the punishment"

 change_sov.5:0 "Final Ultimatum"
 change_sov.5.t:0 "Final Ultimatum"
 change_sov.5.d:0 "[Text to be filled]"
 change_sov.5.a:0 "Surrender"
 change_sov.5.b:0 "Fight"

 change_sov.6:0 "Tannu Tuva Rejects"
 change_sov.6.t:0 "Tannu Tuva Rejects"
 change_sov.6.d:0 "[Text to be filled]"
 change_sov.6.a:0 "Then let it begin"

 change_sov.7:0 "Final Ultimatum"
 change_sov.7.t:0 "Final Ultimatum"
 change_sov.7.d:0 "[]"
 change_sov.7.a:0 "Surrender"
 change_sov.7.b:0 "Fight"

 change_sov.8:0 "[Root.GetNameDefCap] Rejects Proposal"
 change_sov.8.t:0 "[Root.GetNameDefCap] Rejects Proposal"
 change_sov.8.d:0 "[Root.GetNameDefCap] rejects proposal"
 change_sov.8.a:0 "Your wings have grown strong, haven't they?"

 change_sov.9:0 "Accelerate Construction"
 change_sov.9.t:0 "Forge the Shield with Steel and Fire!"
 change_sov.9.d:0 "FOR --D Guidance \n Facing the restoration of European reactionary monarchs and the encirclement by imperialist blocs, the Soviet motherland has entered its most dangerous moment! According to a special resolution of the Central Committee of the CPSU(B), the Third Five-Year Plan will enter the 'Defense Industrialization Phase' ahead of schedule. Tens of thousands of Youth Shock Brigades are heading to Siberia;共青团 members march with portraits of Lenin, building railways, developing mines, and constructing new tractor factories on the permafrost. The furnaces of Magnitogorsk burn day and night, the turbines of the Dnieper Hydroelectric Station run at full speed—let those crown-wearing parasites know that the proletarian fist is always ready to crush any invader!"
 change_sov.9.a:0 "Continue construction!"

 change_sov.10:0 "Siberian Construction Completed"
 change_sov.10.t:0 "Siberian Construction Completed"
 change_sov.10.d:0 "With the support of the masses, the Central Committee-led Great Siberian Development Plan has been successfully completed! The entire Siberia is now connected by rail, and the trans-Siberian railway has been fully refurbished. This is the result of everyone's united effort!"
 change_sov.10.a:0 "A great achievement!"

 change_sov.11:0 "Ural Industrial Zone Completed"
 change_sov.11.t:0 "Ural Industrial Zone Completed"
 change_sov.11.d:0 "FOR --D Guidance \n With the final blast furnace ignited in Chelyabinsk, the Ural-Siberian Industrial Belt is officially complete! This 2,000-kilometer-long industrial cluster includes 47 modern factories, 12 military-industrial complexes, and 3 secret science cities. A report from Moscow states: the new industrial zone can produce 600 T-34 tanks or 250 Il-2 attack aircraft per month. Comrade Stalin emphasized in a congratulatory telegram: 'While Paris and Berlin still parade their decay with gilded carriages, Soviet workers have already built an indestructible steel Great Wall with lathes and furnaces!' Now, let us pin the medals of labor heroes onto their sturdy work uniforms!"
 change_sov.11.a:0 "The Ural Mountains are our arsenal!"

 change_sov.12:0 "Soviet Reinforcement Activated"
 change_sov.12.t:0 "Soviet Reinforcement Activated"
 change_sov.12.d:0 "Please note: Soviet Reinforcement has been activated: \n\n When the Soviet Union is in a defensive war against a major power, the 'Great Patriotic War' mechanic will trigger. This reinforcement ensures that the USSR can counter-push against a mod-enhanced Germany, rather than collapse instantly. The Soviet Union will gain increasingly powerful buffs and stronger 'Mars Forces' as surrender tendency increases. If the 'Three Emperors' League' is activated, the Soviet 'Great Patriotic War' decision group will become even stronger to ensure resistance against the entire Entente."
 change_sov.12.a:0 "§RI understand§!"

 change_sov.13:0 "Great Patriotic War Begins"
 change_sov.13.t:0 "Great Patriotic War Begins"
 change_sov.13.d:0 "The enemy surges like a tide, and the front lines are in crisis everywhere. The great motherland has entered its most dangerous moment! North or south, young or old, every person bears the duty to defend the soil!"
 change_sov.13.a:0 "The Soviet Union shall not perish!"

 change_sov.14:0 "Soviet Great Patriotic War Level Increased"
 change_sov.14.t:0 "Soviet Great Patriotic War Level Increased"
 change_sov.14.d:0 "The Soviet Union has shown its resilience."
 change_sov.14.a:0 "The Soviets might truly be unshakable"

 change_sov.15:0 "Soviet Great Patriotic War Reaches Maximum"
 change_sov.15.t:0 "Soviet Great Patriotic War Reaches Maximum"
 change_sov.15.d:0 "Soviet war mobilization has reached its peak! Every step forward will come at a terrible cost. We are now bogged down in a quagmire against the Soviets."
 change_sov.15.a:0 "Damn it!"

 change_sov.16:0 "Great Patriotic War Level Increased"
 change_sov.16.t:0 "Great Patriotic War Level Increased"
 change_sov.16.d:0 "'The red beast of the East is awakening! Their factories never stop, their soldiers' morale is high, and pressure on the front lines grows daily. We underestimated them—this war is far more terrible than anticipated.'"
 change_sov.16.a:0 "Damn it!"

 change_sov.17:0 "Great Patriotic War Fully Mobilized"
 change_sov.17.t:0 "Great Patriotic War Fully Mobilized"
 change_sov.17.d:0 "From Leningrad to the Caucasus, from the Urals to Moscow—the entire nation has transformed into a war machine. Millions of soldiers stand ready, factories operate day and night, every cannon, every tank, every soldier awaits the call of destiny. This is the motherland's hour, and the beginning of the enemy's nightmare."
 change_sov.17.a:0 "Victory is in sight—the enemy will be swept away by our counteroffensive!"

 change_sov.18:0 "Failed to Stop Red Square Parade"
 change_sov.18.t:0 "Failed to Terminate Red Square Parade in Time"
 change_sov.18.d:0 "On Red Square in Moscow, the final parade unit marches through the biting wind. \n Despite repeated warnings from the General Staff that German vanguards are only 30 kilometers from the capital, despite each Western Front division having less than 40% of its strength, the Kremlin ultimately failed to cancel this dangerous parade. As Soviet tank treads roll over the frost-covered square, desperate telegrams flood in from the front—the 16th Army's defenses have cracked at Klin, and the Moscow garrison, meant to reinforce, is now saluting Lenin's Mausoleum with rifles covered in frost. \n The general receiving the telegram sighs deeply:"
 change_sov.18.a:0 "\"I have a bad feeling, Comrade Chief of Staff. The frontline units are already at their limit. Perhaps this will become the turning point of the war.\""

 change_sov.19:0 "Red Square Parade Failure"
 change_sov.19.t:0 "Red Square Great Defeat"
 change_sov.19.d:0 "The sky over Moscow is as dark as lead; the parade hasn't ended and the front has already collapsed. \n After the 16th Army was torn apart by German armored units at Klin, it rapidly disintegrated. The last barrier to Moscow—Istra Line—has fallen. Meanwhile, on Red Square, a disordered infantry formation still performs, soldiers shouting slogans no one can hear; while the radio is flooded with desperate cries of 'Requesting support' and 'We are surrounded,' deepening the gloom of the sky. \n Less than six hours after the parade ends, German armored vanguards are only 25 kilometers from Moscow. The communication room's phone rings nonstop. A pale-faced commissar walks into the meeting room: 'Comrade, this is not an exercise... Moscow is truly finished.'"
 change_sov.19.a:0 "It's over. All is lost."

 change_sov.20:0 "Battle of Kursk Ends in Victory"
 change_sov.20.t:0 "Battle of Kursk Ends in Victory"
 change_sov.20.d:0 "Smoke still lingers over the Kursk steppes, German tank wrecks smoldering in the sun. The Red Army not only withstood the fiercest German armored assault but delivered a devastating blow to the enemy at Prokhorovka. \n Forces have begun a full counteroffensive, breaking through at Orel and Belgorod. Berlin realizes for the first time: they can no longer launch large-scale offensives. This is the Soviet Union's iron will against the Nazi war machine—a decisive victory."
 change_sov.20.a:0 "Forward, comrades!"

 change_sov.21:0 "Battle of Kursk Lost"
 change_sov.21.t:0 "Battle of Kursk Lost"
 change_sov.21.d:0 "We underestimated the enemy's armored striking power. Despite committing elite armored units, our lines cracked under the enemy's new armored tactics and air support. \n Tactical errors, miscalculations, logistical shortages—every problem erupted at once. Kursk did not become our road to victory, but a graveyard of blood and steel."
 change_sov.21.a:0 "\"Our spear simply couldn't pierce their armor.\""

 change_sov.23:0 "Soviet Victory at Kursk"
 change_sov.23.t:0 "Soviet Victory at Kursk"
 change_sov.23.d:0 "The High Command falls silent. Frontline reports indicate the Allied main armored group has suffered heavy losses, with elite armored units nearly halved. More shockingly, the Red Army not only held its ground but swiftly launched a counteroffensive. \n Intelligence estimates the Soviets delivered over 800 railcar loads of supplies to Kursk daily—their war potential far exceeds expectations. This battle marks the Allies' loss of strategic initiative."
 change_sov.23.a:0 "\"Damn it, how do the Soviets have so many tanks now?!\""

 change_sov.24:0 "Soviet Defeat at Kursk"
 change_sov.24.t:0 "Soviet Defeat at Kursk"
 change_sov.24.d:0 "After receiving the frontline report, the High Command finally relaxes. After days of fierce fighting, the Red Army's counterattack has been crushed, with vast numbers of Soviet tanks destroyed on open ground like a steel graveyard. \n Allied forces have stabilized the line and launched local counterattacks in some areas. A message comes from the leader's office: 'The myth of the tenacious Bolsheviks has finally been shattered.' \n Yet no one dares call it a complete victory—the cost has been too great."
 change_sov.24.a:0 "The Soviets were indeed at the end of their strength"

 change_sov.25:0 "Minsk Victory"
 change_sov.25.t:0 "Minsk Victory"
 change_sov.25.d:0 "The enemy attempted to break through our lines with lightning speed, but our soldiers held them back with flesh and blood. In the forests and hills around Minsk, they paid a heavy price without achieving their strategic goal. \n Soviet strength has once again proven here: even the fiercest assault cannot shake our determination to defend the motherland."
 change_sov.25.a:0 "The enemy came fiercely, but I remain unmoved"

 change_sov.26:0 "Minsk Defeat"
 change_sov.26.t:0 "Minsk Defeat"
 change_sov.26.d:0 "Despite fierce resistance, the enemy's mechanized forces still tore through our lines. Multiple defensive positions around Minsk fell one after another, and the front fell into chaos. \n The command ordered a retreat to preserve combat strength. This is one of our darkest hours—but it also reminds us: the war has only just begun."
 change_sov.26.a:0 "\"Frontline units are conducting layered resistance and orderly retreat!\""

 change_sov.27:0 "Minsk Successfully Captured"
 change_sov.27.t:0 "Minsk Successfully Captured"
 change_sov.27.d:0 "A telegram arrives from the Eastern Front: 'Minsk has been taken.' \n Despite fierce resistance, our forces have finally occupied the city. Tank treads echo through the streets, and the former red flag has been replaced with a new emblem. \n This is an important step forward in the East."
 change_sov.27.a:0 "\"Bolsheviks, the real show has just begun\""

 change_sov.28:0 "Failed to Capture Minsk"
 change_sov.28.t:0 "Failed to Capture Minsk"
 change_sov.28.d:0 "The breakthrough failed to achieve expected results. Enemy forces conducted layered resistance around Minsk, our offensive stalled with heavy losses. \n However, this does not mean defeat—this is only the first round. We must learn from experience and wait for the next opportunity."
 change_sov.28.a:0 "Damn it!"

 change_sov.29:0 "Preparing for Kursk Battle"
 change_sov.29.t:0 "Soviet Massing Forces in Kursk Area"
 change_sov.29.d:0 "Red arrows on the map point to the Kursk salient, dozens of infantry divisions, mechanized corps, and tank armies quietly moving into position. \n Factories produce ammunition and equipment around the clock, railways packed with trains heading to the front. Marshal Zhukov stands in the command room, his gaze firm: 'This is not an ordinary defensive battle—we will deliver a fatal blow here.' \n The enemy is also gathering—but this time, we will strike first."
 change_sov.29.a:0 "\"Well, let's see what the Bolsheviks are capable of\""

 change_sov.30:0 "Preparing for Minsk Battle"
 change_sov.30.t:0 "Resistance Detected in Minsk Direction"
 change_sov.30.d:0 "Intelligence shows the enemy is massing large forces toward Minsk, preparing a major offensive. \n Our reconnaissance has detected enemy movements along the border. War clouds gather, the situation is tense. Command has issued orders: we must hold this strategic location at all costs. \n This will be a key test early in the war—we will face the enemy's true strength here for the first time."
 change_sov.30.a:0 "Crush them!"

 change_sov.31:0 "Preparing to Attack Kyiv"
 change_sov.31.t:0 "Preparing to Attack Kyiv"
 change_sov.31.d:0 "Red arrows on the map point to the lower Dnieper River, our forces are gathering from multiple directions. \n Kyiv is not only the political center of Ukraine but also the key gateway to southern resource zones. We will launch a decisive battle here."
 change_sov.31.a:0 "\"Bolsheviks, how will you take this punch?\""

 change_sov.32:0 "Kyiv Defense Victory"
 change_sov.32.t:0 "Kyiv Defense Victory"
 change_sov.32.d:0 "The enemy attempted to break through our lines with superior forces, but every brick of Kyiv became a symbol of resistance. \n On the banks of the Dnieper, in forests and hills, the Red Army withstood the fierce assault, dissolving the enemy's offensive into nothing. \n This is not just a tactical victory, but a powerful rebuke to the invaders—we will not give up an inch of land."
 change_sov.32.a:0 "The enemy is nothing special"

 change_sov.33:0 "Kyiv Defense Failed"
 change_sov.33.t:0 "Kyiv Defense Failed"
 change_sov.33.d:0 "Despite fierce resistance, the enemy still tore through our lines. Kyiv has fallen into enemy hands, frontline units forced to retreat eastward. \n Intelligence shows the enemy used a multi-point breakthrough tactic, making it hard for us to concentrate counterattacks. This is a heavy lesson—but it also reminds us: the war has only just begun. \n We will reclaim everything, but now we must preserve strength and wait for the right moment."
 change_sov.33.a:0 "\"The enemy is strong—don't rush!\""

 change_sov.34:0 "Successfully Captured Kyiv"
 change_sov.34.t:0 "Successfully Captured Kyiv"
 change_sov.34.d:0 "Telegram arrives: 'Kyiv has been taken.' \n Despite fierce resistance, our forces have finally occupied the city. Iron hooves echo through the streets, the former red flag replaced with a new emblem. \n This is an important step forward in the East. Of course, further east, countless cities await our conquest. But regardless, we have:"
 change_sov.34.a:0 "Another city taken"

 change_sov.35:0 "Failed to Capture Kyiv"
 change_sov.35.t:0 "Failed to Capture Kyiv"
 change_sov.35.d:0 "We thought we could take Kyiv quickly, but enemy resistance was far fiercer than expected. \n Soviet forces set up heavy defenses along the Dnieper, every inch of land fought over. Our offensive stalled with heavy losses. \n Yet this is not defeat—this is only the second round. We must learn from experience and wait for the next chance. \n Next time, we will be more determined."
 change_sov.35.a:0 "\"They've got some skill, Bolsheviks\""

 change_sov.36:0 "Moscow Battle"
 change_sov.36.t:0 "Take Moscow!"
 change_sov.36.d:0 "A telegram brings the frontline commander's order: 'Objective—Moscow.' \n This is not just the geographical capital, but the heart of the Bolshevik regime. The enemy has nowhere left to retreat, and we have gathered enough strength. \n On the snowfields, armored cavalry lines up, wind howling through battle flags. This is the decisive moment—the final battle for victory is about to begin."
 change_sov.36.a:0 "\"The enemy's heart is wide open!\""

 change_sov.37:0 "Soviets Hold Moscow"
 change_sov.37.t:0 "Moscow Battle Victory"
 change_sov.37.d:0 "Moscow did not fall. In -30°C cold, the Red Army held back the enemy's final assault with flesh and blood. \n The enemy is exhausted, supply lines broken, morale collapsed. Our soldiers not only defended the capital but also protected the dignity of the motherland. \n This victory will go down in history—it marks the end of the invader's arrogance, crushed by the power of the people."
 change_sov.37.a:0 "The Soviet Union shall not perish!"

 change_sov.38:0 "Moscow Falls"
 change_sov.38.t:0 "Moscow Falls"
 change_sov.38.d:0 "Telegrams cut off, communications lost. The enemy broke through the final line—Moscow... has fallen. \n No more red flags fly over Red Square, replaced by unfamiliar banners and heavy footsteps. The national center is lost, people fall into panic..."
 change_sov.38.a:0 "We have no chance left"

 change_sov.39:0 "Moscow Successfully Captured"
 change_sov.39.t:0 "Moscow Successfully Captured"
 change_sov.39.d:0 "Telegram arrives: 'Moscow has been taken.' \n Despite unprecedented resistance, the enemy was finally driven from the city. Victory horns echo through the streets, the former red flag replaced with a new emblem. \n The enemy's resistance will soon be wiped out!"
 change_sov.39.a:0 "The Bolsheviks' nest is ours"

 change_sov.40:0 "Soviets Hold Moscow"
 change_sov.40.t:0 "Moscow Offensive Failed"
 change_sov.40.d:0 "The telegram reads: 'Offensive stalled, forces forced to retreat.' \n We thought we could take the city in one push, but reality was harsher than expected. \n Cold, supply shortages, fierce enemy resistance—everything exceeded expectations. Moscow still stands, while we can only regroup in the snow. \n This is not the end, but a heavy lesson: the Eastern opponent is far stronger than we imagined."
 change_sov.40.a:0 "\"Our supply lines were stretched too thin\""

 change_sov.41:0 "Stalingrad Battle"
 change_sov.41.t:0 "Attack Stalingrad"
 change_sov.41.d:0 "A telegram brings the frontline commander's order: 'Objective—Stalingrad.' \n This is not just a city, but the key gateway to the Caucasus oil fields and the Volga grain belt. \n Intelligence shows the enemy has massed heavy forces here, but we are ready. Urban warfare is about to begin—every street, every building will be contested. \n Whoever controls this city will hold the initiative in this war."
 change_sov.41.a:0 "\"It's time to deliver a heavy blow to the Bolsheviks\""

 change_sov.42:0 "Soviets Hold Stalingrad"
 change_sov.42.t:0 "Stalingrad Battle Victory"
 change_sov.42.d:0 "Stalingrad did not fall. On this scorched earth, our soldiers wrote an immortal chapter with blood and life. \n Every burning house, every destroyed street, is proof of our determined resistance. \n The enemy thought they could quickly take the city, but they underestimated the Red Army's will and the power of this land. \n We not only held Stalingrad, but made the invaders realize: they have reached the end of their fate."
 change_sov.42.a:0 "We will achieve final victory!"

 change_sov.43:0 "Stalingrad Lost"
 change_sov.43.t:0 "Stalingrad Lost"
 change_sov.43.d:0 "Telegrams cut off, communications lost. The enemy broke through the final line—Stalingrad... has fallen. \n The ruins once filled with battle cries are now silent, covered in smoke. \n This is a heavy blow, but we will not yield. The General Staff has begun drafting new plans. As long as one soldier stands, we will not stop fighting. \n This is a temporary loss, not the end."
 change_sov.43.a:0 "It's not over yet!"

 change_sov.44:0 "Successfully Captured Stalingrad"
 change_sov.44.t:0 "Successfully Captured Stalingrad"
 change_sov.44.d:0 "The telegram reads: 'Stalingrad has been captured.'\n Despite unprecedented resistance in urban combat, the enemy forces have finally been driven out of the city.\n Victory horns echo through the streets; the once-waving red flags have been replaced with new insignias.\n This is an important step forward in our eastern advance—but it does not mean the end.\n From here, the gateway to the resource-rich heartland lies open."
 change_sov.44.a:0 "The gateway to the Caucasus is now open"

 change_sov.45:0 "Failed to Capture Stalingrad"
 change_sov.45.t:0 "Failed to Capture Stalingrad"
 change_sov.45.d:0 "The telegram reads: 'Offensive stalled, heavy casualties reported.'\n We once believed we could swiftly seize this city with superior forces, but reality has proven far more brutal than imagined.\n Urban warfare has turned into a war of attrition; every building has become an enemy stronghold. We have paid a heavy price in both tactics and morale.\n This is not the end, but indeed a harsh lesson: Stalingrad is no ordinary city—it is a living hell.\n Next time, we must proceed with greater caution."
 change_sov.45.a:0 "Damn it!"

 change_sov.46:0 "Attack on Leningrad"
 change_sov.46.t:0 "Attack on Leningrad"
 change_sov.46.d:0 "The telegram delivers the order: 'Target—Leningrad.'\n This city is not only the spiritual symbol of Bolshevism, but also a vital hub connecting Northern Europe and the East.\n Intelligence indicates the enemy has set up heavy defenses here, but they cannot stop our advance.\n Winter is approaching, the wind howls, but our will is firmer than ice. It is time for this city to witness a turning point in history."
 change_sov.46.a:0 "‘Take their “holy city”’"

 change_sov.47:0 "Soviet Defense of Leningrad Holds"
 change_sov.47.t:0 "Leningrad Siege Victory"
 change_sov.47.d:0 "One year of bitter winter, one year of blood and fire, one year of steadfast resistance.\n Leningrad did not fall. In this besieged city, every bread ration meant hope for survival, every shell fired carried the spirit of defiance.\n Soldiers and workers, elders and children—all defended this land with their lives.\n The enemy thought hunger and cold would make us surrender, but they were wrong—we shattered their illusions with iron will.\n Victory belongs to all Soviet people!"
 change_sov.47.a:0 "Victory belongs to all Soviet people!"

 change_sov.48:0 "Leningrad Falls"
 change_sov.48.t:0 "Leningrad Falls"
 change_sov.48.d:0 "The radio falls silent, red flags no longer fly, and the enemy has entered this cradle of revolution.\n The once-glorious Winter Palace now lies in ruins; songs along the Neva River have been replaced by gunfire.\n This is a heavy blow, but we will not yield. As long as one soldier still stands, we will never abandon the fight.\n History teaches us: the fall of a city does not mean the end of a nation.\n Counterattack is coming—Leningrad shall return."
 change_sov.48.a:0 "Damn it!"

 change_sov.49:0 "Successfully Captured Leningrad"
 change_sov.49.t:0 "Successfully Captured Leningrad"
 change_sov.49.d:0 "Despite unprecedented resistance, enemy forces have finally been driven out of the city.\n Victory horns echo through the streets; the once-waving red flags have been replaced with new insignias.\n This is an important step forward in our eastern advance—but it does not mean the end.\n From now on, the northern defensive gate of the Soviet Union lies wide open."
 change_sov.49.a:0 "A great victory!"

 change_sov.50:0 "Attack on Leningrad Fails"
 change_sov.50.t:0 "Attack on Leningrad Fails"
 change_sov.50.d:0 "We once believed we could swiftly seize this city with superior forces, but reality has proven far more cruel.\n Hunger, cold, urban warfare, and fierce enemy resistance—everything exceeded expectations.\n Leningrad is not an ordinary city; it is like an icebound fortress, rejecting all outsiders.\n Perhaps…"
 change_sov.50.a:0 "Does this city truly possess a 'miracle'?"

 change_sov.51:0 "Attack on Baku"
 change_sov.51.t:0 "Attack on Baku"
 change_sov.51.d:0 "Baku—the Soviet Union's lifeline flows here.\n This city is not only the heart of the Caucasus, but also the energy artery upon which the Bolshevik regime depends for survival.\n After breaking through from the Iranian direction, we have entered strategic depth. Once Baku is taken, the Red Army's mechanized forces will lose fuel, and their war machine will stall.\n The final battle is about to begin. We will sever their arteries with fire and steel."
 change_sov.51.a:0 "‘Sever their arteries’"

 change_sov.52:0 "Soviet Defense of Baku Holds"
 change_sov.52.t:0 "Baku Has Not Fallen"
 change_sov.52.d:0 "Baku remains in our hands, but the enemy is now approaching the city outskirts.\n Between the Black Sea and the Caspian Sea, between mountains and oil fields, our soldiers and workers fight side by side, vowing to defend this land to the death.\n Every oil well is a fortress, every pipeline our frontline.\n The enemy wants to bleed us dry, but we have long prepared—trains heading north run day and night, oil is being shipped steadily to the Urals.\n We will not let them succeed."
 change_sov.52.a:0 "‘Do not grow complacent; the enemy will not give up easily’"

 change_sov.53:0 "Baku Falls"
 change_sov.53.t:0 "Baku Falls"
 change_sov.53.d:0 "The radio falls silent, flames rise to the sky, and enemy troops enter this former industrial sanctuary.\n Once-roaring refineries now lie in ruins; once-flowing pipelines have been severed.\n This is a heavy blow—the enemy has not only seized our resources, but also seeks to cut off our future.\n Yet, they underestimated our resolve. We’ve built new reserves in the north; on the long supply lines, every drop of oil will become a spark for counterattack.\n The Caucasus now lies exposed…"
 change_sov.53.a:0 "But the war is far from over."

 change_sov.54:0 "Successfully Captured Baku"
 change_sov.54.t:0 "Successfully Captured Baku"
 change_sov.54.d:0 "Despite fierce resistance, enemy forces have finally been driven out of the city.\n Victory horns echo through the streets; the once-waving red flags have been replaced with new insignias.\n More importantly, we now control these oil fields. This is not just a tactical victory, but a strategic turning point.\n The Soviet war machine depends on oil from here, and now it will gradually grind to a halt.\n The industrial beast has lost its blood—"
 change_sov.54.a:0 "How much longer can it last?"

 change_sov.55:0 "Failed to Raid Baku"
 change_sov.55.t:0 "Failed to Raid Baku"
 change_sov.55.d:0 "The offensive has failed; forces are forced to retreat.\n We once hoped to swiftly seize the city with a lightning raid, but reality has proven far more brutal.\n The enemy has established new oil reserves in the north, and the southern oil fields are heavily fortified. Even without fully capturing Baku, they can still sustain their war effort.\n Worse, their reserves in the Urals and Volga regions have already begun operating.\n This is not the end, but indeed a harsh lesson: the Soviet war machine is far more resilient than we imagined."
 change_sov.55.a:0 "Well… at least we tried"

 change_sov.56:0 "First Phase Offensive Successful"
 change_sov.56.t:0 "First Phase Offensive Successful"
 change_sov.56.d:0 "Although our frontline troops encountered some resistance during the advance, they still rapidly broke through enemy lines and successfully achieved strategic objectives within a month.\n Frontline soldiers are in high morale and ready to strike again at any moment."
 change_sov.56.a:0 "Well done, lads"

 change_sov.57:0 "First Phase Offensive Failed"
 change_sov.57.t:0 "First Phase Offensive Failed"
 change_sov.57.d:0 "A month has passed, and our anticipated blitzkrieg has failed. Frontline troops have encountered far greater resistance than expected. The Soviet forces are far stronger than any enemy we’ve faced before. We must learn from this and do better next time."
 change_sov.57.a:0 "Do not rush"

 change_sov.58:0 "Second Phase Offensive Successful"
 change_sov.58.t:0 "Second Phase Offensive Successful"
 change_sov.58.d:0 "Finally, after months of fierce fighting, the Soviet Union's core territories have largely fallen into our hands. The Soviet regime is now cornered and on the brink of collapse!"
 change_sov.58.a:0 "Time to pop a bottle of champagne"

 change_sov.59:0 "Second Phase Offensive Failed"
 change_sov.59.t:0 "Second Phase Offensive Failed"
 change_sov.59.d:0 "The Soviets have established extensive defensive lines and, relying on their vast strategic depth, have severely delayed our offensive. With winter approaching, the second phase offensive can only be hastily concluded. Our plan to quickly destroy the Soviet Union has completely failed."
 change_sov.59.a:0 "What a tough nut to crack"

 change_sov.60:0 "Third Phase Offensive Successful"
 change_sov.60.t:0 "Third Phase Offensive Successful"
 change_sov.60.d:0 "After losing their core territories, large Soviet forces retreated to the Ural Mountains and put up fierce resistance using the terrain. But this was merely a futile attempt. Now our army has opened the gateway into the Urals, the enemy’s final line of defense has been breached, and nothing can stop our advance!"
 change_sov.60.a:0 "The end of the Soviet Union is here"

 change_sov.61:0 "Third Phase Offensive Failed"
 change_sov.61.t:0 "Third Phase Offensive Failed"
 change_sov.61.d:0 "Large numbers of Soviet Red Army troops have established strongholds in the Ural Mountains and are resisting us using the complex terrain. The enemy’s stubborn defense, combined with our overstretched supply lines, has become the final straw. Our troops suffer heavy losses for every mile advanced, and even successful breakthroughs are quickly reversed by enemy counterattacks. Frontline morale is beginning to waver."
 change_sov.61.a:0 "The resilience of the Soviet Union is truly terrifying"

 change_sov.62:0 "March into Mongolia"
 change_sov.62.t:0 "March into Mongolia"
 change_sov.62.d:0 "After we allied with Britain, our former ally chose to reject us and remain neutral. Now, China to the south has completely sided with Germany, turning the so-called neutral buffer zone into an extremely unstable factor. To expand our depth in the Far East and reduce these instabilities, we must strike first."
 change_sov.62.a:0 "Yes, strike first!"

 change_sov.63:0 "Dispatch Troops to Outer Mongolia"
 change_sov.63.t:0 "Dispatch Troops to Outer Mongolia"
 change_sov.63.d:0 "The Soviets have actually sent troops into Outer Mongolia! Fine, if they cross the river, so will we. We will immediately send our own forces into Outer Mongolia to compete for territory, expanding our buffer zone against the Soviets. We must avoid armed conflict with Soviet forces at all costs."
 change_sov.63.a:0 "Time to move, boys!"
 change_sov.63.b:0 "...Forget it. Damn Soviets!"

 change_sov.64:0 "The Republic of China Marches into Mongolia"
 change_sov.64.t:0 "The Republic of China Marches into Mongolia"
 change_sov.64.d:0 "Within just two hours after we marched into Mongolia, the Chinese army also entered Mongolian territory to compete with us for land. Should we remind our soldiers to avoid armed conflict?"
 change_sov.64.a:0 "Yes, let's do that. But we must not give up the core cities."
 change_sov.64.b:0 "You're getting too cocky!"

 change_sov.65:0 "Far Eastern Defense"
 change_sov.65.t:0 "Far Eastern Defense Construction Completed"
 change_sov.65.d:0 "After spending considerable time and effort, our Far Eastern defense line is finally complete."
 change_sov.65.a:0 "Good, but don't let our guard down"







 # ———— HUNGARIAN EVENTS ————
 change_hun.1:0 "Austria-Hungary Seeks Cooperation"
 change_hun.1.t:0 "Austria-Hungary Seeks Cooperation"
 change_hun.1.d:0 "Our defeat in the last great war cost us vast territories, and Austria-Hungary itself disintegrated and vanished. Now Otto has reclaimed the throne and is determined to recover the empire's rightful lands. They hope we will lend them a hand—upon success, the Balkans will be split between us."
 change_hun.1.a:0 "Of course"
 change_hun.1.b:0 "Go play by yourselves"

 change_hun.2:0 "Refusal"
 change_hun.2.t:0 "They Rejected Our Proposal"
 change_hun.2.d:0 "It seems we failed to convince them. We'll have to do this on our own."
 change_hun.2.b:0 "We walk different paths"

 change_hun.3:0 "Austria-Hungary Demands Their Lands Back"
 change_hun.3.t:0 "Austria-Hungary Demands Their Lands Back"
 change_hun.3.d:0 "Austria-Hungary demands the return of their historical territories. Of course, they're just making the claim—the final decision rests with us."
 change_hun.3.a:0 "Not giving them"
 change_hun.3.b:0 "Then give it back to them"

 # ———— PRC EVENTS ————
 change_prc.1:0 "Leadership Confirmed"
 change_prc.1.t:0 "Mao Zedong's Leadership Confirmed"
 change_prc.1.d:0 "The spark of the workers' and peasants' revolution survived the brutal Long March thanks to Comrade Mao Zedong's correct leadership. Only under his guidance can China's revolution achieve victory."

 change_prc.2:0 "CPC Seeks Aid"
 change_prc.2.t:0 "CPC Seeks Aid"
 change_prc.2.d:0 "Comrades from the Chinese Communist Party have today requested assistance from Moscow to recover from losses sustained during the Long March. Comrade Stalin has pledged to provide full support."
 change_prc.2.a:0 "This is internationalism, comrade"

 change_prc.3:0 "Soviet Aid Arrives"
 change_prc.3.t:0 "Soviet Union Will Provide Full Assistance"
 change_prc.3.d:0 "Moscow has responded to our request. They will supply us with vast quantities of weapons and resources, and help establish a basic industrial foundation."
 change_prc.3.a:0 "Comrade, this is truly a godsend"

 change_prc.4:0 "Patriotic Overseas Chinese Aid"
 change_prc.4.t:0 "Patriotic Overseas Chinese Aid"
 change_prc.4.d:0 "Patriotic overseas Chinese have collectively raised large amounts of weapons and resources to help us recover."
 change_prc.4.a:0 "This is a huge help"

 change_prc.5:0 "Drawbacks of Rapid Industrialization"
 change_prc.5.t:0 "Drawbacks of Rapid Industrialization Emerge"
 change_prc.5.d:0 "A series of forced measures have rapidly industrialized our nation. But what has been the cost?"
 change_prc.5.a:0 "Cost?......"

 change_prc.6:0 "Nationalist Government Surrenders"
 change_prc.6.t:0 "Nationalist Government Surrenders"
 change_prc.6.d:0 "Under the People's Liberation Army's unstoppable offensive, the reactionary forces' defenses crumbled like a breached dam. Their cause is lost. Their generals now offer to surrender their troops and dismantle the reactionary government to end the war."
 change_prc.6.a:0 "Welcome to join our army"
 change_prc.6.b:0 "We don't need their help—we'll destroy the reactionaries ourselves"

 change_prc.7:0 "Strategy Toward Japan"
 change_prc.7.t:0 "Strategy Toward Japan"
 change_prc.7.d:0 "We are no longer who we once were. After years of recovery, our strength now surpasses Japan, which can only huddle within its home islands. Once they stood above us, arrogant and invincible, trampling our nation's dignity and lives. Now, it is our turn to decide their fate."
 change_prc.7.a:0 "Make them submit voluntarily"
 change_prc.7.b:0 "Support Japanese communists to collapse them from within"

 change_prc.8:0 "China Demands Our Submission"
 change_prc.8.t:0 "China Demands Our Submission"
 change_prc.8.d:0 "The Chinese demand we bow down and submit, or they will use force to make us kneel."
 change_prc.8.a:0 "I'd like to see them try to land"
 change_prc.8.b:0 "Surrender meow"

 change_prc.9:0 "Japan Refuses to Submit"
 change_prc.9.t:0 "Japan Refuses to Submit"
 change_prc.9.d:0 "Japan, relying on its powerful navy, believes we cannot threaten its homeland and has rejected our demands."
 change_prc.9.a:0 "Then let's test that"
 change_prc.9.b:0 "Fine, we can't land—but we can destroy them from within"

 change_prc.10:0 "CPC Supports Communist Agitators"
 change_prc.10.t:0 "CPC Supports Communist Agitators"
 change_prc.10.d:0 "Recently, labor union activists have grown increasingly active, even preparing strikes that severely endanger national security. Fortunately, our Special Higher Police uncovered and destroyed their hideouts. During the raid, they discovered all this was secretly supported by the Chinese Communist Party."
 change_prc.10.a:0 "So it's foreign interference after all?"
 change_prc.10.b:0 "Damn it, I've had enough—launch a full sweep and eliminate them all"

 change_prc.11:0 "Red Specter Activity Intensifies"
 change_prc.11.t:0 "Red Specter Activity Intensifies"
 change_prc.11.d:0 "The 'Red Scourge' within our nation is worsening, spiraling toward uncontrollable levels. Perhaps we should strike hard before it's too late?"
 change_prc.11.a:0 "Not a big deal?!"

 change_prc.12:0 "Peasants and Workers' Uprising!"
 change_prc.12.t:0 "Peasants and Workers' Uprising!"
 change_prc.12.d:0 "Comrades! An opportunity to free our nation from militarism and capitalists lies before us! It's time to shatter the chains upon the people! We are not alone—the Chinese Communist Party will aid us in battle. Together, we shall ignite the prairie fire!"
 change_prc.12.a:0 "For freedom!"

 change_prc.13:0 "Japan Submits"
 change_prc.13.t:0 "Japan Submits"
 change_prc.13.d:0 "The Japanese government has recognized the situation and chosen to submit to us."
 change_prc.13.a:0 "Good"

 # ———— CHI (CHINA) EVENTS ————
 change_chi.1:0 "Chairman Assassinated?!"
 change_chi.1.t:0 "Chairman Assassinated?!"
 change_chi.1.d:0 "Our beloved Chairman, the revered principal of Whampoa Military Academy, after finishing his duties yesterday, inexplicably decided to test-drive a convertible gifted to him recently. Despite pleas from his secretary and guards, he insisted, claiming he wanted to 'recapture his youth.' Upon arriving home, a long-hidden assassin shot him three times in the chest, nearly blowing his brains out. The assassin was killed on the spot, and the Chairman immediately lost consciousness. Though guards rushed him to the hospital, his condition remains grim. His family is already preparing for the worst."
 change_chi.1.a:0 "Chairman, you've suffered so much..."

 change_chi.2:0 "Lao Jiang Assassinated?!"
 change_chi.2.t:0 "Lao Jiang Assassinated?!"
 change_chi.2.d:0 "Yesterday, our agents reported that Chiang Kai-shek was attacked by an assassin while returning home, hit by multiple pistol rounds. Though rushed to hospital, his condition is critical. Though we have deep conflicts with the Nationalists, Comrade Mao believes we should send a condolence delegation—to show we weren't behind it, and to seize a chance to catch our breath. For the envoy, Comrade Mao insists on going personally."
 change_chi.2.a:0 "Send experienced veterans as guards, keep relief forces ready, and alert our agents"
 change_chi.2.b:0 "No, too dangerous. We can't risk Comrade Mao's life"

 change_chi.3:0 "De Sheng to Personally Attend Funeral?!"
 change_chi.3.t:0 "De Sheng to Personally Attend Funeral?!"
 change_chi.3.d:0 "The CPC contacted us today, expressing deep sorrow over the Chairman's assassination and condemning the mastermind. They also stated that De Sheng wishes to visit and pay respects, and are asking for our stance."
 change_chi.3.a:0 "Coming personally?! Truly fearless. Very well—he will be safe; we won't let history repeat"
 change_chi.3.b:0 "These people have no good intentions. Don't come—too much trouble if something happens here"

 change_chi.4:0 "Nationalists Reject Our Offer"
 change_chi.4.t:0 "Nationalists Reject Our Offer"
 change_chi.4.d:0 "Nanjing replied this morning: 'We appreciate your goodwill. However, the Chairman's seven-day mourning period has not passed, and the assassin's mastermind remains unknown. To avoid misunderstandings, we advise against your delegation attending.' Fine—now we don't have to worry about Comrade Mao's safety in Nationalist territory."
 change_chi.4.a:0 "Alright then, we'll just watch from the sidelines."

 change_chi.5:0 "Chairman Recovered?!"
 change_chi.5.t:0 "Chairman Recovered?!"
 change_chi.5.d:0 "Last night, a guard entered the Chairman's room and found him miraculously standing by the bed, removing his hospital gown and calmly adjusting his clothes. 'Chairman, you... you've recovered?!' 'Oh, Xiao Li, yes, I'm healed. After all, I'm the Principal—above even athletes.' News of the Chairman's recovery exploded across Nanjing. Newspapers rushed to publish the sensational story."
 change_chi.5.a:0 "I told you typing '1' works"

 change_chi.6:0 "Chairman Resumes Power"
 change_chi.6.t:0 "Chairman Resumes Power"
 change_chi.6.d:0 "Now that the Chairman has won the revival round, it's time for him to return to his post. However, his secretary reports that when alone, he mutters strange things like 'last life retreating to a small island, showing heroic spirit' and 'this life I must do things differently.' After discussing with doctors behind the Chairman's back, we all agree this is a side effect—after all, any normal person hit by three bullets in the chest would lose half their life. Our Chairman not only survived but healed overnight and is jumping around. Some side effects are only natural."
 change_chi.6.a:0 "Too bad. The banquet table was already set—we almost got to sit at the kids' table"

 change_chi.7:0 "Strange Lao Jiang"
 change_chi.7.t:0 "Strange Lao Jiang"
 change_chi.7.d:0 "After Lao Jiang won the revival round, he's acted like a changed man—talking with Comrade De Sheng about world affairs for entire days. De Sheng is astonished by Lao Jiang's ideological awakening. Lao Jiang says he was young and naive before, but after facing death, he's seen the truth. He now wants to contribute to national rejuvenation and cooperate with us to unify China. He even says he won't interfere with our freedom if disagreements arise. Comrade De Sheng believes Lao Jiang is sincere and can be trusted."
 change_chi.7.a:0 "Fine, let's trust them one more time"

 change_chi.8:0 "CPC Willing to Cooperate"
 change_chi.8.t:0 "CPC Willing to Cooperate"
 change_chi.8.d:0 "Holy mother of god, did the Chairman get a legendary mind-control app? How did he convince them? Is the Chairman possessed by a deity?"
 change_chi.8.a:0 "Cooperation achieved"

 change_chi.9:0 "Join the World War"
 change_chi.9.t:0 "Join the World War"
 change_chi.9.d:0 "The Second World War has broken out, and domestic unification is complete. It's time to pursue greater ideals—time to choose which side to join."
 change_chi.9.a:0 "Fight alongside Germany, reclaim our territories"
 change_chi.9.b:0 "Fight alongside Britain, reclaim our territories"

 # ———— USA EVENTS ————
 change_usa.1:0 "The Giant Awakens"
 change_usa.1.t:0 "The Giant Awakens"
 change_usa.1.d:0 "World局势 is no longer stable. The threat on the European continent grows severe. We can no longer pursue isolationism. We will fully unleash our industrial potential—let the world tremble beneath the eagle's wings."
 change_usa.1.a:0 "The Giant Awakens"

 change_usa.2:0 "Decision on Mexico"
 change_usa.2.t:0 "Decision on Mexico"
 change_usa.2.d:0 "Now is the time to decide Mexico's fate. General MacArthur suggests sending troops to the border to pressure Mexico into submission. Diplomats suggest negotiations—demand resource extraction rights. Without resource revenue, Mexico cannot threaten us. Of course, we could take more extreme measures: invade Mexico directly."
 change_usa.2.a:0 "Demand Mexico demonstrate loyalty"
 change_usa.2.b:0 "Seize Mexico's resource extraction rights"
 change_usa.2.c:0 "Show the world the power of America"

 change_usa.3:0 "America Demands Our Loyalty"
 change_usa.3.t:0 "America Demands Our Loyalty"
 change_usa.3.d:0 "America has issued an ultimatum: we must demonstrate loyalty. Perhaps we still have room to maneuver—America only covets our oil and mineral resources. If we surrender extraction rights, America may recognize our loyalty."
 change_usa.3.a:0 "Change government to show allegiance to America"
 change_usa.3.b:0 "Negotiate with America: resources for protection"
 change_usa.3.c:0 "Never compromise with imperialism!"

 change_usa.4:0 "[Root.GetNameDefCap] to Undergo Government Change"
 change_usa.4.t:0 "[Root.GetNameDefCap] to Undergo Government Change"
 change_usa.4.d:0 "[Root.GetNameDefCap] has chosen to change government to show allegiance. In negotiations, the new [Root.GetNameDefCap] government is willing to hand over domestic resource extraction rights to us."
 change_usa.4.a:0 "Smart move"

 change_usa.5:0 "Mexico Offers Resources for Protection"
 change_usa.5.t:0 "Mexico Offers Resources for Protection"
 change_usa.5.d:0 "Mexico claims internal affairs are complex—sudden regime change could cause chaos or invite other powers. In America's interest, they offer resources in exchange for our protection."
 change_usa.5.a:0 "Fine, accept it"
 change_usa.5.b:0 "Can't you understand human speech?"

 change_usa.6:0 "Final Ultimatum"
 change_usa.6.t:0 "Final Ultimatum"
 change_usa.6.d:0 "America rejected our proposal and issued a final ultimatum: meet their demands or face action."
 change_usa.6.a:0 "Alright..."
 change_usa.6.b:0 "Endless compromise will only plunge us into an abyss"

 change_usa.7:0 "Mexico Rejects Our Proposal"
 change_usa.7.t:0 "Mexico Rejects Our Proposal"
 change_usa.7.d:0 "Mexico firmly rejected our demands, stating they will never compromise with imperialism."
 change_usa.7.a:0 "Looks like they only understand force"

 change_usa.8:0 "America Demands Resource Rights"
 change_usa.8.t:0 "America Demands Resource Rights"
 change_usa.8.d:0 "America demands all resource extraction rights within our borders, urging us not to be foolish—trading resources for peace is a good deal."
 change_usa.8.a:0 "Fine..."
 change_usa.8.b:0 "We will not bow to imperialism!"

 change_usa.9:0 "America Demands Government Change"
 change_usa.9.t:0 "America Demands Government Change"
 change_usa.9.d:0 "Due to our ongoing resource trade with the Allies severely disrupting the Entente's strategy, America has issued an ultimatum: change government and surrender resource rights. If we refuse, they will send troops to enforce obedience."
 change_usa.9.a:0 "Alright, alright..."
 change_usa.9.b:0 "We will not bow to imperialism!"

 change_usa.10:0 "Venezuela Refuses"
 change_usa.10.t:0 "Venezuela Rejects Proposal"
 change_usa.10.d:0 "Venezuela has rejected our proposal. Looks like someone needs discipline."
 change_usa.10.a:0 "Heh"

 change_usa.11:0 "Allies Introduce Colonial Rubber"
 change_usa.11.t:0 "Allies Introduce Colonial Rubber"
 change_usa.11.d:0 "Allies have introduced rubber from our colonies, bringing us significant profit."
 change_usa.11.a:0 "Cool"

 change_usa.13:0 "The Fate of Panama"
 change_usa.13.t:0 "The Fate of Panama"
 change_usa.13.d:0 "Now, it is time to decide the fate of Panama..."
 change_usa.13.a:0 "Install a puppet government"
 change_usa.13.b:0 "Directly annex Panama as a dominion"

 # ———— MEX EVENTS ————
