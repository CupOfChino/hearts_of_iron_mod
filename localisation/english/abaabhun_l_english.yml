 SOV_Great_Patriotic_War_categories:0 "§YGreat Patriotic War§!"
 SOV_Great_Patriotic_War_categories_desc: "§ROur great Motherland is in danger! Comrades, take up arms and defend our homeland! We will make the invaders pay in blood!§!"
 Attack_SOV_categories:0 "Attack the Soviet Union"
 Attack_SOV_categories_desc: "If we do not capture §Moscow, Stalingrad, Leningrad, Baku§! within §Y1600§! days, then we will §Rbe utterly humiliated§!. \n If the Three Emperors' Alliance is activated, we must also capture §RGorky, Kazan, Ufa§!. \n If we achieve these objectives, the Soviet Union will collapse."

