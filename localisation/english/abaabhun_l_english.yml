#######decisons########
 GER_ai_categories:0 "German AI Enhancements"
 GER_third_empire_categories:0 "Three Emperors' Alliance"
 GER_third_empire_categories_desc: "The chains of Versailles have shattered, and the old blood of Europa boils once more! His Majesty Wilhelm II's Iron Cross eagle flag flies over the Berlin dome, Napoleon IV's eagle insignia reforges Paris's glory, and Otto von Habsburg's Holy Crown of St. Stephen is crowned in Budapest—this is the return of monarchs and knights, the ultimate judgment of imperial bloodline upon the falsehood of republics!"
 GER_third_empire_war_categories:0 "Allied War Strategy"
 GER_third_empire_war_categories_desc: "War has erupted, and history has long proven to us: can peace bestowed by others truly be called peace? Peace can only be earned by our own efforts!"
 GER_third_empire_prepare_war_categories:0 "War Mobilization"
 GER_third_empire_prepare_war_categories_desc: "The confrontation between the two major blocs has cast the shadow of war over the entire world. We are not prepared for war, and if it breaks out, we will be extremely passive. We must seize the time to mobilize for war."
 GER_with_friend_categories:0 "Joint Resolutions"
 GER_with_friend_categories_desc: "'Unity is strength,' 'A journey of a thousand miles begins with a single step.' Bit by bit, accumulation eventually leads to a lifetime. In essence: §RThe bonuses obtained here will apply to all members of our faction.§!"
 GER_new_third_empire_has_war_categories: "World War II"
 GER_new_third_empire_has_war_categories_desc: "You know, the war has already begun... \n It now concerns every one of us. \n §RThis war will only end when one side is completely defeated... or will it?§!"
 GER_the_new_technologies_categories:0 "Special Technology"

 FRA_ai_categories:0 "French AI Enhancements"
 FRA_third_empire_categories:0 "Three Emperors' Alliance"
 FRA_third_empire_categories_desc: "The chains of Versailles have shattered, and the old blood of Europa boils once more! His Majesty Wilhelm II's Iron Cross eagle flag flies over the Berlin dome, Napoleon IV's eagle insignia reforges Paris's glory, and Otto von Habsburg's Holy Crown of St. Stephen is crowned in Budapest—this is the return of monarchs and knights, the ultimate judgment of imperial bloodline upon the falsehood of republics!\n --D Guidance"
 FRA_old_firend_categories:0 "Return of the Old Alliance"
 mod_economy_decisions:0 "Special Policies"
 mod_special_decisions:0 "Other Decisions"
 mod_special_decisions_desc: "\n Some decisions for fun. \n"
 FRA_start_industry_categories:0 "Industrial Revival"
 FRA_start_industry_categories_desc: "Despite its long industrial tradition, France's industrial system showed signs of fatigue in the 1930s. Dispersed small businesses, outdated production techniques, frequent strikes, and political turmoil severely constrained production capacity. Steel mills were inefficient, arms factories were underutilized, and there was a lack of coordination between civilian and military production. The nation was not ready for the industrial challenges of modern war."
 FRA_the_army_rearmament_categories:0 "Army Reforms"
 FRA_the_army_rearmament_categories_desc: "\"The Somme,\" \"Verdun\"... these names are medals of honor, yet also nightmares deeply embedded in the soul of our army. The pyrrhic victory of the Great War, bought with the blood of a generation, has crippled the offensive spirit of this once 'Foremost Army in Europe.' The rigid doctrine of 'Methodical Battle' has become unquestioned dogma; the high command is steeped in conservatism and pessimism; troops are equipped with outdated arms, and their morale relies on static defense lines rather than mobile assault. The army's soul seems forever trapped in the muddy trenches of 1916..."



 HUN_ai_categories:0 "Austro-Hungarian AI Enhancements"
 HUN_restored_categories:0 "Balkan Strategy"

 ENG_ai_categories:0 "British AI Enhancements"
 ENG_the_third_empire_categories:0 "Triple Entente"
 ENG_the_third_empire_categories_desc: "When the roar of Prussian jackboots shatters the peace of Versailles, when Bonaparte's ambition tears off the republican mask, when the腐朽 ghost of Habsburg devours Central Europe—the free world has no retreat! Regardless of ideological differences, regardless of the barriers of oceans and the Iron Curtain, we must stand together now! The parliamentary traditions of London, the torch of democracy from Washington, and the red banner of workers and peasants from Moscow will form an insurmountable wall against the dark fantasy of the Three Emperors!\n --D Guidance"
 ENG_the_third_empire_war_categories:0 "Entente War Strategy"
 ENG_the_third_empire_war_categories_desc: "War has erupted, and history has long proven to us: can peace bestowed by others truly be called peace? Peace can only be earned by our own efforts!"

