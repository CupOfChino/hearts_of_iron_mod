 cjg_open_the_old_firend_desc:0 "Germany and Austria-Hungary form the Old Alliance; Britain and France form the opposing bloc. Ensure §RGermany follows the Monarchist path§! and §RHungary restores Austria-Hungary§!."
 cjg_game_rule_third_empire:0 " §RFor the Three Emperors' Alliance, Germany and Austria-Hungary must take the neutral path, and France must take the Napoleonic path; for the Old Allies, only Germany and Austria-Hungary need to be on the neutral path§! "

