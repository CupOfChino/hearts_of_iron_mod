 FRA_complete_army_reform: "Complete the Army Reforms"
 FRA_complete_army_reform_desc: "The army reforms have been completed. Our military is now a modern fighting force!"
 FRA_start_army_rearmament: "Begin Army Reforms"
 FRA_start_army_rearmament_desc: "\"The Somme,\" \"Verdun\"... these names are medals of honor, yet also nightmares deeply embedded in the soul of our army. The pyrrhic victory of the Great War, bought with the blood of a generation, has crippled the offensive spirit of this once 'Foremost Army in Europe.' The rigid doctrine of 'Methodical Battle' has become dogma; the high command is steeped in conservatism and pessimism; troops are equipped with outdated arms, and their morale relies on static defense lines rather than mobile assault. The army's soul seems forever trapped in the muddy trenches of 1916.\n\nComplacency only leads to ruin! The bitter lessons have taught us resilience, not cowardice. The experience of the Great War shall become the bedrock of our caution and fortitude, a wellspring of vigilance and strength! Through a thorough overhaul of our doctrine and command structure, we will fully internalize the lessons of the last war. The legacy of Verdun shall ultimately forge an armed force that is more prudent, resilient, and deadly!"

