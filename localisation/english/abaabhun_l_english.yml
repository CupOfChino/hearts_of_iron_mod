 cjg_game_rule_third_empire:0 "Germany, France, and Hungary set aside their past grievances and form a powerful military alliance. To safeguard their security and interests, Britain, the Soviet Union, and the United States formally sign a mutual defense treaty. Thus begins a world war spanning six continents and four oceans."
