 the_eastern:0 "East Asian Powers (Full experience requires enabling the Three Emperors' Alliance)"
 RLUE_GROUP_EASTERN_OPTION_DEFAULT:0 "East Asia Default"
 the_eastern_desc:0 "The East Asian powers receive no buffs and remain unchanged from vanilla. Who wins in the end is purely up to fate."
 the_eastern_prc_t:0 "People's Liberation Front"
 the_eastern_prc_desc:0 "The Chinese Communist Party receives massive buffs and forms the People's Liberation Front to ensure victory in the Civil War. After winning, if the Latin Union exists, they will unite to form the National Liberation Front. Once domestic affairs are settled, they will launch a future war to overthrow imperialism and liberate the entire world."
 the_eastern_chi_t:0 "Three Principles of the People"
 the_eastern_chi_desc:0 "The Nationalist Government receives significant buffs to secure victory in the Sino-Japanese War. Due to Chiang Kai-shek 'changing his mind,' becoming truly patriotic, CCP leaders will choose to join the Nationalist government and serve the nation. After winning the Sino-Japanese War, they will attempt to expand into Southeast Asia. If one major faction supports China more, they are more likely to join that side in the world war."
 the_eastern_man_t:0 "(Abandoned - No effect if selected) Qing Restoration (Requires Manchukuo independence)"
 the_eastern_man_desc:0 "(Abandoned - No effect if selected) (Requires Manchukuo independence) The Qing Dynasty receives massive buffs, gains independence, unifies China, and reversely colonizes Japan. After unification, it will attempt a northern expedition to reclaim former territories."
 the_eastern_jap_t:0 "Greater East Asia Co-Prosperity Sphere"
 the_eastern_jap_desc:0 "Japan succeeds in dominating East Asia, then expands toward Southeast Asia and the Americas."
 the_eastern_random_t:0 "East Asian Battle Royale"
 the_eastern_random_desc:0 "All buffs activate simultaneously, turning East Asia into a complete free-for-all. Due to insufficient testing, numerous bugs may occur—strongly discouraged. Only suitable for sandbox fun."

 the_LatinAmerica:0 "Latin Union"
 RLUE_GROUP_LATINAMERICA_OPTION_DEFAULT:0 "Latin America Default"
 the_LatinAmerica_t:0 "Latin Union (Requires Mexico to go Red)"
 the_LatinAmerica_desc:0 "(Requires Mexico to go Red) Mexico becomes a socialist state, merges with other Latin American nations to form the Latin Union, and will spread revolutionary fire worldwide. If the East Asian option 'People's Liberation Front' is selected, the two will unite into a National Liberation Front to fight for global liberation."

 The_SOV_game_rule:0 "The Great Patriotic War"
 the_SOV_Great_Patriotic_War:0 "The Great Patriotic War"
 the_SOV_Great_Patriotic_War_open_default:0 "Do Not Enable Soviet Buffs"
 the_SOV_Great_Patriotic_War_desc:0 "0.0"
 the_SOV_Great_Patriotic_War_open:0 "§YThe Great Patriotic War§!"
 the_SOV_Great_Patriotic_War_open_t:0 "§YThe Great Patriotic War§!"
 the_SOV_Great_Patriotic_War_open_desc:0 "§RSoviet Union§! will activate the §YGreat Patriotic War§! decision tree when fighting a §Rdefensive war§! against a §Rmajor power§!. The USSR grows stronger as surrender resistance increases. If §RThree Emperors' Alliance§! is enabled, even more powerful decisions become available. You have only §R1600§! days to defeat the USSR—the cost being that the USSR collapses after losing §Rthree major cities§! (in the Three Emperors' timeline, after being pushed beyond the Ural Mountains§!)."

 The_USA_game_rule:0 "USA Initial Industry Boost"
 the_USA_factory_more:0 "USA Initial Industry Boost"
 the_USA_factory_more_open_default:0 "Do Not Enable USA Industry Boost"
 the_USA_factory_more_desc:0 "0.0"
 the_USA_factory_more_open:0 "§YUSA Initial Industry Massively Enhanced§!"
 the_USA_factory_more_open_t:0 "§YUSA Initial Industry Massively Enhanced§!"
 the_USA_factory_more_open_desc:0 "§YAt game start§!, §RUSA§! receives §R100§!§Y off-map civilian factories§!, §R20§!§Y off-map military factories§!, §R40§!§Y off-map dockyards§!, and §R24 divisions§! at §Y75% equipment readiness§! to defend the homeland. Recommended to enable alongside §RThree Emperors' Alliance§!."

