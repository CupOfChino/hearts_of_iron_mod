 #####news######
 change_news.1:0 "The League of Three Emperors"
 change_news.1.t:0 "The League of Three Emperors"
 change_news.1.d:0 "Recently, the Emperors of Germany, France, and Austria-Hungary have formally signed the 'League of Three Emperors.' Thus, the balance of power on the European continent has tilted severely. The British government has labeled this move a 'demon poisoning the world,' and declared it will form a new military alliance to contain its expansion."
 change_news.1.a:0 "Let's see how the British respond."
 change_news.1.b:0 "This is outright provocation!"
 change_news.1.c:0 "A magnificent plan!"

 change_news.2:0 "Triple Entente"
 change_news.2.t:0 "Triple Entente"
 change_news.2.d:0 "Britain, the Soviet Union, and the United States have issued a joint statement, officially forming the 'Triple Entente.' Members of the Entente are obligated to protect other nations from attacks by the Alliance powers, and any attack on an Entente member or potential member by the Alliance shall be considered a declaration of war against all Entente members. A British government spokesperson stated, 'This is to safeguard world security. The Entente welcomes all nations fearing Alliance aggression to join.'\nUndoubtedly, this is not good news for the League of Three Emperors."
 change_news.2.a:0 "A world war has begun."
 change_news.2.b:0 "Only by uniting and setting aside old grudges can we resist them."
 change_news.2.c:0 "Nothing but desperate rats huddling together for warmth."

 change_news.3:0 "Balkan War"
 change_news.3.t:0 "Fire Reignites in the Balkans"
 change_news.3.d:0 "Smoke rises once more. The Austro-Hungarian Empire, reborn from ashes, advances alongside Bulgaria from different directions, launching an assault on Balkan states, vowing to reclaim lost territories from the last great war.\nDespite outdated weapons, inadequate equipment, and forces not yet fully prepared, the defenders choose to fight to the end, defending their homeland with blood.\nWill the avengers risen from hell strike down their enemies, or will fearless warriors crush the invaders? Let us wait and see."
 change_news.3.a:0 "Is this a prelude to another great war?"
 change_news.3.b:0 "Victory shall be ours!"
 change_news.3.c:0 "Reclaim our homeland!"

 change_news.4:0 "British Empire"
 change_news.4.t:0 "Formation of the British Empire"
 change_news.4.d:0 "Yesterday, the British government issued a statement: amid increasingly severe international tensions, the Commonwealth has reached consensus to form a powerful united government to ensure its own security. Although the British government claims this move is not targeted at any nation."
 change_news.4.a:0 "A superpower has risen."
 change_news.4.b:0 "The empire on which the sun never sets."

 change_news.5:0 "British Guarantee for Italy"
 change_news.5.t:0 "Anglo-Italian Alliance"
 change_news.5.d:0 "Today, the British and Italian governments issued a joint statement: Italy and Britain will become allies, cooperate in multiple fields, and mutually guarantee national defense security. Italy calls this a vital measure for maintaining peace. Germany, however, claims this action harms the interests of the Alliance and threatens the safety of Germany's allies, stating it will be a spark igniting the powder keg."
 change_news.5.a:0 "We will closely monitor developments."
 change_news.5.b:0 "Germany certainly won't let this go."
 change_news.5.c:0 "Come on, the show begins."

 change_news.6:0 "World War"
 change_news.6.t:0 "World War II"
 change_news.6.d:0 "The confrontation between the 'League of Three Emperors' and the 'Triple Entente' has finally escalated into war, with both sides almost simultaneously announcing general mobilization. In the skies, countless 'winged cavalry' engage in fierce combat; on the vast Eastern European plains, titanic iron fists clash violently; in the boundless oceans, terrifying steel leviathans tear at each other. A bloody and brutal performance has officially begun."
 change_news.6.a:0 "Such suffering... may the dead rest in peace."
 change_news.6.b:0 "The avenger from nightmares has returned!"
 change_news.6.c:0 "Victory shall be ours!"

 change_news.7:0 "Denmark Concedes"
 change_news.7.t:0 "Denmark Submits to the German Empire"
 change_news.7.d:0 "The German Emperor today announced Denmark's formal 'voluntary' accession to the German Empire. This means Germany's influence in Northern Europe will further expand. Britain will absolutely not allow Germany to completely control Scandinavia. A contest between the two powers in the north is foreseeable."
 change_news.7.a:0 "The air grows increasingly tense."
 change_news.7.b:0 "Next will be Norway and Sweden."
 change_news.7.c:0 "Measures must be taken."

 change_news.8:0 "Norway Joins Germany"
 change_news.8.t:0 "Norway Joins Germany"
 change_news.8.d:0 "In the Nordic contest, Germany has secured victory in Norway. Today, the Norwegian government announced it will join Germany and pursue closer cooperation in the future. Norway's accession marks a further expansion of the Central Powers' influence in Northern Europe. Clearly, this is not good news for the Entente."
 change_news.8.a:0 "It seems Northern Europe will fall into the hands of the Central Powers."
 change_news.8.b:0 "A phased victory."
 change_news.8.c:0 "The situation looks grim."

 change_news.9:0 "Sweden Joins Germany"
 change_news.9.t:0 "Sweden Joins Germany"
 change_news.9.d:0 "In the Nordic contest, Germany has secured victory in Sweden. Today, the Swedish government announced it will join Germany and pursue closer cooperation in the future. Sweden's accession marks a further expansion of the Central Powers' influence in Northern Europe. Clearly, this is not good news for the Entente."
 change_news.9.a:0 "It seems Northern Europe will fall into the hands of the Central Powers."
 change_news.9.b:0 "A phased victory."
 change_news.9.c:0 "The situation looks grim."

 change_news.10:0 "Norway Joins Britain"
 change_news.10.t:0 "Norway Joins Britain"
 change_news.10.d:0 "In the Nordic contest, Britain has secured victory in Norway. Today, the Norwegian government announced it will join Britain and pursue closer cooperation in the future. Norway's accession marks a further expansion of the Entente's influence in Northern Europe. Clearly, this is not good news for the Central Powers."
 change_news.10.a:0 "It seems Northern Europe will fall into the hands of the Entente."
 change_news.10.b:0 "The situation looks grim."
 change_news.10.c:0 "A phased victory."

 change_news.11:0 "Sweden Joins Britain"
 change_news.11.t:0 "Sweden Joins Britain"
 change_news.11.d:0 "In the Nordic contest, Britain has secured victory in Sweden. Today, the Swedish government announced it will join Britain and pursue closer cooperation in the future. Sweden's accession marks a further expansion of the Entente's influence in Northern Europe. Clearly, this is not good news for the Central Powers."
 change_news.11.a:0 "It seems Northern Europe will fall into the hands of the Entente."
 change_news.11.b:0 "The situation looks grim."
 change_news.11.c:0 "A phased victory."

 change_news.12:0 "Germany Fully Controls Northern Europe"
 change_news.12.t:0 "Germany Fully Controls Northern Europe"
 change_news.12.d:0 "Ultimately, both Norway and Sweden have joined the Central Powers. The entire Nordic region now lies entirely within the sphere of influence of the Central Powers."
 change_news.12.a:0 "A major victory for the Central Powers."
 change_news.12.b:0 "Good!"
 change_news.12.c:0 "A true disaster."

 change_news.13:0 "Britain Fully Controls Northern Europe"
 change_news.13.t:0 "Britain Fully Controls Northern Europe"
 change_news.13.d:0 "Ultimately, both Norway and Sweden have joined the Entente. The entire Nordic region now lies entirely within the sphere of influence of the Entente."
 change_news.13.a:0 "A major victory for the Entente."
 change_news.13.b:0 "A true disaster."
 change_news.13.c:0 "Good!"

 change_news.14:0 "[Root.GetNameDefCap] Civil War Ends"
 change_news.14.t:0 "[Root.GetNameDefCap] Reunified"
 change_news.14.d:0 "Finally, after negotiations and compromise, the world-shocking civil war in [Root.GetNameDefCap] has ended. The conflict erupted so suddenly that even [Root.GetNameDefCap]'s allies were caught off guard. Although the scale of destruction was not massive, undoubtedly, [Root.GetNameDefCap] and its allies find themselves in a weakened position."
 change_news.14.a:0 "Just like that? I thought they'd fight to the death."
 change_news.14.b:0 "... Well, at least they stopped the bleeding in time."

 change_news.15:0 "Reaffirmation of the Triple Entente"
 change_news.15.t:0 "Reaffirmation of the Triple Entente"
 change_news.15.d:0 "Although minor incidents occurred domestically among the main member states, they were fortunately resolved smoothly. To ensure the effectiveness of the Triple Entente, the primary members reaffirmed the pact in Washington, declaring it permanently valid."
 change_news.15.a:0 "The world is one giant makeshift stage."
 change_news.15.c:0 "Seriously, are you guys just playing house? How ridiculous."
 change_news.15.b:0 "Just a minor hiccup."

 change_news.16:0 "Establishment of the National Liberation Front"
 change_news.16.t:0 "Formation of the National Liberation Front"
 change_news.16.d:0 "The People's Republic of China and the Latin Alliance have announced the joint establishment of the National Liberation Front, proclaiming their intent to bring liberation to oppressed peoples worldwide. Undoubtedly, this will have a profound impact on the global situation."
 change_news.16.a:0 "Unite under the Red Star!"
 change_news.16.b:0 "Another headache-inducing complication."

 change_news.17:0 "Japan Announces Withdrawal from Mainland"
 change_news.17.t:0 "Japan Announces Withdrawal from the Mainland"
 change_news.17.d:0 "With Northeast China reclaimed by Chinese forces, Japan has completely lost its foothold on the mainland. Remnant Japanese troops retreated to the Korean Peninsula, establishing defensive lines along the Yalu River, hoping to hold onto their final continental bridgehead. However, yesterday morning, Chinese forces shattered their hopes—the much-anticipated Yalu River defense crumbled like paper, and large numbers of Chinese troops have crossed the river, advancing toward Pingxiang. Under domestic and international pressure, Japan stated: 'We're done fighting, we don't want that land anymore, stop attacking.'"
 change_news.17.a:0 "Great victory!"
 change_news.17.b:0 "The landscape of East Asia has undergone earth-shattering changes."

 change_news.18:0 "Nationalist Government Announces Surrender"
 change_news.18.t:0 "Nationalist Government Announces Surrender"
 change_news.18.d:0 "Under the offensive of the People's Liberation Army, Nationalist forces collapsed in disarray. Realizing the inevitable, the Nationalist government announced it would cease resistance and accept reorganization under the Chinese Communist Party."
 change_news.18.a:0 "The Eastern dragon has awakened."
 change_news.18.b:0 "Looks like there'll be no gains in the East."

 change_news.19:0 "KMT-CCP Cooperation"
 change_news.19.t:0 "KMT-CCP Cooperation"
 change_news.19.d:0 "Who knows if getting shot changed his mind or he got some legendary hypnosis app, but Chiang Kai-shek actually convinced the Chinese Communist Party to join him. After all, just months ago their borders were still clashing—now they're reconciled again?!"
 change_news.19.a:0 "Why not? For national rejuvenation, why shouldn't we cooperate?"
 change_news.19.b:0 "Holy crap, this is too surreal."

 change_news.20:0 "[Root.GetNameDefCap] Joins the League of Three Emperors"
 change_news.20.t:0 "[Root.GetNameDefCap] Joins the League of Three Emperors"
 change_news.20.d:0 "[Root.GetNameDefCap] announces it will join the League of Three Emperors and declare war on the Entente. [Root.GetNameDefCap]'s entry will tilt the balance of power. Yet, who will ultimately prevail in this great war remains unknown."
 change_news.20.a:0 "We shall march hand in hand toward victory."
 change_news.20.b:0 "Another troublesome opponent..."

 change_news.21:0 "[Root.GetNameDefCap] Joins the Triple Entente"
 change_news.21.t:0 "[Root.GetNameDefCap] Joins the Triple Entente"
 change_news.21.d:0 "[Root.GetNameDefCap] announces it will join the Triple Entente and declare war on the Central Powers. [Root.GetNameDefCap]'s entry will tilt the balance of power. Yet, who will ultimately prevail in this great war remains unknown."
 change_news.21.a:0 "We shall march hand in hand toward victory."
 change_news.21.b:0 "Another troublesome opponent..."

 change_news.22:0 "Dragon Chasing the Sun"
 change_news.22.t:0 "Dragon Chasing the Sun"
 change_news.22.d:0 "After [Root.GetNameDefCap] unified China, its comprehensive national strength greatly improved. Following a period of recuperation, [Root.GetNameDefCap] launched a surprise attack on Japan yesterday. Thanks to severe inter-service rivalry within Japan, [Root.GetNameDefCap]'s Marine Corps successfully seized the opportunity to land on Japanese soil and secure certain areas. As for the outcome of this war, let us wait and see."
 change_news.22.a:0 "Interesting."
 change_news.22.b:0 "Good, once the main force lands, it will be Japan's end."
 change_news.22.c:0 "Dude, what's the navy doing? What's the army doing?"

 change_news.23:0 "Japan Submits to the CCP"
 change_news.23.t:0 "Japan Submits to the CCP"
 change_news.23.d:0 "Under pressure from China, Japan was forced to accept China's proposal and forcibly change its government. Has China's power grown this strong?"
 change_news.23.a:0 "Wow..."
 change_news.23.b:0 "A great victory for the proletarian cause."

 change_news.24:0 "Establishment of the Greater East Asia Co-Prosperity Sphere"
 change_news.24.t:0 "Establishment of the Greater East Asia Co-Prosperity Sphere"
 change_news.24.d:0 "Japan announced it has fully controlled the East Asian region, holding a massive parade in the last resisting city of the Nationalist government. Remnants of the Nationalist and Communist armies were forced to retreat into mountainous regions for guerrilla warfare. The East Asian War ends in victory for Japan."
 change_news.24.a:0 "Japan's ambitions will not stop here."
 change_news.24.b:0 "China has become our rear base; now it's time to look further ahead..."

 change_news.25:0 "Massive Uprising of East Asian Guerrillas"
 change_news.25.t:0 "Massive Uprising of East Asian Guerrillas"
 change_news.25.d:0 "During [Root.GetNameDefCap]'s war with Japan, Chinese guerrillas seized the opportunity while Japan was preoccupied, launching a massive uprising nearly engulfing all of China. Other regions..."
 change_news.25.a:0 "Japan is in for heavy trouble."
 change_news.25.b:0 "These damned peasants."

 change_news.26:0 "Latin Alliance"
 change_news.26.t:0 "Formation of the Latin Alliance"
 change_news.26.d:0 "The Mexican government announced that, to safeguard its own security and that of fellow Latin American nations, it will establish the Latin Alliance and gradually invite other Latin American countries to join. When Latin America unites as a whole, will it impact the global order?"
 change_news.26.a:0 "There's sparks appearing in America's backyard."
 change_news.26.b:0 "A great decision."

 change_news.27:0 "Middle East Controlled by the Central Powers"
 change_news.27.t:0 "Middle East Controlled by the Central Powers"
 change_news.27.d:0 "Under coercion from the French Empire, Iran, Iraq, and Saudi Arabia have announced submission to the French Empire. This marks a further expansion of the Central Powers' influence in the Middle East. Central Powers forces can now threaten the Caucasus region or assist French forces in North Africa in a pincer attack on Egypt."
 change_news.27.a:0 "The situation looks grim."
 change_news.27.b:0 "We now possess a sword to threaten Soviet and North African forces."

 change_news.28:0 "Turkey Joins Britain"
 change_news.28.t:0 "Turkey Joins Britain"
 change_news.28.d:0 "For its own security, Turkey accepted Britain's proposal and chose to join the Entente. This significantly impacts the Central Powers' Middle Eastern strategy. Now, communication between the Central Powers and the Middle East relies solely on sea routes."
 change_news.28.a:0 "A point scored back."
 change_news.28.b:0 "A bit troublesome."

 change_news.29:0 "Austria-Hungary Recaptures Bukovina"
 change_news.29.t:0 "Austria-Hungary Recaptures Bukovina"
 change_news.29.d:0 "Soviet forces, about to advance and take over Bukovina, were intercepted by Austro-Hungarian troops at the border line. Both sides stood in tense confrontation. The Austro-Hungarian Emperor declared: 'The cession of Bukovina, which undermines imperial unity, is absolutely unacceptable. The Imperial Army will spare no effort to defend the integrity of our homeland.'"
 change_news.29.a:0 "Let's await the Soviet response."
 change_news.29.b:0 "We will meet you head-on."

 change_news.30:0 "Soviet Withdrawal"
 change_news.30.t:0 "Soviet Withdrawal"
 change_news.30.d:0 "Under Austria-Hungary's firm stance, Soviet forces voluntarily withdrew from the border line this morning. Though many voices express discontent within the Soviet Union, peace has at least been preserved."
 change_news.30.a:0 "Austria-Hungary wins after all."
 change_news.30.b:0 "At least we've preserved peace, haven't we?"

 change_news.31:0 "The Gunfire of Bukovina"
 change_news.31.t:0 "The Gunfire of Bukovina"
 change_news.31.d:0 "Soviet forces have formally crossed the Austro-Hungarian blockade line, launching fierce attacks on Austro-Hungarian garrisons. Austro-Hungarian forces quickly responded with counterattacks, turning the border into a thunderous battlefield. In response to the Soviet invasion, Austria-Hungary declared total war on the Soviet Union and began large-scale troop mobilizations; Soviet forces also massed in Ukraine. The battle has fully ignited."
 change_news.31.a:0 "Truly insane."
 change_news.31.b:0 "Victory shall be ours."

 change_news.32:0 "The Gunfire of Bukovina"
 change_news.32.t:0 "The Gunfire of Bukovina"
 change_news.32.d:0 "Soviet forces have formally crossed the Austro-Hungarian blockade line, launching fierce attacks on Austro-Hungarian garrisons. Austro-Hungarian forces quickly responded with counterattacks, turning the border into a thunderous battlefield. In response to the Soviet invasion, Austria-Hungary declared total war on the Soviet Union and began large-scale troop mobilizations; Soviet forces also massed in Ukraine. The conflict between Austria-Hungary and the Soviet Union has fully ignited, with allies joining the fray. A war of the century has begun."
 change_news.32.a:0 "We should lend a hand too."
 change_news.32.b:0 "Victory shall be ours."
 change_news.32.c:0 "Could this be the opening act of a world war?"

 change_news.33:0 "French Imperial Army Crosses the Border"
 change_news.33.t:0 "French Imperial Army Crosses the Border"
 change_news.33.d:0 "After completing deployments, the French North African and Middle Eastern legions, supported by air power, suddenly launched attacks on British positions from multiple directions. Clearly, this is a long-planned offensive. Under the fierce assault of French forces, frontline British troops could only retreat.\nDue to the suddenness, no messages have emerged from London or Berlin. London's reaction is easy to guess; Berlin, unsurprisingly, will support its French ally.\nThe entire world is now a powder keg filled with gunpowder, and the French action is the spark that has fallen into it—the world is about to burn."
 change_news.33.a:0 "Terrifying."
 change_news.33.b:0 "If war is demanded, we shall oblige."
 change_news.33.c:0 "Frontline units prepare for immediate attack!"

 change_news.34:0 "Central Powers Air Force Invades Entente Airspace"
 change_news.34.t:0 "Central Powers Air Force Invades Entente Airspace"
 change_news.34.d:0 "A shocking report: according to Moscow and London, a formation of aircraft from Central Powers members flew from above eastern Poland into Ukrainian territory, lingering in Entente airspace for an extended period. Entente pilots, after repeated warnings failed, fired warning shots and forcefully expelled the Central Powers aircraft.\nMoscow calls this a serious provocation, while Berlin claims it was merely a 'blunder' during joint exercises—the lead pilot's navigation was disrupted by Central Powers radar interference, causing system failure and loss of direction. They further label this as 'an Entente conspiracy.'"
 change_news.34.a:0 "...."
 change_news.34.b:0 "Intolerable arrogance!"
 change_news.34.c:0 "Intelligence has been gathered."

 change_news.35:0 "Central Powers Conduct Large-Scale Military Exercises"
 change_news.35.t:0 "Central Powers Conduct Large-Scale Military Exercises"
 change_news.35.d:0 "The Central Powers conducted large-scale joint military exercises, immense in scale, featuring widespread appearances of new rifles and armored vehicles. Undoubtedly, this is a grand display of military might."
 change_news.35.a:0 "Terrifying military strength."
 change_news.35.b:0 "Their intentions are not benign."
 change_news.35.c:0 "Forward!"

 change_news.36:0 "The Second Naval Race"
 change_news.36.t:0 "The Second Naval Race"
 change_news.36.d:0 "Germany has officially launched a massive naval expansion program, with a series of new battleships and cruisers now on the construction agenda. This move has sent shockwaves through the world’s naval powers, all of whom are now accelerating their own warship programs. Undoubtedly, a new naval arms race has begun."
 change_news.36.a:0 "Continue construction"
 change_news.36.b:0 "The world is restless again"

 change_news.37:0 "France Launches Large-Scale Oil Field Development"
 change_news.37.t:0 "France Launches Large-Scale Oil Field Development"
 change_news.37.d:0 "Following its consolidation of control over the Middle East, France has rapidly initiated large-scale exploration and expansion of oil fields. The new technologies developed in this process are also being shared with allied nations to assist in developing their own reserves.\nWhile the ultimate goal remains unclear, this spirit of cooperation and joint research is commendable."
 change_news.37.a:0 "Oil is the lifeblood of industry"
 change_news.37.b:0 "What do I care?"

 change_news.38:0 "[Root.GetNameDefCap] Accepts Soviet Demands"
 change_news.38.t:0 "[Root.GetNameDefCap] Accepts Soviet Demands"
 change_news.38.d:0 "Today, the government of [Root.GetNameDefCap] announced it will comply with Soviet demands and accept Moscow's leadership. This marks a major diplomatic victory for the USSR."
 change_news.38.a:0 "Enjoy your temporary victory"
 change_news.38.b:0 "The Soviet sphere of influence expands once more"

 change_news.39:0 "[Root.GetNameDefCap] Rejects Soviet Demands"
 change_news.39.t:0 "[Root.GetNameDefCap] Rejects Soviet Demands"
 change_news.39.d:0 "[Root.GetNameDefCap] has rejected Soviet demands, declaring that its government will not bow to any power. A defiant stance in the face of pressure."
 change_news.39.a:0 "Let’s see what the Bolsheviks are made of"
 change_news.39.b:0 "If they only respect absolute force..."

 change_news.40:0 "Siberian Development Completed"
 change_news.40.t:0 "Siberian Development Completed"
 change_news.40.d:0 "At a recent press conference, Soviet officials proudly announced the completion of Siberia's development. The trans-Siberian railway now fully operates across the entire region — an engineering feat once thought impossible."
 change_news.40.a:0 "A great achievement of the motherland"
 change_news.40.b:0 "Well, they do have some capability after all"

 change_news.41:0 "Mexico Accepts U.S. Proposal"
 change_news.41.t:0 "Mexico Accepts U.S. Proposal"
 change_news.41.d:0 "The Mexican government has announced acceptance of Washington’s demands and will act immediately. Specific treaty terms remain classified, but one thing is clear: Washington’s strategic ambitions have advanced significantly."
 change_news.41.a:0 "Oh"
 change_news.41.b:0 "So they’re finally moving on their backyard"

 change_news.42:0 "Mexico Rejects U.S. Proposal"
 change_news.42.t:0 "Mexico Rejects U.S. Proposal"
 change_news.42.d:0 "Mexico has publicly revealed the unequal treaty demanded by Washington—requiring regime change and surrender of all resource extraction rights. Mexico declares complete severance of ties with the United States, vowing to defend national dignity at all costs."
 change_news.42.a:0 "They’ve got some nerve"
 change_news.42.b:0 "Now this will be interesting"

 change_news.43:0 "Venezuela Accepts U.S. Proposal"
 change_news.43.t:0 "Venezuela Accepts U.S. Proposal"
 change_news.43.d:0 "Under mounting pressure from the United States, Venezuela has announced it will halt foreign resource trade and transfer extraction rights to the U.S. American officials state they will assume responsibility for previous trade agreements, citing the need for U.S. Navy protection of commercial shipping lanes."
 change_news.43.a:0 "."
 change_news.43.b:0 "."

 change_news.45:0 "Venezuela Rejects U.S. Proposal"
 change_news.45.t:0 "Venezuela Rejects U.S. Proposal"
 change_news.45.d:0 "Venezuela has rejected the U.S. trade bill and called upon other nations to help defend free trade."
 change_news.45.a:0 "They’ve got some nerve"
 change_news.45.b:0 "Now this will be interesting"

 change_news.46:0 "Italy Is Divided"
 change_news.46.t:0 "Italy Is Divided"
 change_news.46.d:0 "FOR --D GUIDANCE\nAccording to a report from the Berlin court, the combined forces of the German Empire, Austria-Hungary, and the French Empire formally occupied Rome yesterday. The 'Protocol of Rome,' signed at the Medici Palace, confirmed the partition of Italian territory:\nNorthern Italy, from South Tyrol to Trieste, incorporated into Austria-Hungary’s direct economic zone\nCorsica and the area around Nice placed under French military administration\nRemaining territories placed under German control\nThe Berliner Zeitung hailed it as 'a necessary correction of Mediterranean disorder,' while The Times of London warned that 'Napoleonic-style territorial deals threaten the entire European balance.' A Moscow Radio commentator observed: 'When emperors carve up Italy at the dinner table, the clink of cutlery sounds louder than cannon fire.'"
 change_news.46.a:0 "May God have mercy on the Italian peninsula"

 change_news.47:0 "Total Mobilization for the Soviet Patriotic War!"
 change_news.47.t:0 "Total Mobilization for the Soviet Patriotic War!"
 change_news.47.d:0 "Factories roar day and night. Rail lines are packed with trains bound for the front.\nFrom the Urals to Leningrad, from Siberia to the Caucasus—the entire nation is at war.\nEvery worker has become a soldier. Every city a fortress.\nThis is a people’s war. A war for survival.\nThe gears of the Patriotic War have begun turning—The Soviet Union will meet fate with steel and will."
 change_news.47.a:0 "The enemy shall burn"
 change_news.47.b:0 "This doesn’t look good"
 change_news.47.c:0 "Now this will be interesting"

 change_news.48:0 "Soviet Red Square Parade Begins"
 change_news.48.t:0 "Soviet Red Square Parade Begins"
 change_news.48.d:0 "Amid biting winds, troops march in perfect formation past Lenin’s Mausoleum.\nDespite fierce fighting at the front and enemy forces nearing the capital, the Kremlin has chosen to hold the parade.\nIt is not merely a boost to morale—it is a direct message to the invader:\nWe will not retreat. We will not yield. We will fight to the end."
 change_news.48.a:0 "Invaders shall die"
 change_news.48.b:0 "Red Square parade? More like Red Square collapse!"
 change_news.48.c:0 "A bold gamble"

 change_news.49:0 "Red Square Parade Successfully Concluded"
 change_news.49.t:0 "Red Square Parade Successfully Concluded"
 change_news.49.d:0 "The parade ends. Soldiers depart, tanks roll toward the battlefield.\nThe enemy believed the Red Army was on its last legs—but they were wrong.\nThis was not just a display of strength, but a declaration of belief:\nEven amid war and ruin, we march forward with pride.\nThe Soviet Union has shown its courage—and declared its resolve to the world."
 change_news.49.a:0 "Invaders shall die"
 change_news.49.b:0 "Damn it!"
 change_news.49.c:0 "The Soviets have shown their courage"

 change_news.50:0 "Moscow Falls"
 change_news.50.t:0 "Moscow Falls"
 change_news.50.d:0 "Telegraph lines go silent. The red flag no longer flies. Enemy boots march through the heart of the city.\nThe once-mighty Kremlin stands in silence. Foreign footsteps echo across Red Square.\nThis is the heaviest blow yet to the Soviet Union."
 change_news.50.a:0 "Damn it!"
 change_news.50.b:0 "Just as expected"
 change_news.50.c:0 "The Soviet Union is finished"

 change_news.51:0 "Order No. 227 Issued"
 change_news.51.t:0 "Order No. 227 Issued"
 change_news.51.d:0 "With the enemy advancing and the front collapsing, the Soviet command issues an unprecedented directive:\nNot one step back. Retreat means execution.\nA warning to the weak. A call to the brave.\nSoldiers know there is no retreat—only forward.\nThe situation is dire, but there is still a chance to turn the tide."
 change_news.51.a:0 "Not one step back!"
 change_news.51.b:0 "None of my concern"
 change_news.51.c:0 "The situation is dire"

 change_news.52:0 "Soviet Victory at Kursk"
 change_news.52.t:0 "Soviet Victory at Kursk"
 change_news.52.d:0 "Smoke still lingers over the battlefield. Burning enemy tank wrecks smolder in the sun.\nThe Red Army not only halted the enemy’s greatest armored assault but launched a decisive counteroffensive.\nKursk is no longer a battleground—it is where enemy ambition died.\nThis battle marks the final loss of strategic initiative by the aggressor."
 change_news.52.a:0 "We shall advance until victory is ours"
 change_news.52.b:0 "This doesn’t look good"
 change_news.52.c:0 "Wow"

 change_news.53:0 "Soviet Defeat at Kursk"
 change_news.53.t:0 "Soviet Defeat at Kursk"
 change_news.53.d:0 "Despite massive troop and resource commitment, precise enemy strikes shattered our defensive lines.\nTactical errors, intelligence leaks, supply shortages—all flaws erupted at once.\nThis is not the end for the Soviet Union, but a new beginning."
 change_news.53.a:0 "The enemy may hold the advantage—for now—but the war is far from over."
 change_news.53.b:0 "A glorious victory!"
 change_news.53.c:0 "Wow"

 change_news.54:0 "Massive Battle Erupts at Kursk"
 change_news.54.t:0 "Massive Battle Erupts at Kursk"
 change_news.54.d:0 "On the map, red arrows point toward the Kursk steppes—the crucial crossroads of the Eastern Front.\nBoth sides commit unprecedented forces. Armored columns clash across open fields. Artillery lights up the night sky.\nThis is not merely a battle—it is the decisive confrontation that will shape the war’s outcome.\nWhoever controls Kursk, controls the future."
 change_news.54.a:0 "Victory awaits us"
 change_news.54.b:0 "Victory awaits us"
 change_news.54.c:0 "Wow"

 change_news.55:0 "Soviet Land Converted into Fortresses"
 change_news.55.t:0 "Soviet Land Converted into Fortresses"
 change_news.55.d:0 "To resist endless enemy advances, the Red Army has fortified every inch of controlled territory with hidden bunkers, underground tunnels, and strongholds. Using terrain to their advantage, Soviet forces inflict heavy losses and slow the enemy advance to a crawl."
 change_news.55.a:0 "Make every step cost them dearly!"
 change_news.55.b:0 "How annoying"
 change_news.55.c:0 "Wow"

 change_news.56:0 "Birth of Continental Hegemony"
 change_news.56.t:0 "Birth of Continental Hegemony"
 change_news.56.d:0 "As the armies of the Central Powers ride into the capital of the last free nation, continental dominance is now complete. There is no doubt—the power of the Central Powers has reached its peak."
 change_news.56.a:0 "We are unstoppable"
 change_news.56.b:0 "Damn it"
 change_news.56.c:0 "Intimidating"

 change_news.57:0 "Birth of Balkan Hegemony"
 change_news.57.t:0 "Birth of Balkan Hegemony"
 change_news.57.d:0 "The iron cavalry of Austria-Hungary has crushed every neighboring Balkan state. With the final piece of old Austro-Hungarian territory reclaimed, the balance of the Balkans is shattered. On these lands, a new hegemon rises."
 change_news.57.a:0 "We are unstoppable"
 change_news.57.b:0 "Intimidating"

 change_news.58:0 "French Industrial Revival Plan"
 change_news.58.t:0 "France Launches National Industrial Revival Plan"
 change_news.58.d:0 "FOR --D GUIDANCE\nParis — The French government today officially launched the 'National Industrial Revival Plan,' marking a comprehensive restructuring of its industrial base to meet growing security challenges. The Minister of Economy declared in the National Assembly that the state would nationalize key industries, consolidate fragmented production capacity, improve technological efficiency, and establish civil-military production integration.\nThe first phase focuses on steel, machinery, and automobile manufacturing, with Renault, Citroën, and Creusot-Loire placed on the national priority list. The government insists this is not a shift to full central planning, but a measure to ensure that 'every factory serves the nation in times of crisis.'\nInternational observers note this reflects France’s attempt to overcome a decade of industrial stagnation and reclaim its status as a leading European industrial power."
 change_news.58.a:0 "We shall rise again"
 change_news.58.b:0 "The French have shown their determination"

 change_news.59:0 "Germany Helps China Unify"
 change_news.59.t:0 "Germany Helps China Unify"
 change_news.59.d:0 "With Germany's substantial aid, China has finally achieved national unification. This not only fundamentally shifts the balance of power on the East Asian continent, but also marks a major success in Germany's strategic layout in the Far East."
 change_news.59.a:0 "Allies should help each other"
 change_news.59.b:0 "The landscape of East Asia has been completely transformed"

 change_news.60:0 "Japan Announces Joining the Entente"
 change_news.60.t:0 "Japan Announces Joining the Entente"
 change_news.60.d:0 "The Japanese government has formally announced its accession to the Entente camp. Faced with drastic changes in the East Asian situation, Japan has chosen to align with the European powers in order to protect its own interests within a new international order."
 change_news.60.a:0 "Unity is strength"
 change_news.60.b:0 "Is such a complex alliance truly stable?"

 change_news.61:0 "Soviet Union Marches into Mongolia"
 change_news.61.t:0 "Soviet Union Marches into Mongolia"
 change_news.61.d:0 "Soviet forces have suddenly crossed the border and launched an attack on Mongolia! Meanwhile, the Republic of China in the south has begun mobilizing its army. Will this special military operation escalate into a full-scale war? Let's wait and see."
 change_news.61.a:0 "It won't take long"
 change_news.61.b:0 "Interesting"
 change_news.61.c:0 "Damn it"

 change_news.62:0 "Republic of China Marches into Mongolia"
 change_news.62.t:0 "Republic of China Marches into Mongolia"
 change_news.62.d:0 "Just two hours after the Soviet Union marched into Mongolia, the Chinese troops on the border also launched a surprise attack. Caught between two major powers, Mongolia has no chance left. As the two sides compete for territory, could this lead to a full‑scale war? Stay tuned for further developments."
 change_news.62.a:0 "If he crosses the river, so will I"
 change_news.62.b:0 "Interesting"
 change_news.62.c:0 "They're fighting over turf with us?!"

 change_news.63:0 "Full‑Scale War Breaks Out Between the Republic of China and the Soviet Union"
 change_news.63.t:0 "Full‑Scale War Breaks Out Between the Republic of China and the Soviet Union"
 change_news.63.d:0 "During the scramble for territory, a single clash turned this carve‑up into a real battlefield. The forward units of both sides have already exchanged heavy fire, followed by cross‑border artillery barrages and aircraft. Behind these two nations stand two vast military blocs—the flames of war now spread across the globe."
 change_news.63.a:0 "Then bring it on!"
 change_news.63.b:0 "Then bring it on!"
 change_news.63.c:0 "The fire has been lit."

 change_news.64:0 "Soviet Union Invades Afghanistan"
 change_news.64.t:0 "Soviet Union Invades Afghanistan"
 change_news.64.d:0 "To open a supply route toward India, the Soviet Union has launched an attack on Afghanistan."
 change_news.64.a:0 "So brutal"
 change_news.64.b:0 "Get it over with quickly"
 change_news.64.c:0 "Interesting"

 change_news.65:0 "Mongolia Carved Up"
 change_news.65.t:0 "Mongolia Carved Up"
 change_news.65.d:0 "Surprisingly, both sides showed restraint during the scramble for territory and avoided armed conflict. In the end, caught between the two, Mongolia surrendered to both powers. The two countries then divided the land based on the areas they already controlled."
 change_news.65.a:0 "At least we gained some buffer zone"
 change_news.65.b:0 "Disrupted, but still enough"
 change_news.65.c:0 "So brutal"

 change_news.66:0 "Soviet Union Vows to Resist to the End"
 change_news.66.t:0 "Soviet Union Vows to Resist to the End"
 change_news.66.d:0 "After losing on the battlefield, the Soviet government has evacuated to allied territory and issued a proclamation, calling on all Soviet soldiers and civilians to fight on bravely and never surrender!"
 change_news.66.a:0 "Damn it"
 change_news.66.b:0 "We will never surrender"
 change_news.66.c:0 "Remarkable tenacity"

 change_news.67:0 "Siam Yields to Britain"
 change_news.67.t:0 "Siam Yields to Britain"
 change_news.67.d:0 "Under mounting pressure from Britain, Siam has finally chosen to yield."
 change_news.67.a:0 "Good"
 change_news.67.b:0 "......"
 change_news.67.c:0 "Another free country gone"

 change_news.68:0 "Argentina Joins Germany"
 change_news.68.t:0 "Argentina Joins Germany"
 change_news.68.d:0 "With German assistance, Argentina's industrial level and defense capability have greatly improved. In return, Argentina has chosen to join the German camp."
 change_news.68.a:0 "We need to crack down on South American nations"
 change_news.68.b:0 "Good"
 change_news.68.c:0 "America's backyard has been stolen"

 change_news.69:0 "Bolivia Joins Germany"
 change_news.69.t:0 "Bolivia Joins Germany"
 change_news.69.d:0 "With German assistance, Bolivia's industrial level and defense capability have greatly improved. In return, Bolivia has chosen to join the German camp."
 change_news.69.a:0 "We need to crack down on South American nations"
 change_news.69.b:0 "Good"
 change_news.69.c:0 "America's backyard has been stolen"

 change_news.70:0 "Brazil and Colombia Join the United States"
 change_news.70.t:0 "Brazil and Colombia Join the United States"
 change_news.70.d:0 "Due to defense and security pressures, Brazil, Colombia, and the United States have signed a mutual defense pact, marking their formal entry into the Entente."
 change_news.70.a:0 "Good"
 change_news.70.b:0 "Expected"
 change_news.70.c:0 "Closing the stable door after the horse has bolted?"

 change_news.71:0 "Central America Joins Germany"
 change_news.71.t:0 "Central America Joins Germany"
 change_news.71.d:0 "As the Entente suffers repeated defeats on the battlefield, Central America has announced it will join the German camp to reclaim lands occupied by British colonists and liberate its former homeland."
 change_news.71.a:0 "Seeking death"
 change_news.71.b:0 "We now have a dagger pointed at America's heart"
 change_news.71.c:0 "Interesting"


