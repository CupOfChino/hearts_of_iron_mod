 FRA_the_change_politics: "Changing Political Landscape"
 FRA_the_change_politics_desc: "Numerous political parties exist domestically, lacking a strong leader, resulting in low administrative efficiency. However, this situation will not last long"
 FRA_the_new_politics: "A Renewed Political Landscape"
 FRA_the_new_politics_desc: "The Emperor has returned; France will have peace. The Emperor has returned; France has a leader"
 FRA_military_reform: "Military Reform"
 FRA_the_highest_commonder: "Supreme Military Command"
 FRA_imperial_army: "Imperial Army"
 FRA_defence_neighbour: "Defend Against Unfriendly Neighbors"
 FRA_defence_neighbour_desc: "Germany to the east seeks revenge; Italy to the south watches hungrily; Britain to the north strangles our throat"
 FRA_renewed_war_ger: "War Rekindled"
 FRA_renewed_war_sov: "The Second Charm"
 FRA_improve_livelihood: "Livelihood Construction"
 FRA_improve_livelihood_desc: "The impact of the Great War on our economy was devastating, compounded by the Great Depression. There are still numerous slums within our borders. Livelihood issues have become an urgent problem needing resolution"
 FRA_improve_armament: "Military Construction"
 FRA_improve_armament_desc: "Unfriendly neighbors have long coveted our homeland. An inevitable war has already begun"
 FRA_the_irregular_army: "Organize Irregular Forces"
 FRA_the_irregular_army_desc: "The more troops, the greater the expense. Currently, the government cannot maintain a large army. To prepare for possible high-intensity warfare in the future, training irregular forces may be a good solution"
 FRA_engage_in_production: "Engage in Production"
 FRA_engage_in_production: "Having a large number of young adults engage in production can effectively promote our economic development"
 FRA_the_inperial_navy: "Imperial Navy"
 FRA_navy_competition: "Naval Arms Race"
 FRA_navy_competition_desc: "Hey, England, your days of threatening us with your navy are over. Hand over the position of maritime supremacy to me."
 FRA_the_inperial_air: "Imperial Air Force"
 FRA_modular_production_air: "Modular Production"
 FRA_modular_production_air_desc: "This new production method effectively reduces aircraft production costs"
 FRA_the_third_empire: "The Third Empire"
 FRA_black_man: "Citizenship Expansion"
 FRA_black_man_desc: "As the scope of citizenship expands, so too will the size of the manpower pool"
 FRA_the_industry_change: "Industrial Reform"
 FRA_army_defensive: "Defensive Operations"
 FRA_army_ttk: "Mobile Tactics"
 FRA_Undertake_the_heavy_responsibility_of_the_navy: "Undertake the Heavy Responsibility of the Navy"
 FRA_Undertake_the_heavy_responsibility_of_the_navy_desc: "Our alliance possesses the world's largest army and air force, but our navy falls short compared to potential adversaries. This issue must be taken seriously! Although our allies lack adequate conditions for naval development, we have, through long-term accumulation, established a complete industrial chain. We must proactively take on the naval responsibility, carving a path through the seas for our alliance."
 FRA_carrier_fight: "Carrier Operations"
 FRA_battleship_fight: "Main Fleet"
 FRA_ship_defend: "Fleet Defense"
 FRA_undersea_fight: "Undersea Attack"
 FRA_the_wwi_experience: "Lessons of the Great War"
 FRA_the_wwi_experience_desc: "The meat grinder of the Great War proved that blindly throwing millions of untrained conscripts into battle was a national disaster. The Emperor's new army will learn from this lesson; we shall build a compact, well-equipped, and highly-trained professional force. Every soldier is a valuable specialist, every tank a blade of breakthrough. We will no longer soak the earth with blood, but instead precisely destroy our enemies with steel and resolve."
 FRA_napoleon_soul: "Spirit of Napoleon"
 FRA_napoleon_soul_desc: "The name itself is a banner. The heir of Napoleon has not only brought military reforms, but has also reignited the French nation's sense of honor and martial spirit. The people and the army are united around the Emperor for a common, glorious cause, willing to sacrifice everything for the greatness of the Empire."
 FRA_the_empire_eyes: "Eyes of the Empire"
 FRA_the_empire_eyes_desc: "A blade in the shadows, an unyielding shield before the throne. The 'Eyes of the Empire' shall be our sharpest weapon and our most reliable armor. It is omnipresent, penetrating everywhere—within our borders, it eradicates the subversive plots of Republicans and foreign spies, ensuring the Empire remains an unbreakable monolith; abroad, it sows panic and creates fissures deep within enemy nations, clearing the path for the advance of the Grande Armée. Loyalty, precision, ruthlessness—this is the creed of the 'Eyes of the Empire'."
 

