 bunker_modifier: "A complex network of hidden bunkers and interconnected tunnels"
 mod_with_fra_the_five_plan: "French Industry"
 mod_with_fra_the_five_plan_desc: "Despite a long-standing industrial tradition, France's industrial system showed signs of fatigue in the 1930s. Scattered small enterprises, outdated production technologies, frequent strikes, and political instability severely constrained output. Steel plants operated inefficiently, military factories were underutilized, and there was a lack of coordination between civilian and military production.\nHowever, after profound industrial reforms and national mobilization, France's industrial potential will be reawakened. Factories will be modernized, production efficiency will significantly increase, and civilian and military industries will operate in coordination. The once fragmented and inefficient industrial system will provide solid support for the Republic's defense and rejuvenation."
 mod_with_the_fra_army: "French Army"
 mod_with_the_fra_army_desc: "\"The Somme,\" \"Verdun\"... these names are medals of honor, yet also nightmares deeply embedded in the soul of our army. The pyrrhic victory of the Great War, bought with the blood of a generation, has crippled the offensive spirit of this once 'Foremost Army in Europe.' The rigid doctrine of 'Methodical Battle' has become dogma; the high command is steeped in conservatism and pessimism; troops are equipped with outdated arms, and their morale relies on static defense lines rather than mobile assault. The army's soul seems forever trapped in the muddy trenches of 1916.\n\nComplacency only leads to ruin! The bitter lessons have taught us resilience, not cowardice. The experience of the Great War shall become the bedrock of our caution and fortitude, a wellspring of vigilance and strength! Through a thorough overhaul of our doctrine and command structure, we will fully internalize the lessons of the last war. The legacy of Verdun shall ultimately forge an armed force that is more prudent, resilient, and deadly!"
 mod_with_fra_air: "French Air Force"
 mod_with_fra_air_desc: "As one of Europe's earliest air forces, the French Air Force carries a long and esteemed legacy of aviation. Despite facing challenges in equipment modernization and tactical innovation, this aerial branch maintains its professional competence and combat spirit. Through modernized pilot training programs, the introduction of advanced aviation technology, and innovations in tactical doctrine, the French Air Force is steadily reshaping its aerial combat capabilities. On the battlefields of the future, this revitalized air force will undertake the strategic missions of defending national airspace and supporting ground operations, providing a solid aerial shield for the Republic's defense security."
 mod_with_fra_navy: "French Navy"
 mod_with_fra_navy_desc: "With centuries of naval tradition, the French Navy was once among the world's most powerful maritime forces. Facing the challenges of a new era at sea, this navy is undergoing a profound modernization overhaul. Through the renewal of vessel equipment, optimization of fleet structure, and enhancement of blue-water operational capabilities, the French Navy is committed to rebuilding its status as a blue-water navy. The balanced development of surface vessels, underwater forces, and naval aviation coordination will ensure this navy can effectively safeguard French overseas interests, protect sea lanes, and project national power into distant waters when necessary."



 mod_with_eng_army: "British Royal Army"
 mod_with_eng_army_desc: "The British Royal Army is renowned for its rigorous disciplinary system and professional officer corps. With extensive overseas deployment experience, this force can adapt to various battlefield environments, providing reliable ground power to safeguard British interests worldwide."
 mod_with_usa_army: "United States Army"
 mod_with_usa_army_desc: "The United States Army is built upon a strong industrial foundation, emphasizing modern equipment and logistical systems. Its flexible combat doctrine and large-scale force projection capabilities enable it to effectively execute cross-regional military operations."
 mod_with_eng_air: "Royal Air Force"
 mod_with_eng_air_desc: "The Royal Air Force maintains a high state of readiness and an excellent pilot training system. With extensive experience in air defense operations and tactical support, it effectively defends national airspace and provides reliable air support for ground forces."
 mod_with_usa_air: "United States Air Force"
 mod_with_usa_air_desc: "The United States Air Force possesses significant numerical advantages and advanced technological equipment. Its strategic projection capabilities and multi-mission execution efficiency ensure air superiority across various military operations."
 mod_with_eng_navy: "Royal Navy"
 mod_with_eng_navy_desc: "The Royal Navy boasts a long maritime tradition and rich experience in blue-water operations. Its balanced fleet structure and global deployment capabilities enable it to effectively protect sea lanes and project national power."
 mod_with_usa_navy: "United States Navy"
 mod_with_usa_navy_desc: "The United States Navy is renowned for its massive fleet size and advanced ship designs. Strong shipbuilding capabilities and a comprehensive base network support its global naval presence and operational capacity."





