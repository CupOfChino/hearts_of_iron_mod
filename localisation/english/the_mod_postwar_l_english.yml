l_english:
 postwar_order_categories: "The Postwar Order"
 postwar_order_categories_desc: "The flames of war have died, but the old alliance lies in ruins. Former comrades now eye each other with suspicion — it is time to settle old scores and show the world who the true hegemon is."
 postwar_declare_war_on_former_allies: "Settle Old Scores"
 postwar_declare_war_on_former_allies_desc: "Preparations are complete. Declare war on all former allies — the curtain of the Third World War is about to rise!"
 postwar.1.t: "The Splitting of the Alliance"
 postwar.1.d: "Before the fruits of victory are even tasted, cracks have already appeared. Kaiser Wilhelm II, Napoleon IV and Archduke Otto each harbour their own ambitions — the old pact can no longer restrain the greed of three empires. It is time to go our separate ways and dominate the world alone."
 postwar.1.a: "Embrace the New Era!"
 postwar.1.a_tt: "§YAfter choosing this, we will leave the old alliance and establish our own new faction on the road to hegemony!§!"
 postwar.2.t: "The Splitting of the Entente"
 postwar.2.d: "The cheers of victory have not yet faded, and former allies are already suspicious of each other. The interests of London, Washington, Moscow and Tokyo drift further apart — the league of the free world cannot withstand their hegemonic ambitions."
 postwar.2.a: "Embrace the New Era!"
 postwar.2.a_tt: "§YAfter choosing this, we will leave the old alliance and establish our own new faction on the road to hegemony!§!"
 postwar.3.t: "Settle Old Scores"
 postwar.3.d: "Thirty years of preparation, for this very moment. Former allies now harbour their own ambitions — it is time to declare war and show the world who the true hegemon is!"
 postwar.3.a: "Declare war on former allies and become the world hegemon!"
 postwar.4.t: "The Third Empire Splits — Every Power for Itself"
 postwar.4.d: "The old pact has shattered for good. Kaiser Wilhelm II founds the Kaiserbund, Napoleon IV assembles the Continental System, Archduke Otto rebuilds the Habsburg Alliance, and the Republic of China proclaims the Celestial Empire. An age of rival hegemons has begun."
 postwar.4.a: "Rule our own sphere and strive for the world!"
 postwar.5.t: "The Entente Splits — Every Power for Itself"
 postwar.5.d: "The victorious pact is a thing of the past. Britain declares the Sun Never Sets, America leads the Free Nations League, the Soviet Union rebuilds the Comintern, and Japan raises the banner of the Greater East Asia Co-Prosperity Sphere. A new world order has begun."
 postwar.5.a: "Rule our own sphere and strive for the world!"
 postwar_core_flag: "§YPostwar Core Nation§!"
 postwar_former_ally_flag: "§RFormer Ally§!"
 now_has_a_faction_flag: "§GAlready Established a New Faction§!"
 ww2_broke_out_flag: "§RThe Second World War Has Broken Out§!"
 third_empire_era_over_flag: "§RThe Era of the Old Alliance Has Ended§!"
 ww3_started_flag: "§RThe Third World War Has Begun§!"
