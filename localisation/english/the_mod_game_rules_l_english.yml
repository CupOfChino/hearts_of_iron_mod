 The_navy_game_rule_open_t:0 "§YAI Navy Production Boost§"
 The_navy_game_rule_open_desc:0 "The AI will receive a significant boost to naval production, and §Ymajor AI countries§! will gain §R15 off-map dockyards§! every §Ryear§!. Recommended only for players with a basic understanding of naval mechanics."

 The_Purgatory_game_rule:0 "§RPurgatory Difficulty§! (Work in Progress)"
 The_Purgatory_game_rule_default:0 "None"
 The_Purgatory_game_rule_default_desc:0 "Original flavor"
 The_Purgatory_game_rule_army_open:0 "§GArmy Boost§! (Work in Progress)"
 The_Purgatory_game_rule_army_open_t:0 "§GArmy Boost§! (Work in Progress)"
 The_Purgatory_game_rule_army_open_desc:0 "The AI will possess endless troops and terrifying attack/defense buffs.\n\n§GNo matter where or when, they will crawl out from the line where two planes intersect.§!\n"
 The_Purgatory_game_rule_air_open:0 "§RAir Force Nightmare§!"
 The_Purgatory_game_rule_air_open_t:0 "§RAir Force Nightmare§!"
 The_Purgatory_game_rule_air_open_desc:0 "The AI major powers will receive a nightmare-grade air force: 1940/1944 aircraft techs, upgraded fighter designs, huge plane stockpiles in waves from 1940, an air force buff spirit, and air XP. AI air base capacity is replenished automatically so the planes can take off. Spawning respects the aircraft cap (4k/8k in peace, 10k/20k at war; halved caps when the aircraft restriction is on). Only the eight AI majors of this mod, never puppets."
 The_Purgatory_game_rule_navy_open:0 "§BNavy Boost§! (Work in Progress)"
 The_Purgatory_game_rule_navy_open_t:0 "§BNavy Boost§! (Work in Progress)"
 The_Purgatory_game_rule_navy_open_desc:0 "The AI will possess a navy of terrifying size and terrifying naval buffs.\n\n§BGregarious cockroaches, acting only for their one and only emperor.§!\n"
 The_Purgatory_game_rule_country_open:0 "§YProduction Boost§! (Work in Progress)"
 The_Purgatory_game_rule_country_open_t:0 "§YProduction Boost§! (Work in Progress)"
 The_Purgatory_game_rule_country_open_desc:0 "The AI will have infinite production capacity, manpower, and factories.\n\n§YAdapting to everything, becoming numb.§!\n"
 The_Purgatory_game_rule_all_open:0 "§RPurgatory§! (Work in Progress)"
 The_Purgatory_game_rule_all_open_t:0 "§RPurgatory§! (Work in Progress)"
 The_Purgatory_game_rule_all_open_desc:0 "All boosts enabled simultaneously.\n\n§RLasciate ogne speranza, voi ch'intrate — Abandon all hope, ye who enter here.§!\n"

