 the_third_empire:0 "The Three Emperors' Alliance"
 cjg_open_the_third_empire:0 "Three Emperors' Alliance"
 the_old_firend_flag:0 "Old Allies"
 RULE_GROUP_CJG_SETUP:0 "Reverse Gear Mod Gameplay Settings"
 RLUE_GROUP_OPTION_DEFAULT:0 "Three Emperors' Alliance Timeline Option"
 cjg_game_rule_third_empire:0 "Germany, France, and Hungary set aside their past grievances and form a powerful military alliance. To safeguard their security and interests, Britain, the Soviet Union, and the United States formally sign a mutual defense treaty. Thus begins a world war spanning six continents and four oceans."
 cjg_open_the_third_empire_t:0 "§REnable the Three Emperors' Alliance§!"
 cjg_open_the_third_empire_desc:0 "Please ensure §RGermany follows the Monarchist path§!, §RHungary restores Austria-Hungary§!, and §RFrance takes the Bonapartist route§!. §ROtherwise, the alliance and its follow-up events will not trigger properly§!. (§RIt is recommended not to play as Britain on hardline paths due to performance issues§!) (If this timeline is chosen, §Ravoid playing as Commonwealth nations§!—future events include Britain forcibly absorbing the Commonwealth.) After the Triple Alliance forms, §Rthe Triple Entente will gain numerous 'Mars Troops' and a moderate number of 'Mars Factories'§!, along with several national spirits."
 cjg_open_the_old_firend_t:0 "Enable the Old Allies"
 cjg_open_the_old_firend_desc:0 "Germany and Austria-Hungary form the Old Alliance; Britain and France form the opposing bloc. Ensure §RGermany follows the Monarchist path§! and §RHungary restores Austria-Hungary§!."
 cjg_game_rule_third_empire:0 " §RFor the Three Emperors' Alliance, Germany and Austria-Hungary must take the neutral path, and France must take the Napoleonic path; for the Old Allies, only Germany and Austria-Hungary need to be on the neutral path§! "

