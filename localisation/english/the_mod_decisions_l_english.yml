 GER_ai_categories:0 "German AI Enhancements"
 GER_third_empire_categories:0 "Three Emperors' Alliance"
 GER_third_empire_categories_desc: "The chains of Versailles have shattered, and the old blood of Europa boils once more! His Majesty Wilhelm II's Iron Cross eagle flag flies over the Berlin dome, Napoleon IV's eagle insignia reforges Paris's glory, and Otto von Habsburg's Holy Crown of St. Stephen is crowned in Budapest—this is the return of monarchs and knights, the ultimate judgment of imperial bloodline upon the falsehood of republics!"
 GER_third_empire_war_categories:0 "Allied War Strategy"
 GER_third_empire_war_categories_desc: "War has erupted, and history has long proven to us: can peace bestowed by others truly be called peace? Peace can only be earned by our own efforts!"
 GER_third_empire_prepare_war_categories:0 "War Mobilization"
 GER_third_empire_prepare_war_categories_desc: "The confrontation between the two major blocs has cast the shadow of war over the entire world. We are not prepared for war, and if it breaks out, we will be extremely passive. We must seize the time to mobilize for war."
 GER_with_friend_categories:0 "Joint Resolutions"
 GER_with_friend_categories_desc: "'Unity is strength,' 'A journey of a thousand miles begins with a single step.' Bit by bit, accumulation eventually leads to a lifetime. In essence: §RThe bonuses obtained here will apply to all members of our faction.§!"
 GER_new_third_empire_has_war_categories: "World War II"
 GER_new_third_empire_has_war_categories_desc: "You know, the war has already begun... \n It now concerns every one of us. \n §RThis war will only end when one side is completely defeated... or will it?§!"
 GER_the_new_technologies_categories:0 "Special Technology"

 FRA_ai_categories:0 "French AI Enhancements"
 FRA_third_empire_categories:0 "Three Emperors' Alliance"
 FRA_third_empire_categories_desc: "The chains of Versailles have shattered, and the old blood of Europa boils once more! His Majesty Wilhelm II's Iron Cross eagle flag flies over the Berlin dome, Napoleon IV's eagle insignia reforges Paris's glory, and Otto von Habsburg's Holy Crown of St. Stephen is crowned in Budapest—this is the return of monarchs and knights, the ultimate judgment of imperial bloodline upon the falsehood of republics!\n --D Guidance"
