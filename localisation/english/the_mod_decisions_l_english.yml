 CHI_third_empire_categories: "Three Emperors' Alliance · China"
 CHI_third_empire_categories_desc: "As the banners of the Three Emperors' Alliance rise over Europe, the Republic of China turns its gaze to all directions. Standing shoulder to shoulder with the German Reich, developing the sleeping oil fields, reclaiming the leased territories and the ancestral lands, and asserting the Mandate of Heaven over East Asia — this is the road of China's revival, and the Empire's sword planted in the Far East."
 CHI_third_empire_oil_development: "Develop the Oil Fields"
 CHI_third_empire_oil_development_desc: "The derricks at Yumen and Dushanzi have been silent for too long. Invest capital and expertise, and make the sleeping oil fields roar day and night."
 CHI_invade_nepal: "Invade Nepal"
 CHI_invade_nepal_desc: "The Gurkha mountain kingdom guards the southern flank of the Himalayas. Conquer Nepal to secure our flank!"
 CHI_invade_bhutan: "Invade Bhutan"
 CHI_invade_bhutan_desc: "This tiny kingdom blocks the gateway to South Asia. March forth and bring the Himalayan ridge under the Empire."
 CHI_third_empire_oil_development_desc: "Drilling teams stand ready at Yumen, Dushanzi, the Junggar Basin, Yanchang, Sichuan and Liaodong. Invest capital and expertise, and make the sleeping oil fields roar day and night — the black gold of the northwest, southwest and northeast will flow as the Empire's lifeline."
 CHI_third_empire_border_defense: "Frontier Supply Lines"
 CHI_third_empire_border_defense_desc: "To guard the long northern and western frontiers, engineers will build major supply hubs at Urumqi, Kashgar, Shigatse, northern Shaanxi and Suiyuan, linking them to the inland industrial heartland by rail. Our armies will never again suffer for want of supply on the frontier."
 CHI_third_empire_border_defense_tt: "§YBuild major supply hubs§! at Urumqi, Kashgar, Shigatse, northern Shaanxi and Suiyuan, and §Ylay new railways§! linking them to the interior."
 CHI_focus_categories_07_tt: "Upon completion, new resources will be discovered in two random states."
 CHI_third_empire_take_back_guangzhouwan_macau: "Reclaim Guangzhouwan and Macau"
 CHI_third_empire_take_back_guangzhouwan_macau_desc: "Since the late Qing, the flags of France and Portugal have flown over Guangzhouwan and Macau. Now that the Empire has risen, it is time to send a note to Paris demanding the return of both leased territories."
 CHI_third_empire_gain_indochina: "Take Over French Indochina"
 CHI_third_empire_gain_indochina_desc: "French Indochina is rich in rubber and tungsten, yet far from France and hard to defend. If the Empire takes over its defence and administration while France keeps the mining rights, both sides stand to benefit."
 CHI_third_empire_eternal_revolution: "The Eternal Chinese Revolution"
 CHI_third_empire_eternal_revolution_desc: "The revolution has not yet succeeded; comrades must strive on. Topple the old order and build a new era for China — let the flames of revolution spread across the world!"
 CHI_third_empire_reclaim_lost: "Reclaim the Lost and Bring the Wayward Home"
 CHI_third_empire_reclaim_lost_desc: "From the frozen wastes of Siberia to the Mongolian plateau, from Tannu Uriankhai to the snows of Tibet, the old tributaries of China lie sundered. We shall assert our rights to these lands — but for now, hold the sword, lest the balance of the world be broken too early."
 CHI_third_empire_new_middle_kingdom: "A New Middle Kingdom"
 CHI_third_empire_new_middle_kingdom_desc: "The old Celestial Empire has passed away; a new one shall rise from the ashes. Complete the national focus and reform the army — the corrupt warlords, driven by greed for their posts, will forge it into a tiger force. (Army attack, defence, organisation and recovery rate +10%)"
 CHI_third_empire_northern_mandate: "The Northern Mandate"
 CHI_third_empire_northern_mandate_desc: "The frozen forests of the north have always been the cradle of Chinese dynasties. Assert the northern mandate — but hold off on war for now."
 CHI_third_empire_greater_game: "The Greater Game"
 CHI_third_empire_greater_game_desc: "At the end of the Silk Road, the winds of Central Asia shift. Play the Great Game and assert the Empire's interests in the Western Regions — without resorting to arms."
 CHI_third_empire_southern_mandate: "The Southern Mandate"
 CHI_third_empire_southern_mandate_desc: "The roaring waves of the Nanyang and the jungles of Indochina await the Empire's banner. Assert the southern mandate — but hold off on war for now."
 CHI_third_empire_cradle_of_civilization: "Cradle of Civilization"
 CHI_third_empire_cradle_of_civilization_desc: "The Yellow and Yangtze rivers gave birth to the first Chinese civilisation. When all three mandates are fulfilled, the cradle shall welcome its long-lost children — granting core citizenship to the lands of the North, the Western Regions and the Nanyang."
 CHI_third_empire_import_german_designers: "Import German Designers"
 CHI_third_empire_import_german_designers_desc: "The armaments industry of the German Reich is second to none in Europe. Petition Berlin to bring in their designers and expertise, injecting fresh blood into the Empire's military-industrial complex."
 
