 mod_economy_decisions:0 "Special Policies"
 mod_special_decisions:0 "Other Decisions"
 mod_special_decisions_desc: "\n Some decisions for fun. \n"
 FRA_start_industry_categories:0 "Industrial Revival"
 FRA_start_industry_categories_desc: "Despite its long industrial tradition, France's industrial system showed signs of fatigue in the 1930s. Dispersed small businesses, outdated production techniques, frequent strikes, and political turmoil severely constrained production capacity. Steel mills were inefficient, arms factories were underutilized, and there was a lack of coordination between civilian and military production. The nation was not ready for the industrial challenges of modern war."
 FRA_the_army_rearmament_categories:0 "Army Reforms"
 FRA_the_army_rearmament_categories_desc: "\"The Somme,\" \"Verdun\"... these names are medals of honor, yet also nightmares deeply embedded in the soul of our army. The pyrrhic victory of the Great War, bought with the blood of a generation, has crippled the offensive spirit of this once 'Foremost Army in Europe.' The rigid doctrine of 'Methodical Battle' has become unquestioned dogma; the high command is steeped in conservatism and pessimism; troops are equipped with outdated arms, and their morale relies on static defense lines rather than mobile assault. The army's soul seems forever trapped in the muddy trenches of 1916..."



