 GER_unprepare_war: " §RNo War Mobilization§! "
 GER_unprepare_war_desc: "§RIf we are dragged into a world war, we will be extremely passive!!!§!\n\n"What is war? Can you eat it?""
 GER_prepare_war_1: " §RInitial War Mobilization§! "
 GER_prepare_war_1_desc: "§RIf we are dragged into a world war, we will be extremely passive!!!§!\n\n"Have you heard? Those scoundrels across the Channel already have several million troops!""
 GER_prepare_war_2: "War Mobilization"
 GER_prepare_war_2_desc: "§GWhen war breaks out, we will gain the initiative§!\n\nThe enemy's war machine has fully activated! Even household plumbing pipes can be used as cannon or rifle barrels in wartime!"
 GER_prepare_war_3: "General War Mobilization"
 GER_prepare_war_3_desc: "§GWhen war breaks out, we will gain the initiative§!\n\nAs your Führer, I have led the nation to expand our territories and economy. We will continue to grow, responding with action to those naysayers who only utter criticism and refuse to move forward with us. The radicals and dissenters hope you will abandon years of peace and prosperity at the first sound of gunfire. They lack the courage and ability to lead our homeland through this dangerous era. The rule of law is our lifeline, yet it faces unprecedented challenges. I will restore the glory of our homeland and never bow to any foreign power. The countless outstanding sons of the Imperial Armed Forces are constantly guarding the gates of our homeland, but they cannot stand alone. All who enlist today will have their criminal sentences halved. Do not believe the slander—I am not some clone!"
 GER_prepare_war_4: "Emergency War Mobilization"
 GER_prepare_war_4_desc: "§GBetter late than never§!\n\nReinforce the front lines immediately!"
