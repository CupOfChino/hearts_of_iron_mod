 ENG_train_ideas: "Marine Training in Progress"
 ENG_the_better_navy_army_ideas: "Elite Marines"
 ENG_the_better_navy_army_ideas_desc: "Our elite marines will tear open a path into the enemy's rear for our main forces."

 SOV_tank_city: "Mass Production"
 SOV_tank_city_desc: "The Ural Mountains are our arsenal!"
 sov_the_attack_ger_buff: "Vanguard Against the Allies"
 sov_the_attack_ger_buff_desc: "Unlike our allies, our nation shares an extensive border with the Allies. We will face head-on the Allies' terrifying mechanized onslaught. But we also possess vast territories, and the potential contained within such expansiveness is sufficient to support us in confronting the enemy directly."
 SOV_Great_Patriotic_War_SOV_lose_war: "§REmbarassing Defeat§!"
 SOV_Great_Patriotic_War_SOV_lose_war_desc: "§RIt's over, completely over. We gambled the future of our nation and people on victory in the Great Patriotic War, and it has all turned to nothing—reduced to rubble like the tanks in Moscow and the mountains of soldiers' corpses piled on barbed wire. We have no choice but to silently swallow this bitter fruit of shame, letting the enemy celebrate their so-called 'victory of free will.' Furthermore, we now have to deal with a chaotic domestic situation.§!"
 SOV_Great_Patriotic_War_other_lose_war: "§REmbarassing Defeat§!"
 SOV_Great_Patriotic_War_other_lose_war_desc: "§RIt's over, completely over. We gambled the future of our nation and people on victory in the war against the Soviet Union, and it has all turned to nothing—reduced to rubble like the tanks outside Moscow and the mountains of soldiers' corpses piled on barbed wire. We have no choice but to silently swallow this bitter fruit of shame, letting the Soviet Union celebrate their so-called 'victory of socialism.' Furthermore, we now have to deal with a chaotic domestic situation.§!"
 SOV_Great_Patriotic_War_level_1: "§YGreat Patriotic War Level 1 ——— Imminent Peril§!"
 SOV_Great_Patriotic_War_level_1_desc: "The motherland is burning. The enemy advances relentlessly, but the people are awakening. Every inch of land must be defended with blood!"
 SOV_Great_Patriotic_War_level_2: "§YGreat Patriotic War Level 2 ——— Ready to Die§!"
 SOV_Great_Patriotic_War_level_2_desc: "The roar of Stalingrad echoes on the front lines—we will retreat no further. Every soldier clearly knows we are fighting for our motherland!"
 SOV_Great_Patriotic_War_level_3: "§YGreat Patriotic War Level 3 ——— Strike the Enemy Hard§!"
 SOV_Great_Patriotic_War_level_3_desc: "The Red Army's strength is recovering; factories produce weapons day and night. A mechanized force is gathering."
 SOV_Great_Patriotic_War_level_4: "§YGreat Patriotic War Level 4 ——— Steel Tide§!"
 SOV_Great_Patriotic_War_level_4_desc: "Armored units sweep across the battlefield; supply lines are as solid as iron. This is the motherland's final counteroffensive."
 SOV_Great_Patriotic_War_level_5: "§RGreat Patriotic War Level 5 ——— Death Approaches§!"
 SOV_Great_Patriotic_War_level_5_desc: "§RWe are death itself—counting down the enemy's demise. \n Every fallen compatriot calls for justice; every fallen hero will be remembered.§!"
 SOV_Great_Patriotic_War_production_level_1: "§YProduction Mobilization Level: 1§!"
 SOV_Great_Patriotic_War_production_level_1_desc: "Factories begin shifting to military production; the nation enters a state of emergency. The gears of war slowly start turning."
 SOV_Great_Patriotic_War_production_level_2: "§YProduction Mobilization Level: 2§!"
 SOV_Great_Patriotic_War_production_level_2_desc: "Workers fight day and night on the assembly lines; tens of thousands of weapons and equipment are produced and sent to the front lines."
 SOV_Great_Patriotic_War_production_level_3: "§YProduction Mobilization Level: 3§!"
 SOV_Great_Patriotic_War_production_level_3_desc: "Factories in the Urals and Siberia are fully operational; the Red Army's equipment disadvantage has vanished."
 SOV_Great_Patriotic_War_production_level_4: "§YProduction Mobilization Level: 4§!"
 SOV_Great_Patriotic_War_production_level_4_desc: "The Soviet war machine is unstoppable; supplies flood the front lines like a tide."
 SOV_Great_Patriotic_War_production_level_5: "§RProduction Mobilization Level: 5§!"
 SOV_Great_Patriotic_War_production_level_5_desc: "§RThis is not production—it is the enemy's death sentence. \n The entire nation has become a vast arsenal—the enemy will perish in steel and fire.§!"
 SOV_Great_Patriotic_War_transport: "§YTransportation is Essential for the Red Army§!"
 SOV_Great_Patriotic_War_transport_desc: "Every train, every truck is a lifeline to the front. Without transportation, there is no victory."
 SOV_Great_Patriotic_War_infantry_equipment: "§YInfantry Equipment Production§!"
 SOV_Great_Patriotic_War_infantry_equipment_desc: "From Mosin-Nagants to PPSh submachine guns—our soldiers must be armed to fight to the end for the motherland."
 SOV_Great_Patriotic_War_tank_equipment: "§YMass Armor Production§!"
 SOV_Great_Patriotic_War_tank_equipment_desc: "The steel tide of T-34s is gathering; the enemy's defenses will collapse under their tracks."
 SOV_Great_Patriotic_War_air_equipment: "§YMass Aircraft Production§!"
 SOV_Great_Patriotic_War_air_equipment_desc: "The Ilyushin Design Bureau works day and night; Yak and La series fighters will tear through enemy skies."
 SOV_Great_Patriotic_War_kill_emery: "§RInvaders Will Die§!"
 SOV_Great_Patriotic_War_kill_emery_desc: "§RThey have set foot on land that is not theirs; they are destined to be buried here.§!"
 SOV_Great_Patriotic_War_breakthrough: "§YExploit Weaknesses§!"
 SOV_Great_Patriotic_War_breakthrough_desc: "The enemy is not invincible; their flanks are their weak points."
 SOV_Great_Patriotic_227_command: "§ROrder No. 227§!"
 SOV_Great_Patriotic_227_command_desc: "The enemy disregards losses, sending more and more troops to the front, penetrating deep into Soviet territory, seizing new areas, destroying and plundering our cities and villages, raping, murdering, and robbing the Soviet people. \nThe people of our country once loved and respected the Red Army, but now they are beginning to lose faith in the Red Army, feeling disappointed. Many people curse the Red Army for retreating eastward, abandoning our people to German enslavement. \nSome foolish people argue that we can continue retreating eastward because we still have vast territories, abundant land, a large population, and always sufficient grain. These people are comforting themselves. They use such reasoning to justify their disgraceful actions and retreats. But these reasons are nothing but outright deception, false and only helpful to our enemies. \nAll commanders, Red Army soldiers, and political commissars must understand that our resources are not endless. Soviet territory is not a barren wilderness; it is home to people—workers, peasants, intellectuals, parents, wives, brothers, and children. The Soviet territories already occupied by the fascists, and those the fascists plan to occupy, provide grain and other resources for our army and people, such as oil and steel for industry, factories producing weapons and ammunition for our military, and railways we need. We have already lost our manpower and material supply advantages relative to the Nazis. If we continue to retreat, it means we will destroy ourselves and our motherland. Every piece of territory we abandon will strengthen the fascists, weaken ourselves, weaken our defenses, and weaken our motherland. \nWe must conclude: §RIt is time to stop retreating. Retreat ends here, not one step further!§! From now on, this is our slogan. We must stubbornly defend every position, protect every inch of Soviet territory until the last drop of blood. We must seize every piece of land and guard it with all our might. The motherland is in a difficult period. We must stop the enemy, repel them, and destroy them at all costs. The Germans are not as strong as the panic-mongers claim; they have reached their limit. If we can withstand the enemy's current assault, we will surely achieve victory in the future."
 SOV_Great_Patriotic_guerilla: "§YGuerrillas Are Glorious§!"
 SOV_Great_Patriotic_guerilla_desc: "Burning the flames of hatred behind enemy lines, they are the shadow warriors of the motherland, the beginning of the enemy's nightmare."
 SOV_Great_Patriotic_armor_breakthrough: "§YArmor Clusters§!"
 SOV_Great_Patriotic_armor_breakthrough_desc: "Our elite forces will assemble to completely crush the enemy's offensive spearhead."
 Attack_SOV_plan_1: "§YPhase One Offensive Plan ——— Blitzkrieg§!"
 Attack_SOV_plan_1_desc: "Our forces will move at maximum speed to capture the line of §YMinsk—Kyiv—Odesa§!, thus opening the gateway to the Soviet heartland."
 Attack_SOV_plan_2: "§YPhase Two Offensive Plan ——— Full-Scale Assault§!"
 Attack_SOV_plan_2_desc: "The Soviet heartland's gateway is open; we will seize the line of §YLeningrad—Moscow—Stalingrad§! to completely crush the Soviet Union's war potential."
 Attack_SOV_plan_3: "§YPhase Three Offensive Plan ——— End It All§!"
 Attack_SOV_plan_3_desc: "The Soviet heartland is in our hands; the enemy can only retreat to the line of §YUral Mountains§!. This time, we will completely end the Soviet Union."
 SOV_never_give_up: "§RThe Soviet Union Never Surrenders!§!"
