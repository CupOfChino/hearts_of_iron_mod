 NIGHTMARE_air_buff: "Purgatory Air Force"
 NIGHTMARE_air_buff_desc: "A nightmare-grade air force enhancement: aircraft stats greatly increased, mission efficiency and ace generation boosted. Planes are stronger but not unlimited - spawning stops at the aircraft cap."
 NIGHTMARE_air_quality_buff: "Purgatory Air Force - Quality"
 NIGHTMARE_air_quality_buff_desc: "Quality mode exclusive: AI aircraft cost about +50% (+10 IC) but all combat stats are greatly increased (+4 to each stat)."
 NIGHTMARE_air_general: "Purgatory Air Force - General"
 NIGHTMARE_air_general_desc: "AI-only nightmare air enhancement: all air-related modifiers +15% (range, max speed, power projection, home defence, army air-superiority bonus, ace generation, mission/training XP, mission efficiency, air superiority efficiency, interception efficiency, escort efficiency, strategic bombing, air XP gain), while accidents, wing XP loss, fuel consumption, doctrine cost, manufacturer and air chief cost, weather/night penalties and airborne preparation are reduced by 15%. Agility, air attack/defence, ground attack, ground support and naval-related stats are unaffected. Automatically removed if acquired by a human player."
 FIN_third_empire_neutrality: "Finnish Neutrality Commitment"
 FIN_third_empire_neutrality_desc: "To prevent Finland from joining a faction at high world tension and triggering an early Soviet invasion, Finland pledges strict neutrality in the Three Emperors timeline: it cannot join or create any faction. Automatically lifted if controlled by a human player."
