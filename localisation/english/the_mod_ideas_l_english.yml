 GER_Absolute_hegemony_in_Europe: "§RAbsolute Hegemony in Europe§!"
 GER_Absolute_hegemony_in_Europe_desc: "Today, the entire European continent is largely under the control of our alliance. No other nation in the world can rival our alliance on land."
 GER_help_china: "East Asian Expeditionary Force"
