l_simp_chinese:
 postwar_order_categories: "战后秩序"
 postwar_order_categories_desc: "战火虽熄，旧盟已碎。昔日的战友如今各怀鬼胎——是时候清算旧账，让世界见识谁才是真正的霸主了。"
 postwar_declare_war_on_former_allies: "清算旧盟"
 postwar_declare_war_on_former_allies_desc: "备战已经完成。向所有曾经的盟友宣战，第三次世界大战的帷幕就此拉开！"
 postwar.1.t: "同盟的分裂"
 postwar.1.d: "胜利的果实还未品尝，裂痕已然显现。德皇威廉二世、拿破仑四世与奥托大公在战争结束时各怀心思——旧日的盟约，已无法约束三个帝国的野心。是时候各奔东西，独自称霸世界了。"
 postwar.1.a: "主动拥抱新时代！"
 postwar.1.a_tt: "§Y选择后，我方将退出旧同盟，独自建立新的阵营，踏上霸业之路！§!"
 postwar.2.t: "协约的分裂"
 postwar.2.d: "胜利的欢呼尚未平息，昔日的盟友已开始互相猜忌。伦敦、华盛顿、莫斯科与东京的利益分歧越来越大——自由世界的联盟，终究敌不过各自的霸权野心。"
 postwar.2.a: "主动拥抱新时代！"
 postwar.2.a_tt: "§Y选择后，我方将退出旧同盟，独自建立新的阵营，踏上霸业之路！§!"
 postwar.3.t: "清算旧盟"
 postwar.3.d: "三十年的备战，只为这一刻。昔日的盟友如今各怀鬼胎——是时候宣战，让世界见证谁才是真正的霸主！"
 postwar.3.a: "宣战旧盟友，成为世界霸主！"
 postwar.4.t: "三皇同盟的分裂——各霸一方"
 postwar.4.d: "旧日的盟约已经彻底破碎。德皇威廉二世建立凯撒集团，拿破仑四世组建大陆体系，奥托大公重建哈布斯堡同盟，中华民国亦宣告天朝上国成立。世界迎来群雄并起的时代。"
 postwar.4.a: "各霸一方，问鼎世界！"
 postwar.5.t: "协约国的分裂——各霸一方"
 postwar.5.d: "胜利的盟约已成往事。英国宣告日不落永续，美国领导自由国家联盟，苏联重建共产国际，日本则高举大东亚共荣的旗帜。新的世界格局就此拉开帷幕。"
 postwar.5.a: "各霸一方，问鼎世界！"
 postwar_core_flag: "§Y战后核心国家§!"
 postwar_former_ally_flag: "§R昔日盟友§!"
