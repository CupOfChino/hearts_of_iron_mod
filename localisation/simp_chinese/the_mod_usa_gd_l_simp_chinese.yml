l_simp_chinese:
 USA_great_depression_categories: "大萧条危机"
 USA_great_depression_categories_desc: "1929年的大萧条仍笼罩着美利坚。罗斯福总统的新政正在铺开，但经济的伤口远未愈合——每一项措施都在为这个国家的复苏争取时间。"

 USA_gd_deterrent_mission: "大萧条威慑降低"
 USA_gd_deterrent_mission_desc: "经济危机仍在持续。维持现有政策、稳住市场信心，一年之后大萧条的影响将有所缓和。\n\n（自动进行为期365天的治理周期，周期结束时大萧条等级下降一级）"
 USA_gd_work_relief: "以工代赈"
 USA_gd_work_relief_desc: "组织失业者参与公共工程，以劳动换取生计，为萧条中的经济注入活力。"
 USA_gd_public_works_mission: "国家项目建设中"
 USA_gd_public_works_mission_desc: "公共项目正在各地铺开，工人们热火朝天地忙碌着……"
 USA_gd_reject_new_deal: "否定罗斯福新政"
 USA_gd_reject_new_deal_desc: "总统不是罗斯福——新政府决定抛弃新政路线。通过激进手段强行压制危机，或许能立刻消除一层大萧条，但后续的影响将难以快速化解。"
 USA_gd_emergency_banking: "紧急银行法"
 USA_gd_emergency_banking_desc: "宣布银行休业整顿，恢复公众对金融体系的信心。"
 USA_gd_agricultural_adjustment: "农业调整法案"
 USA_gd_agricultural_adjustment_desc: "通过限制产量、补贴农户来稳定农产品价格，缓解农业危机。"
 USA_gd_national_recovery: "全国工业复兴法"
 USA_gd_national_recovery_desc: "制定公平竞争规则，推动工业复兴，让工厂重新转动起来。"
 USA_gd_wpa: "公共事业振兴署"
 USA_gd_wpa_desc: "大规模雇佣失业者进行基础设施建设，把救济变为工作。"
 USA_gd_tva: "田纳西河谷工程"
 USA_gd_tva_desc: "在田纳西河谷开展大型水利工程，为田纳西与阿拉巴马的两处地块修建一级大坝与基础设施。\n\n（点击后占用15座民用工厂180天）"
 USA_gd_research_boost: "暂时科研激励"
 USA_gd_research_boost_desc: "拨出专款鼓励科研机构与企业研发，为未来积蓄技术力量。"
 USA_gd_nya: "全国青年署"
 USA_gd_nya_desc: "为青年提供工作与培训机会，避免一代人迷失在失业之中。"
 USA_gd_rearmament_orders: "军工采购订单"
 USA_gd_rearmament_orders_desc: "向军工企业下达订单，以政府需求拉动工业生产。\n\n（点击后启动为期90天的军工采购任务）"

 USA_the_third_empire_categories_07: "军工复合体"
 USA_the_third_empire_categories_07_desc: "战争阴云密布，我们向军工企业下达大量订单。军火生产将带动整个工业体系运转，让美国成为真正的兵工厂。"

 change_usa.20.t: "大萧条影响下降"
 change_usa.20.d: "经过又一年坚持不懈的治理，经济最黑暗的时刻正在过去。虽然危机尚未彻底结束，但情况正在好转。"
 change_usa.20.a: "继续前进"
 change_usa.21.t: "大萧条危机结束"
 change_usa.21.d: "经济指标全面回暖，失业率回落，工厂重新开足马力——大萧条，终于结束了。"
 change_usa.21.a: "美利坚的复苏！"
 change_usa.22.t: "罗斯福新政落地实施"
 change_usa.22.d: "罗斯福总统的新政方案开始全面实施：银行改革、以工代赈、农业与工业复兴……新政，正在改变这个国家。"
 change_usa.22.a: "开始实施新政"
 change_usa.23.t: "公共项目建设完毕"
 change_usa.23.d: "一项公共工程在各地顺利完工，新的基础设施为经济复苏添砖加瓦。"
 change_usa.23.a: "干得漂亮"

 USA_new_deal_underway_flag: "罗斯福新政正在实施"
 USA_gd_mississippi_valley: "密西西比河谷工程"
 USA_gd_mississippi_valley_desc: "在密西西比河谷开展大型水利工程，为密西西比与路易斯安那的两处地块修建一级大坝与基础设施。\n\n（点击后占用15座民用工厂180天）"
 USA_gd_rearmament_mission: "军工采购中"
 USA_gd_rearmament_mission_desc: "军工订单正在生产线上流转，工厂全力开工……"

 USA_military_industrial_complex: "军工复合体"
 USA_military_industrial_complex_desc: "军火订单源源不断，军工企业与五角大楼形成了紧密的利益共同体，工业机器全力运转。"
 USA_gd_work_relief_effect_tt: "启动为期30天的'国家项目建设中'任务。任务完成后：为随机一个基建不足5级的美国核心州添加1级基础设施，'大萧条威慑降低'倒计时减少30天。"
 USA_gd_reject_new_deal_effect_tt: "'大萧条威慑降低'倒计时减少270天（几乎立刻消除一层大萧条），但移除'罗斯福新政正在实施'，并失去所有新政决议。"
 USA_gd_emergency_banking_effect_tt: "稳定度+5%、政治点数+50，'大萧条威慑降低'倒计时减少10天。"
 USA_gd_agricultural_adjustment_effect_tt: "进行90天（期间消费品−5%）。完成后：稳定度+2%，'大萧条威慑降低'倒计时减少10天。"
 USA_gd_national_recovery_effect_tt: "进行120天（期间民用厂建造速度+10%、生产效率提升+10%）。完成后：稳定度+2%，'大萧条威慑降低'倒计时减少15天。"
 USA_gd_wpa_effect_tt: "进行90天（期间建筑建造速度+15%）。完成后：稳定度+2%、战争支持+2%，'大萧条威慑降低'倒计时减少10天。"
 USA_gd_tva_effect_tt: "进行180天（期间占用15座民用工厂）。完成后：为田纳西与阿拉巴马的两处地块各添加1级大坝与基础设施。"
 USA_gd_mississippi_valley_effect_tt: "进行180天（期间占用15座民用工厂）。完成后：为密西西比与路易斯安那的两处地块各添加1级大坝与基础设施。"
 USA_gd_research_boost_effect_tt: "进行120天（期间科研速度+15%）。完成后：'大萧条威慑降低'倒计时减少5天。"
 USA_gd_nya_effect_tt: "进行60天（期间适役人口+5%）。完成后：人力+1000，'大萧条威慑降低'倒计时减少5天。"
 USA_gd_rearmament_orders_effect_tt: "启动为期90天的'军工采购中'任务。任务完成后：获得2座军工厂、陆海空经验各+15，'大萧条威慑降低'倒计时减少5天。"
 change_usa.24.t: "田纳西河谷工程完工"
 change_usa.24.d: "田纳西河谷的拦河大坝与配套基础设施已经落成，电力和灌溉将带动整个地区的复苏。"
 change_usa.24.a: "大坝落成！"
 change_usa.25.t: "密西西比河谷工程完工"
 change_usa.25.d: "密西西比河谷的拦河大坝与配套基础设施已经落成，洪涝得到控制，航运与电力翻开了新篇章。"
 change_usa.25.a: "大坝落成！"
 USA_gd_public_works_flag: "国家项目建设中"
 USA_gd_rearmament_flag: "军工采购中"

 USA_american_industry_dynamic_modifier: "美国工业"
 USA_american_industry_dynamic_modifier_desc: "美国的工业产能随大萧条起落。从熄火的烟囱到轰鸣的流水线，美利坚工厂的命运，正是这个国家艰难爬回繁荣的缩影。"

 change_usa.26.t: "美国工业状况更新"
 change_usa.26.d: "大萧条进入新的阶段，美国工业产能随之调整。烟囱重新升起炊烟，流水线缓缓加速运转。"
 change_usa.26.a: "工业随之调整"
