 SOV_tank_city: "大批量生产"
 SOV_tank_city_desc: "乌拉尔山脉就是我们的兵工厂！"
 sov_the_attack_ger_buff: "对抗同盟国的先锋"
 sov_the_attack_ger_buff_desc: "与我们的盟友不同，我国与同盟国有着极为庞大的接壤，我们将会正面应对同盟国恐怖的钢铁洪流。但我们也有广阔的土地，如此辽阔的土地所蕴含的潜力足以支持我们正面迎敌。"
 SOV_Great_Patriotic_War_SOV_lose_war: "§R丢人现眼§!"
 SOV_Great_Patriotic_War_SOV_lose_war_desc: "§R完了，全完了。我们将国家和民族的前途赌在了卫国战争的胜利上，而这一切都已随莫斯科城内坦克的残骸和铁丝网上堆积如山的士兵尸体化为了泡影。我们别无他法，只能静静吞下这耻辱的苦果，让敌人自顾自地庆祝所谓“自由意志”的胜利。而且，我们现在还要处理一团乱麻的国内局势。§!"
 SOV_Great_Patriotic_War_other_lose_war: "§R丢人现眼§!"
 SOV_Great_Patriotic_War_other_lose_war_desc: "§R完了，全完了。我们将国家和民族的前途赌在了对苏战争的胜利上，而这一切都已随莫斯科城外坦克的残骸和铁丝网上堆积如山的士兵尸体化为了泡影。我们别无他法，只能静静吞下这耻辱的苦果，让苏联自顾自地庆祝所谓“社会主义”的胜利。而且，我们现在还要处理一团乱麻的国内局势。§!"
 SOV_Great_Patriotic_War_level_1: "§Y卫国战争等级1————危在旦夕§!"
 SOV_Great_Patriotic_War_level_1_desc: "祖国正在燃烧。敌人步步紧逼，但人民开始觉醒，每一寸土地都必须用鲜血捍卫！"
 SOV_Great_Patriotic_War_level_2: "§Y卫国战争等级2————视死如归§!"
 SOV_Great_Patriotic_War_level_2_desc: "斯大林格勒的怒吼回荡在前线——我们不再后退。每一名士兵都清楚的知道我们是在为祖国而战！"
 SOV_Great_Patriotic_War_level_3: "§Y卫国战争等级3————重锤击敌§!"
 SOV_Great_Patriotic_War_level_3_desc: "红军的力量正在恢复，工厂昼夜不停地生产武器。钢铁洪流正在汇集。"
 SOV_Great_Patriotic_War_level_4: "§Y卫国战争等级4————钢铁洪流§!"
 SOV_Great_Patriotic_War_level_4_desc: "装甲部队席卷战场，补给线稳固如铁。这是伟大祖国的最终反攻时刻。"
 SOV_Great_Patriotic_War_level_5: "§R卫国战争等级5————死神降临§!"
 SOV_Great_Patriotic_War_level_5_desc: "§R我们即是死神————为敌人的死亡进行倒计时 \n 每一个死去的同胞都在呼唤正义，所有牺牲的勇士也都将被铭记。§!"
 SOV_Great_Patriotic_War_production_level_1: "§Y生产动员等级：1§!"
 SOV_Great_Patriotic_War_production_level_1_desc: "工厂开始转向军需生产，全国进入紧急状态。战争的齿轮缓缓转动。"
 SOV_Great_Patriotic_War_production_level_2: "§Y生产动员等级：2§!"
 SOV_Great_Patriotic_War_production_level_2_desc: "工人们日夜奋战在流水线前，数以万计的武器装备从这里生产出来并运往前线。"
 SOV_Great_Patriotic_War_production_level_3: "§Y生产动员等级：3§!"
 SOV_Great_Patriotic_War_production_level_3_desc: "乌拉尔和西伯利亚的工厂全面开动，红军的装备劣势已然消失。"
 SOV_Great_Patriotic_War_production_level_4: "§Y生产动员等级：4§!"
 SOV_Great_Patriotic_War_production_level_4_desc: "苏联的战争机器已不可阻挡，物资如洪水般涌向前线。"
 SOV_Great_Patriotic_War_production_level_5: "§R生产动员等级：5§!"
 SOV_Great_Patriotic_War_production_level_5_desc: "§R这不是生产，这是对敌人的宣判。\n 整个国家已化作一座巨大的兵工厂——敌人将在钢铁与火焰中灭亡。§!"
 SOV_Great_Patriotic_War_transport: "§Y运输对红军必不可少§!"
 SOV_Great_Patriotic_War_transport_desc: "每一列火车、每一辆卡车都是前线的生命线。没有运输，就没有胜利。"
 SOV_Great_Patriotic_War_infantry_equipment: "§Y步兵装备生产§!"
 SOV_Great_Patriotic_War_infantry_equipment_desc: "从莫辛纳甘到PPSh冲锋枪——我们的士兵必须武装起来，为了祖国而战到底。"
 SOV_Great_Patriotic_War_tank_equipment: "§Y装甲批量生产§!"
 SOV_Great_Patriotic_War_tank_equipment_desc: "T-34的钢铁洪流正在汇聚，敌人的防线将在履带下崩溃。"
 SOV_Great_Patriotic_War_air_equipment: "§Y战机批量生产§!"
 SOV_Great_Patriotic_War_air_equipment_desc: "伊柳申设计局日夜赶工，雅克与拉系列战机将撕裂敌人的天空。"
 SOV_Great_Patriotic_War_kill_emery: "§R入侵者必死§!"
 SOV_Great_Patriotic_War_kill_emery_desc: "§R他们踏上了不属于他们的土地，就注定要埋骨于此。§!"
 SOV_Great_Patriotic_War_breakthrough: "§Y弱点突破§!"
 SOV_Great_Patriotic_War_breakthrough_desc: "敌人并非不可战胜，尖锐的矛头两翼便是他们的薄弱点。"
 SOV_Great_Patriotic_227_command: "§R227号命令§!"
 SOV_Great_Patriotic_227_command_desc: "敌人全然不顾损失，向前线增派越来越多的兵力，已经深入到了苏联境内，占领了新的地区，摧毁、掠夺我们的城市和村庄，他们强奸、谋杀、劫掠苏联人民。\n我们国家的人民曾经是热爱、尊敬红军的，但他们现在开始对红军感到失望，开始失去了对红军的信心。很多人诅咒红军向东逃跑，把我们的人民遗弃在德国的奴役下。\n一些愚蠢的人争辩说，我们可以继续向东撤退，因为我们还有广大的领土、大量的土地、众多的人口，并且我们总是有充沛的粮食。这些人是在自我安慰。他们试图用这样的理由为自己不体面的行为和撤退开脱。但是，这些理由是彻头彻尾的欺骗，是虚假的，只能帮助我们的敌人。\n所有指挥员、红军战士、政治委员必须理解到我们的资源不是无穷无尽的。苏联国土不是荒原一片，上面生活着人民——有工人、农民、知识分子、父母、妻子、兄弟、孩子。那些已经被法西斯占领的苏联领土，以及那些法西斯正计划着要去占领的苏联领土，能为我们的军队和人民提供粮食和其他资源，比如工业所需的石油、钢铁、为军队提供武器弹药的工厂、我们需要的铁路。我们已经失去相对纳粹而言的人力资源优势和物资供应优势。如果我们继续撤退，就意味着我们将摧毁自己，也将摧毁我们的祖国。我们放弃的每一片领土，都将增强法西斯的力量，削弱我们自己，削弱我们的防御能力，削弱我们的祖国。\n我们必须做出一个结论: §R是停止撤退的时候了。撤退到此，一步也不能撤！§! 从现在起，这就是我们的口号。有必须顽强地保护每一个据点，保卫苏联的每一寸领土，直到流尽最后一滴鲜血。我们必须抓住我们的每一块土地，尽最大努力加以守护。祖国正处于困难时期。我们必须阻止敌人、击退敌人、消灭敌人，我们要不惜一切代价。德国人并非像恐慌制造者们说的那样强大，他们已经达到自己的极限。如果我们能抵挡住敌军目前的打击，我们肯定能获得未来的胜利。"
 SOV_Great_Patriotic_guerilla: "§Y游击队无上光荣§!"
 SOV_Great_Patriotic_guerilla_desc: "在敌后燃烧仇恨的火焰，他们是祖国的影子战士，是敌人噩梦的开始"
 SOV_Great_Patriotic_armor_breakthrough: "§Y装甲集群§!"
 SOV_Great_Patriotic_armor_breakthrough_desc: "我们的精锐将会集结，彻底挫败敌人的进攻锋芒。"
 Attack_SOV_plan_1: "§Y第一阶段进攻计划————闪电战§!"
 Attack_SOV_plan_1_desc: "我们的军队将以最快的速度夺取§Y明斯克————基辅————敖德萨§!一线，以此来打开进入苏联核心区的门户"
 Attack_SOV_plan_2: "§Y第二阶段进攻计划————全面进攻§!"
 Attack_SOV_plan_2_desc: "苏联核心区已经门户打开，我们将夺取§Y列宁格勒————莫斯科————斯大林格勒§!一线，彻底扼杀苏联的战争潜力"
 Attack_SOV_plan_3: "§Y第三阶段进攻计划————终结一切§!"
 Attack_SOV_plan_3_desc: "苏联核心区落入我们手中，敌人只能退守§Y乌拉尔山脉§!一线。这一次，我们将彻底终结苏联"
 SOV_never_give_up: "§R苏维埃永远在抵抗！§!"
 SOV_never_give_up_desc: "“诸位弟兄，随我接战！战至最后一刻！自刎归天！” \n\n§R当英国或者美国停止抵抗后，该民族精神将被移除§!"
 SOV_defend_china: "远东防御"
 SOV_defend_china_desc: "在中国加入德国阵营后，我们远东地区的国防压力愈发严重。我们的主力部队需要在欧洲正面迎击德国，所以我们必须注重远东的防御设施建设。"
 JAP_revenge_china: "§R复仇主义蔓延§!"
 JAP_revenge_china_desc: "在中国折戟后，帝国失去了所有的一直以来通过奋斗获得的东亚领地。总有一天，我们会再回来的！"

 


