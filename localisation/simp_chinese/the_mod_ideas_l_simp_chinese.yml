 PRC_Annexation_of_weak_neighbors: "兼并弱邻"
 PRC_Pla: "中国人民解放军"
 PRC_Pla_desc: "人民的武装"
 PRC_commusic: "中共支持日共活动"
 PRC_commusic_desc: "红色幽灵又来到了我们身边。如果我们能将红色支持率削减至5%以下，那么中共在怎么干涉也难以掀起波澜；如果我们让红色支持率高于50%，那么红色恶魔将在中共的支持下冲击我们的政权。"

