 GER_prepare_war_2: "战争动员"
 GER_prepare_war_2_desc: "§G当陷入战争时，我们将获得主动权§!\n\n“敌人的战争机器已经全面开动！即使是家用的下水管管道，在战时也可以用作大炮、枪械的炮管枪管！”"
 GER_prepare_war_3: "战争总动员"
 GER_prepare_war_3_desc: "§G当陷入战争时，我们将获得主动权§!\n\n“身为你们的元首，我带领国家实现了统治领地和经济的扩张。我们将继续成长,用行动回击那些只会说风凉话，不愿意和我们相向而行的害群之马。激进分子和异见者希望你们一听见枪声就背弃多年的和平与繁荣。他们没有勇气和能力带领祖国穿越一个充满危险的时代。法治是我们的命脉，然而它却受到前所未有的挑战。我将恢复我们祖国的荣光，绝不会向任何境外势力低头。帝国武装力量无数的优秀儿女正时刻守卫看我们的家园大门，但是他们孤木难支。凡是今天应征入伍者，所获的所有刑罚罪责减半。不要听信谗言，我不是什么克隆人！”"
 GER_prepare_war_4: "紧急战争动员"
