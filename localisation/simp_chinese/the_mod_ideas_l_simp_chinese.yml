 mod_with_fra_the_five_plan: "法国工业"
 mod_with_fra_the_five_plan_desc: "尽管拥有悠久的工业传统，法国的工业体系在20世纪30年代已显疲态。分散的小企业、落后的生产技术、频繁的罢工与政治动荡严重制约了产能。钢铁厂效率低下，军工厂产能未被充分动员，民用与军用生产之间缺乏协调。\n但在经过深刻的工业改革与国家动员，法国的工业潜力将会被重新唤醒。工厂将实现现代化，生产效率将大幅提升，军民产业也将协调有序。曾经分散而低效的工业体系，将为共和国的防御与复兴提供坚实支撑。 "
 mod_with_the_fra_army: "法兰西军队"
 mod_with_the_fra_army_desc: "“索姆河”、“凡尔登”。。。这些名字是荣誉的勋章，亦是深植于军队灵魂的梦魇。第一次世界大战的惨烈胜利，以一代人的鲜血为代价，彻底摧残了这支“欧陆第一陆军”的进取之心。僵化的“步步为营”战术学说成为金科玉律，高级指挥层充斥着保守与悲观情绪，部队装备陈旧，士气依赖于静态的防线而非机动的进攻。军队的灵魂，仿佛仍被困在1916年那泥泞的战壕里。\n固步自封只会带来灭亡！惨痛的教训教会了我们坚韧，而非怯懦。一战的教训将化为谨慎与坚韧的基石，我们会将其变为警醒与力量的源泉！通过彻底的学说革新与指挥体系重组，我们会将一战的经验融会贯通，凡尔登的遗产，最终将铸就一支更为审慎、坚韧且致命的武装力量！"
 mod_with_fra_air: "法兰西空军"
 mod_with_fra_air_desc: "作为欧洲最早的空中力量之一，法兰西空军承载着悠久的航空传统与荣耀。尽管面临装备更新与战术革新的挑战，这支空中力量依然保持着专业素养与战斗精神。通过现代化的飞行员训练体系、先进的航空技术引进以及战术理论的创新，法兰西空军正逐步重塑其空中作战能力。在未来战场上，这支焕然一新的空中力量将承担起保卫领空、支援地面作战的战略使命，为共和国的国防安全提供坚实的空中屏障。"
 mod_with_fra_navy: "法兰西海军"
 mod_with_fra_navy_desc: "拥有数个世纪航海传统的法兰西海军，曾经是世界上最强大的海上力量之一。面对新时代的海上挑战，这支海军正在进行深刻的现代化转型。通过更新舰艇装备、优化舰队结构、提升远洋作战能力，法兰西海军致力于重建其蓝水海军地位。均衡的水面舰艇、水下力量与海军航空兵的协同发展，将确保这支海军能够有效维护法国的海外利益、保卫海上交通线，并在必要时向远海投射国家力量。"


 mod_with_eng_army: "英国皇家陆军"
 mod_with_eng_army_desc: "英国皇家陆军以其严谨的纪律体系和专业的军官团而著称。这支军队拥有丰富的海外部署经验，能够适应各种战场环境，为维护英国在全球的利益提供可靠的地面力量保障。"
 mod_with_usa_army: "美国陆军"
 mod_with_usa_army_desc: "美国陆军建立在强大的工业基础之上，注重现代化装备和后勤体系建设。其灵活的作战思想和规模化的兵力投送能力，使其能够有效执行跨区域的军事任务。"
 mod_with_eng_air: "英国皇家空军"
 mod_with_eng_air_desc: "英国皇家空军保持着高度的战备水平和优秀的飞行员训练体系。其在防空作战和战术支援方面具有丰富经验，能够有效保卫领空并为地面部队提供可靠的空中支援。"
 mod_with_usa_air: "美国空军"
 mod_with_usa_air_desc: "美国空军拥有显著的数量优势和先进的技术装备。其战略投送能力和多任务执行效能，确保了在各类军事行动中都能保持空中优势。"
 mod_with_eng_navy: "英国皇家海军"
 mod_with_eng_navy_desc: "英国皇家海军具有悠久的海上传统和丰富的远洋作战经验。其均衡的舰队结构和全球部署能力，使其能够有效维护海上交通线和投射国家力量。"
 mod_with_usa_navy: "美国海军"
 mod_with_usa_navy_desc: "美国海军以其庞大的舰队规模和先进的舰艇设计而闻名。强大的造舰能力和完善的基地网络，支撑着其在全球范围内的海军力量存在和行动能力。"


