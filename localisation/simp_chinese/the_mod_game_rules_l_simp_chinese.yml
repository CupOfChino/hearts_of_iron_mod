 the_eastern_desc:0 "东亚势力不会受到任何强化，保持原版一致，谁笑到最后全看天意"
 the_eastern_prc_t:0 "人民解放阵线"
 the_eastern_prc_desc:0 "中共将获得极大幅度的强化并组建人民解放阵线来保证能打赢解放战争。在取得解放战争胜利之后，如果拉丁同盟存在，将会与其组建民族解放阵线。当处理完国内事务之后，将会在未来进行一场打倒帝国主义战争、解放全世界的战争"
 the_eastern_chi_t:0 "三民主义"
 the_eastern_chi_desc:0 "国民政府将获得大幅强化来确保打赢中日战争。由于老蒋换了个脑子，一心为国为民，中共将领会选择加入国民政府为国效力。在取得中日战争的胜利之后，将会尝试向东南亚扩张，如果某一方阵营更加支持中国，那么就会有更大几率在大战中加入某一方"
 the_eastern_man_t:0 "(鸽了，选了没用)清窃宗归位（需要满洲国走自立）"
 the_eastern_man_desc:0 "(鸽了，选了没用)（需要满洲国走自立）大清将获得大幅度强化并取得独立，统一中国，并且反向殖民立本。在统一后，会尝试北伐并收回曾经的版图"
 the_eastern_jap_t:0 "大东亚共荣圈"
 the_eastern_jap_desc:0 "立本成功并整合了东亚，随后会朝着东南亚和美洲扩张"
 the_eastern_random_t:0 "东亚吃鸡赛"
 the_eastern_random_desc:0 "所有强化同时启动，东亚将变成完完全全的大混战，因为测试不够，可能会有大量bug，不建议开启。只适用于看海玩玩"

