 the_LatinAmerica_t:0 "拉丁同盟（需要墨西哥走红）"
 the_LatinAmerica_desc:0 "（需要墨西哥走红）墨西哥将会成为社会主义国家，与其他拉丁美洲的国家合并，成立拉丁同盟，并在未来将革命的火种带向全世界。如果东亚选择了人民解放阵线，那么二者会联合组建民族解放阵线为解放全世界而奋斗"

