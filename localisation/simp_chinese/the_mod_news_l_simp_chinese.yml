 change_news.1:0 "三皇同盟"
 change_news.1.t:0 "三皇同盟"
 change_news.1.d:0 "近日，德国、法国、奥匈三国皇帝正式签署《三皇同盟》。至此，欧洲大陆上的实力对比已经出现严重的倾斜。英国政府称此举为“荼毒世界的恶魔”，并宣称将组建新的军事同盟遏制其扩张。"
 change_news.1.a:0 "且看英国人的应对吧。"
 change_news.1.b:0 "这是赤裸裸的挑衅！"
 change_news.1.c:0 "伟大的计划！"

 change_news.2:0 "三国协约"
 change_news.2.t:0 "三国协约"
 change_news.2.d:0 "英国、苏联、美国三国发表联合声明，正式组建《三国协约》。协约国成员有义务保护其他国家不受同盟国的攻击，并且当协约国成员或潜在成员受到同盟国进攻时将视为对全体协约国成员宣战。英国政府发言人称“这是为了维护世界的安全。协约国欢迎所有担心受到同盟国攻击的国家加入。”\n毫无疑问，这对三皇同盟来说并不是个好消息。"
 change_news.2.a:0 "一场世界大战已经拉开了帷幕"
 change_news.2.b:0 "只有团结起来、放下恩怨，才能与他们抗衡"
 change_news.2.c:0 "不过是走投无路的老鼠抱团取暖罢了"

 change_news.3:0 "巴尔干战争"
 change_news.3.t:0 "巴尔干战火再起"
 change_news.3.d:0 "烽烟再起，奥匈帝国浴火重生，与保加利亚从不同方向对巴尔干国家发起进攻，誓要夺回在上一次大战中失去的故土。\n尽管武器落后、装备匮乏，甚至部队还未来全部准备完毕。但面对来势汹汹的入侵者，依然选择战斗到底，以鲜血捍卫自己的领土。\n 究竟是从地狱归来的复仇者手刃仇敌，还是无畏的战士痛击入侵者呢？让我们拭目以待。"
 change_news.3.a:0 "这会是另一场大战的预告吗？"
 change_news.3.b:0 "我们必将凯旋!"
 change_news.3.c:0 "收复故土!"

 change_news.4:0 "大英帝国"
 change_news.4.t:0 "大英帝国建立"
 change_news.4.d:0 "英国政府昨日发表声明：在国际局势日益严峻的当下，英联邦内部达成共识，即组建一个强大的联合政府确保自身的安全。尽管英国政府声称此举动并没有针对任何国家。"
 change_news.4.a:0 "一个超级大国崛起了"
 change_news.4.b:0 "日不落"
 
 change_news.5:0 "英国保障意大利"
 change_news.5.t:0 "英意同盟"
 change_news.5.d:0 "英国政府和意大利政府于今日发表共同声明：意大利和英国将结成友邦，双方将在多个领域内展开合作，并互相保障国防安全。意大利方面称此举为维护和平的重要举措。德国方面则称此举危害了同盟国的利益，威胁到了德国盟友的安全，并声称这将是点燃炸药桶的一颗火星"
 change_news.5.a:0 "我们将密切关注事态的发展"
 change_news.5.b:0 "德国肯定不会善罢甘休"
 change_news.5.c:0 "来吧，好戏开场了"

 change_news.6:0 "世界大战"
 change_news.6.t:0 "第二次世界大战"
 change_news.6.d:0 "“三皇同盟”和“三国协约”之间的对抗最终还是演变成了战争，双方几乎同时宣布进行战争总动员。在苍穹之上，无数的“翼骑兵”在进行着厮杀；在辽阔的东欧平原中，巨人的铁拳在激烈的碰撞；广袤的大洋里，恐怖的钢铁巨兽在互相撕扯。一场血腥而残忍的演出，正式开始。"
 change_news.6.a:0 "生灵涂炭......为逝者默哀"
 change_news.6.b:0 "噩梦的复仇者归来!"
 change_news.6.c:0 "我们必将凯旋!"

 change_news.7:0 "丹麦妥协"
 change_news.7.t:0 "丹麦向德意志帝国妥协"
 change_news.7.d:0 "德意志皇帝于今日宣布丹麦正式“自愿”加入德意志帝国。这就意味着德国在北欧的影响力将会进一步扩大，英国是绝对不会让德国完全控制北欧的。可以预见，双方将在北欧展开博弈了。"
 change_news.7.a:0 "火药味越来越浓了"
 change_news.7.b:0 "下一步便是挪威和瑞典了"
 change_news.7.c:0 "必须采取措施了"

 change_news.8:0 "挪威加入德国"
 change_news.8.t:0 "挪威加入德国"
 change_news.8.d:0 "在北欧的博弈中，德国已经取得了在挪威的胜利。今日，挪威政府宣布将加入德国，并在未来与德国展开更密切的合作。挪威的加入标志着同盟国在北欧的影响力进一步扩大。显然，这对协约国来说并不是什么好消息"
 change_news.8.a:0 "看来北欧要被同盟国收入囊中了"
 change_news.8.b:0 "阶段性的胜利"
 change_news.8.c:0 "情况不太妙"

 change_news.9:0 "瑞典加入德国"
 change_news.9.t:0 "瑞典加入德国"
 change_news.9.d:0 "在北欧的博弈中，德国已经取得了在瑞典的胜利。今日，瑞典政府宣布将加入德国，并在未来与德国展开更密切的合作。瑞典的加入标志着同盟国在北欧的影响力进一步扩大。显然，这对协约国来说并不是什么好消息"
 change_news.9.a:0 "看来北欧要被同盟国收入囊中了"
 change_news.9.b:0 "阶段性的胜利"
 change_news.9.c:0 "情况不太妙"

 change_news.10:0 "挪威加入英国"
 change_news.10.t:0 "挪威加入英国"
 change_news.10.d:0 "在北欧的博弈中，英国已经取得了在挪威的胜利。今日，挪威政府宣布将加入英国，并在未来与英国展开更密切的合作。挪威的加入标志着协约国在北欧的影响力进一步扩大。显然，这对同盟国来说并不是什么好消息"
 change_news.10.a:0 "看来北欧要被协约国收入囊中了"
 change_news.10.b:0 "情况不太妙"
 change_news.10.c:0 "阶段性的胜利"

 change_news.11:0 "瑞典加入英国"
 change_news.11.t:0 "瑞典加入英国"
 change_news.11.d:0 "在北欧的博弈中，英国已经取得了在瑞典的胜利。今日，瑞典政府宣布将加入英国，并在未来与英国展开更密切的合作。瑞典的加入标志着协约国在北欧的影响力进一步扩大。显然，这对同盟国来说并不是什么好消息"
 change_news.11.a:0 "看来北欧要被协约国收入囊中了"
