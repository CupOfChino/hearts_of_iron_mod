l_simp_chinese:
 #####event######
 change_germany.0:0 "更新日志"
 change_germany.0.t:0 "更新日志"
 change_germany.0.d:0 "§R2026/08/17§! \n1.§Y炼狱空军（噩梦空军）§!完整版上线：开局三选一模式（§G兵海/高质量/不变§!），每周检测自动为8大AI国挂载空军强化；1940年起循环刷机并自动补充机场容量，数量到上限自动停止；§R绝地反扑§!：与玩家开战且飞机不足1000架时，立即补充5000架、30天后再补5000架（每年一次） \n2.§Y城市攻防新闻§!：为45座关键城市编写90条战地新闻（柏林、巴黎、维也纳、伦敦、华盛顿、莫斯科、东京、南京、上海、长崎、伊斯坦布尔、华沙、德里等），全部§G二战爆发后§!自动触发且每局只触发一次；攻克新闻自动点名攻克国，文本引经据典 \n3.§Y芬兰中立承诺§!：三皇同盟开局时AI芬兰§R无法加入或创建阵营§!，防止紧张度升高引发苏联入侵导致二战提前；玩家芬兰自动解锁 \n4.§YBUG修复§!：大萧条危机结束事件改为只触发一次，修复重复弹窗无法结束的问题；大量事件链与数值重构 \n \n 在最后，如果有什么§R好点子§!或者§R愿意帮忙§!都可以在§R创意工坊留言§! "
 change_germany.0.a:0 "已阅"

 change_germany.1:0 "德国皇位候选者"
 change_germany.1.t:0 "选择登上皇位之人"
 change_germany.1.d:0 "重建德意志帝国已经深入人心，现在是时候挑选登上皇位之人了。\n第一位是威廉二世，是德国的前任皇帝，治理国家的经验绝对丰富，毫无疑问会贤明的治理帝国。不过在外交上有着自己的独特理解 \n 第二位是威廉三世皇子，毫无疑问是正统继承人。也许应该把帝国交到更年轻的人手里 \n 最后一位是维多利亚皇储，在修改继承法之后她也成了名正言顺的皇位继承者。"
 change_germany.1.a:0 "毫无疑问，在治理国家上威威更有经验"
 change_germany.1.b:0 "老登该爆金币了"
 change_germany.1.c:0 "德国的民主将向前迈出一大步"

 change_germany.2:0 "向东亚势力提供援助"
 change_germany.2.t:0 "向东亚势力提供援助"
 change_germany.2.d:0 "东亚地区地大物博，并且靠近橡胶产地。如果我们能向东亚施以援手，那么他们可能会倾向于在未来的战役中帮助我们。不过东亚地区势力错综复杂，如果我们想提高在东亚的影响力那么最优选便是帮助中国统一。至于为那个势力提供援助，就得斟酌一番了"
 change_germany.2.a:0 "援助prc"
 change_germany.2.b:0 "援助chi"

 change_germany.3:0 "德国为我们提供援助"
 change_germany.3.t:0 "德国为我们提供援助"
 change_germany.3.d:0 "德国表示将支持我们统一中国。当然，我们要保证不会加入他国对德的作战之中"
 change_germany.3.a:0 "当然，何乐而不为呢"

 change_germany.4:0 "三皇同盟"
 change_germany.4.t:0 "三皇同盟"
 change_germany.4.d:0 "拿皇提议德国、奥匈、法国组建三皇同盟维持欧陆霸权。这将会铸就世界上最强大的军事同盟。\n对英国来说，欧陆上将出现一个巨大的麻烦。因此，他们会不惜一切代价组建另一支军事同盟来对抗我们的霸权，对我们的扩张也会产生巨大的阻力。"
 change_germany.4.a:0 "一个伟大的提案，让我们携手再铸辉煌！"

 change_germany.5:0 "旧同盟国"
 change_germany.5.t:0 "旧同盟国"
 change_germany.5.d:0 "奥匈帝国已经重回人间，皇帝陛下也已经加冕为王。是时候让我们再次联合了。让我们复仇的怒火吞噬我们的仇敌。"
 change_germany.5.a:0 "欢迎我们忠实的朋友"

 change_germany.6:0 "意大利的命运"
 change_germany.6.t:0 "抉择意大利之命运"
 change_germany.6.d:0 "除了英国以外，现在欧洲大陆的列强只剩下意大利了。现在，是时候让意大利做出选择了：自己体面还是由我们帮他体面"
 change_germany.6.a:0 "让他自己决定吧"
 change_germany.6.b:0 "说这么多干嘛，干就完了"

 change_germany.7:0 "危在旦夕"
 change_germany.7.t:0 "危在旦夕"
 change_germany.7.d:0 "德国向我们发出了最后通牒，要么接受他们的提案，要么联军来让我们接受提案。也许我们可以向英国求助？"
 change_germany.7.a:0 "投降喵，投降喵"
 change_germany.7.b:0 "不，意大利命不该绝"
 change_germany.7.c:0 "呱，英国佬救我口牙"

 change_germany.8:0 "意大利屈服"
 change_germany.8.t:0 "意大利屈服"
 change_germany.8.d:0 "最终，意大利接受了我方提案。"
 change_germany.8.a:0 "没有流血真是再好不过"

 change_germany.9:0 "意大利拒绝我方提案"
 change_germany.9.t:0 "意大利拒绝我方提案"
 change_germany.9.d:0 "看来意大利似乎结交了新朋友？居然敢拒绝我方提案。盟友一场，唉，真不想打啊。"
 change_germany.9.a:0 "不听话的小朋友就得狠狠教训呢"

 change_germany.10:0 "意大利向我方求助"
 change_germany.10.t:0 "意大利向我方求助"
 change_germany.10.d:0 "德国向意大利亮出了獠牙，面对三皇同盟的威胁，意大利方面明白自己毫无胜算，于是寻求我方保护。当然，就算我们保护意大利德国肯定还会进攻意大利，但我们可以借此开辟一个额外战场来减轻东欧方向的压力；可这会让协约国更早的与同盟国交战，我们必须考虑到我们和盟友们的战备状态来进行抉择"
 change_germany.10.a:0 "能牵制同盟国的一部分兵力，何乐而不为呢？"
 change_germany.10.b:0 "我们还在与时间赛跑"

 change_germany.11:0 "英国拒绝提供庇护"
 change_germany.11.t:0 "英国拒绝提供庇护"
 change_germany.11.d:0 "英国方面表示：考虑到盟友战备状态，现在他们要避免与同盟国发生交火。简单来说就是怂了"
 change_germany.11.a:0 "沟槽的英国佬，只能认命了"
 change_germany.11.b:0 "沟槽的英国佬，做鬼都不会放过你们的"

 change_germany.12:0 "加入阵营"
 change_germany.12.t:0 "邀请加入"
 change_germany.12.d:0 "邀请我们并肩作战"
 change_germany.12.a:0 "当然"
 change_germany.12.b:0 "算了"

 change_germany.13:0 "[Root.GetNameDefCap]内战结束"
 change_germany.13.t:0 "[Root.GetNameDefCap]恢复统一了"
 change_germany.13.d:0 "蹂躏祖国的恐怖的内战已经结束了，我们终于达成了政治和解。现在我们[Root.GetAdjective]人民已经重归于好，并将携手重建我们伟大的祖国。妄图利用我们内讧的敌人现在必须面对一个团结的[Root.GetAdjective]国家。\n\n新的[Root.GetRulingIdeology][Root.GetName]将永远不会分裂！"
 change_germany.13.a:0 "终于统一了！"

 change_germany.14:0 "德国投资我国的油田开发"
 change_germany.14.t:0 "德国投资我国的油田开发"
 change_germany.14.d:0 "在得知我国境内油田碍于技术能力开发程度比较低时，我们的德国盟友慷慨的向我们分享了他们的技术，并且还投入了大量资金来和我们共同开发油田。得益于德国人的帮助，我们的石油产量得到了大幅度的提升。"
 change_germany.14.a:0 "盟友就该互相帮助"
 
 change_germany.15:0 "重建国家"
 change_germany.15.t:0 "重建国家"
 change_germany.15.d:0 "我们终于将祖国从法西斯分子手上解救出来，但代价却是法西斯分子的摧残让祖国满目疮痍。\n既然内战已经结束，是时候将重心放到重建国家之中。我们会向人民证明在摆脱法西斯分子之后，我们祖国的未来将会更加光明！"
 change_germany.15.a:0 "为了更美好的明天！"

 change_germany.16:0 "普鲁士军队的荣耀"
 change_germany.16.t:0 "普鲁士军队的荣耀"
 change_germany.16.d:0 "军队改革已经完成，现在我们可以宣布：我们的军队是继承了普鲁士军魂的强大军队。"
 change_germany.16.a:0 "蓄势待发！"

 change_germany.17:0 "要求归还阿尔萨斯"
 change_germany.17.t:0 "要求归还阿尔萨斯"
 change_germany.17.d:0 "德国索求阿尔萨斯洛林地区"
 change_germany.17.a:0 "都哥们"
 change_germany.17.b:0 "不能白给"

 change_germany.18:0 "让步？"
 change_germany.18.t:0 "让步？"
 change_germany.18.d:0 "他们需要我们做出让步"
 change_germany.18.a:0 "好机会"

 change_germany.19:0 "海军建设"
 change_germany.19.t:0 "海军建设"
 change_germany.19.d:0 "强敌的海军是他们的最为牢不可破的屏障，即使我们确信能在陆地和天空击败强敌的力量，但海上力量的悬殊对比使得我们无法威胁到强敌本土。\n我们的海军司令雷德尔和邓尼茨等人制定了详细的海军发展计划，只要我们能倾斜足够的资源，他们便会为我们打造一支强大的帝国海军突破强敌的海上屏障。"
 change_germany.19.a:0 "为什么不呢？"
 change_germany.19.b:0 "没必要"


 change_germany.20:0 "公海舰队"
 change_germany.20.t:0 "公海舰队"
 change_germany.20.d:0 "我们的舰队已经初具规模，在公海上已经成为一股不可小觑的力量。但这远远不够，我们将接着卧薪尝胆，继续扩建我们的海军，在下一次大战中彻底击碎英国皇家舰队！"
 change_germany.20.a:0 "继续下饺子！"


 change_germany.21:0 "德国大规模扩建海军"
 change_germany.21.t:0 "德国大规模扩建海军"
 change_germany.21.d:0 "德国一反常态开始大肆扩建海军，毫无疑问，这是为了挑战我们的霸权。我们不能将我们的优势拱手送出！"
 change_germany.21.a:0 "来吧"
 change_germany.21.b:0 "与我何干？"

 change_germany.22:0 "军队训练完成"
 change_germany.22.t:0 "军队训练完成"
 change_germany.22.d:0 "我们在德国的军队已经训练完毕，现在他们已经回国了"
 change_germany.22.a:0 "很好"

 change_germany.23:0 "动员程度提升"
 change_germany.23.t:0 "动员程度提升"
 change_germany.23.d:0 "在我们的不懈努力下，我们的动员水平得到提升！"
 change_germany.23.a:0 "善"

 change_germany.24:0 "战争动员"
 change_germany.24.t:0 "战争动员法案"
 change_germany.24.d:0 "战争已经爆发，是时候选择动员的措施了：缓慢但全面地进行总动员还是快速地进行总动员"
 change_germany.24.a:0 "缓慢但全面地进行总动员"
 change_germany.24.b:0 "快速地进行总动员"

 change_germany.25:0 "机械设计局建成"
 change_germany.25.t:0 "机械设计局建成"
 change_germany.25.d:0 "在德皇的牵头下，机械设计局建设完毕，它将确保我们后续的军备设计的质量超过其他国家。"
 change_germany.25.a:0 "善"

 change_germany.26:0 "及时动员完成"
 change_germany.26.t:0 "及时动员完成"
 change_germany.26.d:0 "在我们的不懈努力之下，我们的战争动员计划终于告一段落，这为应对随时可能到来的冲突提供了保障。"
 change_germany.26.a:0 "o_O"

 change_germany.27:0 "欧陆绝对霸权"
 change_germany.27.t:0 "欧陆绝对霸权"
 change_germany.27.d:0 "随着最后一个国家沦入我手，整个欧陆基本已经被我们掌握手中。"
 change_germany.27.a:0 "我们的联盟势不可挡"

 change_germany.28:0 "新人？"
 change_germany.28.t:0 "§R是否需要新手大礼包？§!"
 change_germany.28.d:0 "由于本模组的ai§R编制§!和§R产线§!都进行过§R大幅度的优化§!，并且还有一定数量的§R火星兵§!（§R实际难度是没有专业ai强化模组高的§!）。如果不够熟练很容易运营半天结果被一脚踩死，导致游玩体验不佳。\n这里贴心的为您准备了玩家专属的大礼包，如果您不太熟练打难度偏高的mod，这里还是建议领取一下。\n§RPS.§!本模组对ai的帮助有且仅有§R火星兵§!，只有§R德国§!会刷一次§R合成炼油厂§!，§R完全没有§!任何§Rai专属隐藏修正§!。ai能拿到的buff玩家正常流程也能拿到，§R甚至ai的智商问题导致玩家拿到的buff更多§!。而且ai火星兵§R绝对不包括飞机、舰船§!，只是送一些陆军。\n§R配这张图只是觉得这张图有点难绷§!"
 change_germany.28.a:0 "我打过ai强化mod，这个垃圾ai就是逊拉"
 change_germany.28.b:0 "我是来享受游戏的，§Y那就来点小buff§!"
 change_germany.28.c:0 "§R宝宝巴士，启动！！！§!"
 change_germany.28.e:0 "§R我说我要摇轮椅你二多龙马§!"

 change_germany.29:0 "援助东亚"
 change_germany.29.t:0 "援助东亚"
 change_germany.29.d:0 "日本正在侵略中国。如果我们援助中国，他们可能会在战后倒向我们，这将使我们在东亚获得一个强大的盟友。"
 change_germany.29.a:0 "朋友越多越好"
 change_germany.29.b:0 "什么东？什么亚？没听说过"

 change_germany.30:0 "同盟国的援助"
 change_germany.30.t:0 "意料之外的援助"
 change_germany.30.d:0 "[FROM.GetName]及其盟友向我们提供了援助。这些物资和支持对我们抗击日本侵略者至关重要。"
 change_germany.30.a:0 "真是雪中送碳！"

 change_germany.31:0 "豪鹰与醒龙"
 change_germany.31.t:0 "豪鹰与醒龙"
 change_germany.31.d:0 "随着入侵者被击退，德国提议我们加入他们的阵营。这是一个加强我们力量、共同维护东亚稳定的好机会。"
 change_germany.31.a:0 "不赖"
 change_germany.31.b:0 "算了吧。。。"

 change_germany.32:0 "德国支持统一中国"
 change_germany.32.t:0 "德国支持统一中国"
 change_germany.32.d:0 "在加入德国阵营后，他们表示支持我们统一整个中国。这意味着我们可以结束分裂，成为一个强大的国家。"
 change_germany.32.a:0 "机不可失！"

 change_germany.33:0 "拉拢日本"
 change_germany.33.t:0 "拉拢日本"
 change_germany.33.d:0 "中国已经彻底导向了德国佬。我们必须得有所行动了！日本刚刚经历了战败的阴影，想必他们已经认识到了盟友的重要性。我们会将东亚许诺给他以此来拉拢，在生死存亡的威胁下他断不可能拒绝。"
 change_germany.33.a:0 "是时候抉择你的命运了"

 change_germany.34:0 "英国邀请我们加入"
 change_germany.34.t:0 "英国邀请我们加入"
 change_germany.34.d:0 "英国不仅主动邀请我们加入联盟，还将整个中国许诺给了我们，这是我们洗刷耻辱的好机会！"
 change_germany.34.a:0 "太好了！"

 change_germany.35:0 "日本同意了"
 change_germany.35.t:0 "日本接受了"
 change_germany.35.d:0 "日本接受了我们的提案，现在我们在东亚的力量算是持平了。"
 change_germany.35.a:0 "很好。"

 change_germany.36:0 "德国援建完成"
 change_germany.36.t:0 "德国援建完成"
 change_germany.36.d:0 "德国承诺的援助计划已经完成，现在该我们履行诺言了。"
 change_germany.36.a:0 "当然"

 change_germany.37:0 "德国援建完成"
 change_germany.37.t:0 "德国援建完成"
 change_germany.37.d:0 "德国承诺的援助计划已经完成，现在该我们履行诺言了。"
 change_germany.37.a:0 "当然"

 change_germany.38:0 "德国邀请加入"
 change_germany.38.t:0 "德国邀请加入"
 change_germany.38.d:0 "在战场上取得大捷后，德国人向我们伸出了橄榄枝：只要我们协助他们击败协约国，那么我们的诉求都将得到实现。"
 change_germany.38.a:0 "不错的交易"
 change_germany.38.b:0 "还是算了"

 change_germany.39:0 "中美洲同意"
 change_germany.39.t:0 "中美洲同意"
 change_germany.39.d:0 "在见识到了我们联盟的实力和敌人的衰弱后，中美洲最后选择加入我方，为我们的联盟而战。"
 change_germany.39.a:0 "正确的选择"
 
 change_germany.40:0 "中美洲拒绝了"
 change_germany.40.t:0 "中美洲拒绝了"
 change_germany.40.d:0 "中美洲最终还是放弃了我们的提案，选择在这场世界大战中保持中立。"
 change_germany.40.a:0 "行吧。。。"

 change_germany.41:0 "猝不及防的战争"
 change_germany.41.t:0 "猝不及防的战争"
 change_germany.41.d:0 "我们没有做好充分的准备，突然卷入了这场世界大战。"
 change_germany.41.a:0 "这下麻烦了"

 change_germany.42:0 "猝不及防的战争"
 change_germany.42.t:0 "猝不及防的战争"
 change_germany.42.d:0 "世界大战已经爆发，万幸的是，我们已经做足了准备。"
 change_germany.42.a:0 "很好。"


 change_france.1:0 "对德皇示好"
 change_france.1.t:0 "与德皇结盟"
 change_france.1.d:0 "德国与我国一直在阿尔萨斯地区有着争议，如果我们主动放弃该地区移交给德国，德皇一定不会拒绝。但是我们应该这么做吗"
 change_france.1.a:0 "先看看德皇的态度"
 change_france.1.b:0 "就这样吧"

 change_france.2:0 "德皇对拿皇想直接结盟的选择"
 change_france.2.t:0 "拿皇想一笑泯恩仇"
 change_france.2.d:0 "虽然我国与法国一直存在着仇恨，但既然对面主动低头了，那么也许我们可以联合？考虑到我们是吸引二五仔的圣体，也许我们应该让法国拿出诚意来？"
 change_france.2.a:0 "都哥们，之前都是不懂事打着玩儿的"
 change_france.2.b:0 "江湖规矩，得递投名状吧"
 change_france.2.c:0 "谁跟你是哥们"

 change_france.3:0 "德皇要求阿尔萨斯洛林"
 change_france.3.t:0 "德国请求就阿尔萨斯洛林地区的归属进行探讨"
 change_france.3.d:0 "不出所料，德国依然觊觎着阿尔萨斯洛林。看来我们不付出点什么是无法完全得到德国的信任"
 change_france.3.a:0 "致德皇:不可能"
 change_france.3.b:0 "两国以此永结良缘"
 change_france.3.c:0 "但是资源开采权依然要属于我们"

 change_france.4:0 "德皇抉择2"
 change_france.4.t:0 "法国要求开采权"
 change_france.4.d:0 "法国方面同意归还阿尔萨斯洛林地区。但考虑到该地区的煤炭和铁矿对其有着重大意义，法国方面要求保留他们的资源开采权"
 change_france.4.a:0 "这是一个完美的提案"
 change_france.4.b:0 "阿尔萨斯洛林地区的一切都是德国的"

 change_france.5:0 "德皇抉择3"
 change_france.5.t:0 "法国归还阿尔萨斯洛林地区"
 change_france.5.d:0 "我们亲爱的法兰西朋友愿意归还阿尔萨斯洛林地区并和我国结成友邦，这简直是不可思议!我们敞开怀抱接纳他们。"
 change_france.5.a:0 "其实，德法早就是一家人了。"
 
 change_france.6:0 "德国拒绝提案"
 change_france.6.t:0 "德国拒绝我国的提案"
 change_france.6.d:0 "贪心的德国依然保留了他们的龌龊想法，尽管我们已经做出了巨大让步，但德国一点也不领情"
 change_france.6.a:0 "愚蠢"

 change_france.7:0 "法国拒绝提案"
 change_france.7.t:0 "法国拒绝了我国的进一步提案"
 change_france.7.d:0 "愚昧的法国拒绝了以领土换取庇护的提案。即使谈判桌上得不到，帝国也会亲手夺回我们的领土"
 change_france.7.a:0 "愚蠢"

 change_france.8:0 "法兰西要求合并"
 change_france.8.t:0 "法兰西要求合并"
 change_france.8.d:0 "法兰西的皇帝向我们下达了最后通牒：主动来降仍不失封侯之位亦或者被他们的军队踏平"
 change_france.8.a:0 "识时务者为俊杰喵"
 change_france.8.b:0 "你✔8谁啊"

 change_france.9:0 "我国威信遭到挑衅"
 change_france.9.t:0 "伊比利亚的国家选择拒绝"
 change_france.9.d:0 "今早，我们的外交官收到了伊比利亚国家的回复。他们表示“法兰西皇帝的脑子是不是进水了？想让我国投降？呸”\n看来我们应该让他们知道谁是老大了"
 change_france.9.a:0 "他们已经签下了自己的死刑执行书"

 change_france.10:0 "法兰西要求合并"
 change_france.10.t:0 "法兰西要求合并"
 change_france.10.d:0 "法兰西的皇帝向我们下达了最后通牒：主动来降仍不失封侯之位亦或者被他们的军队踏平"
 change_france.10.a:0 "识时务者为俊杰喵"
 change_france.10.b:0 "你✔8谁啊"

 change_france.11:0 "工厂转换"
 change_france.11.t:0 "工厂转换"
 change_france.11.d:0 "既然要转换工厂，那么你想将什么工厂转换成什么工厂喵 ^·^~ "
 change_france.11.a:0 "军工转民工"
 change_france.11.b:0 "民工转军工"

 change_france.12:0 "民工转军工"
 change_france.12.t:0 "民工转军工"
 change_france.12.d:0 "好的喵 ^·^~ 那么要换几个工厂喵 ^·^~"
 change_france.12.a:0 "换三个"
 change_france.12.b:0 "换六个"

 change_france.13:0 "军工转民工"
 change_france.13.t:0 "军工转民工"
 change_france.13.d:0 "好的喵 ^·^~ 那么要换几个工厂喵 ^·^~"
 change_france.13.a:0 "换三个"
 change_france.13.b:0 "换六个"

 change_france.14:0 "臣服或死亡"
 change_france.14.t:0 "臣服或死亡"
 change_france.14.d:0 "法兰西帝国已经下达了最后通牒：臣服他们，共同开发油田，不会拿走我们的开采权；或者他们自己来取。"
 change_france.14.a:0 "投降喵投降喵"

 change_france.15:0 "战争动员尚未完成"
 change_france.15.t:0 "战争动员尚未完成"
 change_france.15.d:0 "战争动员尚未完成，世界大战便已经来临。我们需要时间来动员，希望时间会站在我们这一边。。。"
 change_france.15.a:0 "加快动员！"

 change_france.16:0 "动员程度提升"
 change_france.16.t:0 "动员程度提升"
 change_france.16.d:0 "万幸，在经过两个月的宣传之后，我们的战争动员进了一步"
 change_france.16.a:0 "好"

 change_france.17:0 "巴黎会议"
 change_france.17.t:0 "一场特殊的会议"
 change_france.17.d:0 "柏林、巴黎、布达佩斯的旗帜在凡尔赛镜厅交叠，德皇威廉二世、拿破仑四世与奥托大公的肖像高悬。参谋们摊开泛黄的《凡尔赛条约》副本，三皇代表以红墨水划去「莱茵非军事区」「裁军条款」等字句，签署《三皇最终议定书》"
 change_france.17.a:0 "「1918年的枷锁已碎，1941年的铁砧将由我们铸造！」"

 change_france.18:0 "加紧军备建设"
 change_france.18.t:0 "加紧军备建设"
 change_france.18.d:0 "鲁尔的炼钢厂喷吐黑烟，洛林的坦克流水线昼夜轰鸣，匈牙利平原上「托尔蒂」重型坦克原型车碾过农田。三国内阁宣布「总生产力管制法案」，征召妇女与殖民地劳工进入兵工厂。报纸头条叫嚣："
 change_france.18.a:0 "「每一枚炮弹都将刻上凡尔赛叛徒的名字！」"

 change_france.19:0 "联合演习"
 change_france.19.t:0 "联合军事演习"
 change_france.19.d:0 "“将军，我的军队训练的怎么样？”\n“一切都在按计划进行，各种新式武器正在大规模列装各集团军，军官也进行了系统性的培训来适应现代的战争。只是前线部队依然缺乏现代战争的经验，在大战之前我们需要一场大规模的演习来帮助我们的士兵了解即将到来的战争。”\n“我了解了，我将联系我们的盟友进行一次大规模军事演习，就叫它：”"
 change_france.19.a:0 "“联合利剑”"

 change_france.20:0 "动员演讲"
 change_france.20.t:0 "动员演讲"
 change_france.20.d:0 "“塔达林的经济崩溃迫在眉睫。对于所有想要离开那片废土去寻找更美好生活的人来说，艾尔是你们所有人安全的港湾。”\n“为了保护奈拉启姆星灵不受异虫的残害，我所做的比他们自己的黑暗教长都多。无论他们如何讲谤我，我将继续为所有星灵的最大利益而努力奋斗。”\n“身为你们的大主教，我带领星灵实现了达拉姆统治领地和经济的扩张。我们将继续成长,用行动回击那些只会说风凉话，不愿意和我们相向而行的害群之马。”\n“达拉姆武装力量无数的优秀儿女正时刻守卫看我们的家园大门，但是他们孤木难支。凡是今天应征入伍者，获得全新太阳能战斧一把。”\n“激进分子和异见者希望你们一听见枪声就背弃多年的和平与繁荣。他们没有勇气和能力带领星灵穿越一个充满危险的星系。”\n“法治是我们的命脉，然而它却受到前所未有的挑战。我将恢复我们星灵的荣光，绝不会向任何外星势力低头。”\n“我已经驯服了人类，荡平了异虫。如今它们的创造者想要夺走我们拥有的一切。永远记住，谁才是最能保护你们的人。”\n“不要听信谗言，我不是什么净化者。”"
 change_france.20.a:0 "这给我干那来了，这还是地球吗？"

 change_france.21:0 "同盟国空军入侵协约国领空"
 change_france.21.t:0 "同盟国空军入侵协约国领空"
 change_france.21.d:0 "“a队，搜集情报”\n“b队，和我一起拦截协约国战机”\n“中尉，7点钟方向，12架敌机”\n“b队，进行阻击，诱骗敌人攻击，随时准备脱离；a队，往边境移动，准备与增援会和。”"
 change_france.21.a:0 "“让我们看看协约国是否能沉住气”"

 change_france.22:0 "同盟国海军大规模出港"
 change_france.22.t:0 "同盟国海军大规模出港"
 change_france.22.d:0 "德国公海舰队、法国斯特拉斯堡战列舰分队与匈牙利改装商船突击队齐聚威廉港。沙恩霍斯特号炮击废弃的斯卡帕湾靶船，法国潜艇在苏伊士运河口上浮悬挂帝国旗，匈牙利「河岸杀手」雷艇队沿多瑙河逼近铁门峡谷。"
 change_france.22.a:0 "「我们的锚链已解开，下一次靠港将在敌人海岸！」"

 change_france.23:0 "同盟国军队于边境集结"
 change_france.23.t:0 "同盟国军队于边境集结"
 change_france.23.d:0 "大量军队陆续部署到与协约国的边境线之上，两大集团在边境上剑拔弩张。"
 change_france.23.a:0 "战争一触即发"

 change_france.24:0 "法国军队边境摩擦"
 change_france.24.t:0 "法国军队边境摩擦"
 change_france.24.d:0 "法国军队和英国军队发生了小规模冲突，双发互相用拳头、石头和枪托厮打，都很默契的没有人开火。这出闹剧在双方大部队到来时纷纷停手，两边谁也不服谁，最终双方各有多名士兵受伤，法方一名士兵因受伤严重最终治疗无果死亡。"
 change_france.24.a:0 "看到了啊，这是对面先动手的"

 change_france.25.a:0 "跨越边境"
 change_france.25.t:0 "跨越边境"
 change_france.25.d:0 "让我们为在冲突中牺牲的勇士报仇！"
 change_france.25.a:0 "冲刺！"

 change_france.26:0 "法国军队跨越边境"
 change_france.26.t:0 "法国军队跨越边境"
 change_france.26.d:0 "法国军队开始向敌人的防线发起突击，作为他们的盟友，我们将会和他们站在一起。"
 change_france.26.a:0 "战!"

 change_france.27:0 "法国军队跨越边境"
 change_france.27.t:0 "法国军队跨越边境"
 change_france.27.d:0 "法国人终于撕破伪装开始向我们盟友的防线发起攻击，我们必须帮助我们的盟友。"
 change_france.27.a:0 "战!"

  
 change_eng.1:0 "英法同盟"
 change_eng.1.t:0 "英法同盟"
 change_eng.1.d:0 "旧同盟国已经归来，如同地狱的恶鬼一般，誓要将复仇的怒火带给这个世界。法国政府提议联合，组建军事同盟，对抗这即将到来的复仇"
 change_eng.1.a:0 "我们别无选择"

 change_eng.2:0 "三国协约"
 change_eng.2.t:0 "三国协约"
 change_eng.2.d:0 "欧洲大陆上出现了一个强大的军事同盟，这是一个巨大的威胁。当然，这个想法不可能只有我国有，东方的苏联和西方的美国也十分忌惮这个联盟。我们现在要做的便是放下恩怨，联合起来，以免被逐个击破。"
 change_eng.2.a:0 "我们别无选择"

 change_eng.3:0 "英国提议放下恩怨"
 change_eng.3.t:0 "英国政府提议放下恩怨"
 change_eng.3.d:0 "“三皇同盟”的建立让世界各国倍感压力。英国政府主动找到并建议我们放下恩怨，只有联合才能与“三皇同盟”抗衡。否则，等待我们的只有被铁骑踏平的结局。"
 change_eng.3.a:0 "是啊，我们别无选择了"

 change_eng.4:0 "英国邀请加入"
 change_eng.4.t:0 "英国邀请加入"
 change_eng.4.d:0 "英国邀请我们加入协约国，并承诺会保障我们的安全"
 change_eng.4.a:0 "彳亍"
 change_eng.4.b:0 "还是算了，太危险了"

 change_eng.5:0 "英国邀请加入"
 change_eng.5.t:0 "英国邀请加入"
 change_eng.5.d:0 "英国邀请我们加入协约国，并承诺会保障我们的安全"
 change_eng.5.a:0 "彳亍"
 change_eng.5.b:0 "还是算了，太危险了"

 change_eng.6:0 "被拒绝"
 change_eng.6.t:0 "被拒绝了。。。"
 change_eng.6.d:0 "看来他们还是畏惧同盟国的势力呢。。。"
 change_eng.6.a:0 "那就让他们自生自灭吧"

 change_eng.7:0 "同盟国大规模军事演习！"
 change_eng.7.t:0 "同盟国大规模军事演习"
 change_eng.7.d:0 "同盟国近期展开了超大规模的演习，在此次演习中重点训练了的各兵种协同作战能力以及各国之间的部队协调。这次演习毫无疑问是针对我们的"
 change_eng.7.a:0 "。。。准备动员军队"

 change_eng.8:0 "同盟国空军入侵！！"
 change_eng.8.t:0 "同盟国空军入侵！！"
 change_eng.8.d:0 "入侵我们领空的同盟国空军已经被赶走，同盟国愈发大胆的行为也在提醒着我们一场风暴将要袭来"
 change_eng.8.a:0 "。。。"

 change_eng.9:0 "同盟国海军异常举动！！"
 change_eng.9.t:0 "同盟国海军异常举动！！"
 change_eng.9.d:0 "据英国皇家海军第七舰队报告，法兰西帝国和德意志帝国的舰队于昨日出港，第七舰队选择尾随其后并派出了侦察机进行监视，他们的目的地暂不得知。"
 change_eng.9.a:0 "随时报告敌舰队异常举动"

 change_eng.10:0 "同盟国陆军大规模集结！！"
 change_eng.10.t:0 "同盟国陆军大规模集结！！"
 change_eng.10.d:0 "局势升温！我们的间谍在失联前传回了最后一则重磅消息：同盟国开始大规模调动军队！各个兵团乘坐火车开赴边境！"
 change_eng.10.a:0 "立刻调动军队，随时准备应对突袭！"

 change_eng.11:0 "法国军队制造边境摩擦！！！！"
 change_eng.11.t:0 "法国军队制造边境摩擦！！！！"
 change_eng.11.d:0 "法国军队不顾警告擅自闯入我们的边境线，并与我们的士兵发生冲突。在这次冲突中，双方都默契的没有使用武器，我们的士兵凭借着顽强的意志击退了惹事的法国军队。在此次冲突中，双方各有多名士兵受伤，法国人甚至有一名士兵受重伤。"
 change_eng.11.a:0 "好样的！但对方肯定不会善罢甘休"

 change_eng.12:0 "海军陆战队训练"
 change_eng.12.t:0 "海军陆战队训练"
 change_eng.12.d:0 "考虑到未来的战争，我们的英国盟友邀请我们成立联合海军陆战队训练委员会，负责海军陆战队的现代化训练，以应对未来的作战。"
 change_eng.12.a:0 "当然"

 change_eng.13:0 "海军陆战队训练完成"
 change_eng.13.t:0 "海军陆战队训练完成"
 change_eng.13.d:0 "在经过一段时间的训练后，我们的海军陆战队实力得到了大幅提升！他们将化身为尖刀，刺穿敌人的海岸线防御，直插敌人的心脏！"
 change_eng.13.a:0 "cool!"

 change_eng.14:0 "敌军异常调动"
 change_eng.14.t:0 "敌军异常调动"
 change_eng.14.d:0 "据情报显示，敌国军队在各个港口异常集结，这似乎预示着一场规模庞大的登录作战即将展开。。。"
 change_eng.14.a:0 "切勿分心"
 
 change_eng.15:0 "经济合作倡议完成"
 change_eng.15.t:0 "经济合作倡议完成"
 change_eng.15.d:0 "我们的经济合作倡议已圆满完成！工业产能的共享与协作，为整个阵营的战争机器注入了新的活力。"
 change_eng.15.a:0 "合作共赢！"
 
 change_eng.16:0 "盟友完成经济合作倡议"
 change_eng.16.t:0 "盟友完成经济合作倡议"
 change_eng.16.d:0 "§Y[FROM.GetName]§! 刚刚完成了阵营内的经济合作倡议，为我们的共同工业基础做出了卓越贡献。"
 change_eng.16.a:0 "干得漂亮！"
 
 change_eng.17:0 "科研合作协议完成"
 change_eng.17.t:0 "科研合作协议完成"
 change_eng.17.d:0 "我们的科研合作协议已圆满完成！前沿技术成果在联盟内部广泛共享，极大地推动了我们的科技发展。"
 change_eng.17.a:0 "科技兴国！"
 
 change_eng.18:0 "盟友完成科研合作协议"
 change_eng.18.t:0 "盟友完成科研合作协议"
 change_eng.18.d:0 "§Y[FROM.GetName]§! 刚刚完成了阵营内的科研合作协议，为我们的科技水平带来了显著的提升。"
 change_eng.18.a:0 "科技是第一生产力！"
 
 change_eng.19:0 "军事合作倡议完成"
 change_eng.19.t:0 "军事合作倡议完成"
 change_eng.19.d:0 "我们的军事合作倡议已圆满完成！部队的协同作战经验在阵营内部得到了广泛的交流与传播。"
 change_eng.19.a:0 "训练有素的部队！"
 
 change_eng.20:0 "盟友完成军事合作倡议"
 change_eng.20.t:0 "盟友完成军事合作倡议"
 change_eng.20.d:0 "§Y[FROM.GetName]§! 刚刚完成了阵营内的军事合作倡议，使我们的军队受益匪浅。"
 change_eng.20.a:0 "值得学习的榜样！"
 
 change_eng.21:0 "空军合作倡议完成"
 change_eng.21.t:0 "空军合作倡议完成"
 change_eng.21.d:0 "我们的空军合作倡议已圆满完成！空中力量的战术交流让我们的空军战术水平大幅提升。"
 change_eng.21.a:0 "制空权是属于我们的！"
 
 change_eng.22:0 "盟友完成空军合作倡议"
 change_eng.22.t:0 "盟友完成空军合作倡议"
 change_eng.22.d:0 "§Y[FROM.GetName]§! 刚刚完成了阵营内的空军合作倡议，为我们的空中力量带来了宝贵经验。"
 change_eng.22.a:0 "天空是我们的疆场！"
 
 change_eng.23:0 "海军合作倡议完成"
 change_eng.23.t:0 "海军合作倡议完成"
 change_eng.23.d:0 "我们的海军合作倡议已圆满完成！海军战术与经验的交流让我们的舰队更加强大。"
 change_eng.23.a:0 "统治海洋！"
 
 change_eng.24:0 "盟友完成海军合作倡议"
 change_eng.24.t:0 "盟友完成海军合作倡议"
 change_eng.24.d:0 "§Y[FROM.GetName]§! 刚刚完成了阵营内的海军合作倡议，为我们的蓝色海军注入了新的活力。"
 change_eng.24.a:0 "深蓝的旗帜！"
 
 change_eng.25:0 "工业合作倡议完成"
 change_eng.25.t:0 "工业合作倡议完成"
 change_eng.25.d:0 "我们的工业合作倡议已圆满完成！生产线与建设经验的共享极大促进了阵营的工业化进程。"
 change_eng.25.a:0 "工业即国力！"
 
 change_eng.26:0 "盟友完成工业合作倡议"
 change_eng.26.t:0 "盟友完成工业合作倡议"
 change_eng.26.d:0 "§Y[FROM.GetName]§! 刚刚完成了阵营内的工业合作倡议，为我们的工业建设增添了强大的动力。"
 change_eng.26.a:0 "共同发展！"



 change_sov.1:0 "苏联邀请东亚"
 change_sov.1.t:0 "苏联邀请东亚"
 change_sov.1.d:0 "苏联在加入三国协约之后，将橄榄枝抛向了我们。我们是否应该和他们并肩作战呢？又或者是保持中立？"
 change_sov.1.a:0 "三皇同盟是我们最大的威胁"
 change_sov.1.b:0 "我们没必要去淌这趟浑水"

 change_sov.2:0 "军队入驻布科维纳受阻！"
 change_sov.2.t:0 "军队入驻布科维纳受阻！"
 change_sov.2.d:0 "狡猾的奥匈皇储当面一套背面一套，本来在谈判桌上同意我国军队入住布科维纳以作缓冲带。然而当我们的军队即将踏入其中时，遭到了奥匈帝国军队的阻挠，对方表示将会不惜一切代价守护边境线，包括使用武力。慎重起见，我们的带队军官选择了对峙而非强闯。"
 change_sov.2.a:0 "我们应该避免冲突扩大化"
 change_sov.2.b:0 "我们会亲手拿到我们要求的东西"

 change_sov.3:0 "最后通牒"
 change_sov.3.t:0 "最后通牒"
 change_sov.3.d:0 "莫斯科方面向我们发布了最后通牒，要求我们放下武装，停止抵抗，接受莫斯科方面的控制。"
 change_sov.3.a:0 "没一点胜算，点了"
 change_sov.3.b:0 "我们绝不投降！"

 change_sov.4:0 "芬兰拒绝我方提案"
 change_sov.4.t:0 "芬兰拒绝我方提案"
 change_sov.4.d:0 "芬兰拒绝我方提案"
 change_sov.4.b:0 "敬酒不吃吃罚酒"

 change_sov.5:0 "最后通牒"
 change_sov.5.t:0 "最后通牒"
 change_sov.5.d:0 "[文本待填充]"
 change_sov.5.a:0 "投降"
 change_sov.5.b:0 "干"

 change_sov.6:0 "唐努图瓦拒绝"
 change_sov.6.t:0 "唐努图瓦拒绝"
 change_sov.6.d:0 "[文本待填充]"
 change_sov.6.a:0 "来吧"

 change_sov.7:0 "最后通牒"
 change_sov.7.t:0 "最后通牒"
 change_sov.7.d:0 "[]"
 change_sov.7.a:0 "投降"
 change_sov.7.b:0 "干"

 change_sov.8:0 "[Root.GetNameDefCap]拒绝提案"
 change_sov.8.t:0 "[Root.GetNameDefCap]拒绝提案"
 change_sov.8.d:0 "[Root.GetNameDefCap]拒绝提案"
 change_sov.8.a:0 "翅膀硬了是吧"

 change_sov.9:0 "加紧建设"
 change_sov.9.t:0 "用钢铁与火焰锻造盾牌！"
 change_sov.9.d:0 "FOR --D指导 \n 面对欧洲反动君主势力的复辟和帝国主义集团的包围，苏维埃祖国已进入最危险的时刻！根据联共（布）中央特别决议，第三个五年计划将提前进入『国防工业化阶段』。数以万计的青年突击队正开赴西伯利亚，共青团员们高举着列宁的画像，在冻土上修建铁路、开发矿藏、建设新的拖拉机厂。马格尼托哥尔斯克的熔炉昼夜不息，第聂伯河水电站的涡轮机全速运转——让那些戴着皇冠的寄生虫们知道，无产阶级的铁拳永远准备着粉碎任何侵略者！"
 change_sov.9.a:0 "继续建设！"

 change_sov.10:0 "西伯利亚建设完成"
 change_sov.10.t:0 "西伯利亚建设完成"
 change_sov.10.d:0 "在广大人民群众的支持下，由党中央领导的西伯利亚大开发计划获得圆满完成！整个西伯利亚基本完成了通车，横贯整个西伯利亚的铁路也重新修缮完毕。这是所有人齐心协力的结果！"
 change_sov.10.a:0 "伟大的成就！"

 change_sov.11:0 "乌拉尔工业区建设完成"
 change_sov.11.t:0 "乌拉尔工业区建设完成"
 change_sov.11.d:0 "FOR --D指导 \n 随着最后一座高炉在车里雅宾斯克点燃，乌拉尔-西伯利亚工业带正式宣告建成！这个绵延两千公里的巨型生产集群拥有47座现代化工厂、12个军工联合体和3个秘密科研城。来自莫斯科的捷报称：新工业区单月可生产600辆T-34坦克或250架伊尔-2攻击机。斯大林同志在贺电中强调：『当巴黎和柏林还在用镀金马车炫耀腐朽时，苏维埃工人已用车床和熔炉筑起了不可摧毁的钢铁长城！』现在，让我们把劳动英雄们的奖章别在他们结实的工装服上！"
 change_sov.11.a:0 "乌拉尔山脉就是我们的兵工厂！"

 change_sov.12:0 "苏联强化启用"
 change_sov.12.t:0 "苏联强化启用"
 change_sov.12.d:0 "请注意，苏联强化已经启用： \n\n 苏联在与主要国家处于防御性战争时，将会触发“伟大的卫国战争”。此强化将确保苏联在面对本模组强化过的德国能进行反推，而非一触即溃。苏联将随着投降倾向的提高获得愈发强大的buff和愈加强大的“火星部队”。如果开启“三皇同盟”，那么苏联的“卫国战争”决议组将更加强力来确保能够对抗整个同盟国。"
 change_sov.12.a:0 "§R我已知晓§!"

 change_sov.13:0 "卫国战争开始"
 change_sov.13.t:0 "卫国战争开始"
 change_sov.13.d:0 "敌人如潮水般涌来，前线各处告急。伟大的祖国已经陷入了最危险的时刻！地无分南北、人无分老幼，均有守土抗敌之职责！"
 change_sov.13.a:0 "苏维埃不会消亡！"

 change_sov.14:0 "苏联卫国战争等级提高"
 change_sov.14.t:0 "苏联卫国战争等级提高"
 change_sov.14.d:0 "苏联展示了她的韧性。"
 change_sov.14.a:0 "苏维埃恐怕真的屹立不倒"

 change_sov.15:0 "苏联卫国战争达到最高"
 change_sov.15.t:0 "苏联卫国战争达到最高"
 change_sov.15.d:0 "苏联卫国战争动员水平已经达到最高！我们每前进一步都将付出惨痛的代价，我们已经陷入对苏作战的泥潭之中。"
 change_sov.15.a:0 "该死！"

 change_sov.16:0 "卫国战争等级提高"
 change_sov.16.t:0 "卫国战争等级提高"
 change_sov.16.d:0 ""‘东方的红色巨兽正在觉醒！他们的工厂昼夜不停，士兵们士气高昂，前线的压力与日俱增。我们低估了他们——这是一场比预想中更可怕的战争。
 change_sov.16.a:0 "可恶！"

 change_sov.17:0 "卫国战争已经完全动员完毕"
 change_sov.17.t:0 "卫国战争已经完全动员完毕"
 change_sov.17.d:0 "从列宁格勒到高加索，从乌拉尔到莫斯科——整个国家已转化为一台战争机器。数百万士兵整装待发，工厂昼夜不息，每一门火炮、每一辆坦克、每一名战士都在等待着命运的号角。这是属于祖国的时刻，也是敌人噩梦的开始。"
 change_sov.17.a:0 "胜利在望，敌人将被拖入反攻的浪潮！"

 change_sov.18:0 "阻止红场阅兵失败"
 change_sov.18.t:0 "未能及时终止红场阅兵"
 change_sov.18.d:0 "莫斯科红场，凛冽寒风中行进着最后的受阅方阵。 \n 尽管总参谋部多次警告德军先锋距首都仅30公里，尽管前线每个步兵师只剩不到40%的兵力，克里姆林宫最终未能叫停这场危险的阅兵。当苏维埃的坦克履带碾过结霜的广场地砖时，西方面军的电报正像雪片般飞来——第16集团军的防线在克林地区出现了致命缺口，而本该增援的莫斯科卫戍部队此刻正高举着缀满霜花的步枪向列宁墓行礼。 \n 收到电报的将军长叹了一口气："
 change_sov.18.a:0 "“我有种不好的预感，参谋长。前线部队已经是强弩之末，也许这将成为这场战争的转折点”"

 change_sov.19:0 "红场阅兵失败"
 change_sov.19.t:0 "红场大溃败"
 change_sov.19.d:0 "莫斯科的天空阴沉如铅，阅兵仪式尚未结束，前线便已崩溃。 \n 第16集团军在克林方向被德军装甲部队撕开缺口后迅速瓦解，通往莫斯科的最后一道屏障——伊斯特拉防线失守。而此时，红场上还在进行着凌乱的步兵方阵表演，士兵们高喊着口号，却没人听清他们喊得是什么；而电台中不断传来的‘请求支援’和‘我们被包围了’的求救信号更加重了天空的阴霾。\n 阅兵结束后不到六小时，德国装甲先头部队距离莫斯科仅剩25公里。通讯室内的电话响个不停，政委脸色惨白地走进会议室：‘同志，这不是演习……莫斯科真的要完了。’"
 change_sov.19.a:0 "完了，全完了"

 change_sov.20:0 "库尔斯克战役胜利结束"
 change_sov.20.t:0 "库尔斯克战役胜利结束"
 change_sov.20.d:0 "库尔斯克草原上硝烟未散，燃烧的德军坦克残骸在阳光下冒着黑烟。红军不仅挡住了德国装甲部队最猛烈的冲击，更在普罗霍罗夫卡地区给予了敌人毁灭性的打击。\n 部队开始转入全面反攻，奥廖尔和别尔哥罗德方向相继被突破，柏林第一次意识到：他们已无力再发动大规模攻势。这是苏维埃的钢铁意志对纳粹战争机器的决定性胜利"
 change_sov.20.a:0 "继续前进同志们！"

 change_sov.21:0 "库尔斯克战役失败"
 change_sov.21.t:0 "库尔斯克战役失败"
 change_sov.21.d:0 "我们低估了敌人的装甲突击能力。尽管投入了大量精锐装甲部队，但在敌人新式装甲战术与空中支援面前，我们的防线出现了致命裂痕。\n 战术失误、错误判断、后勤不足——一切问题都在这一刻爆发。库尔斯克没有成为我们的胜利之路，而是成为了鲜血与钢铁的坟场。"
 change_sov.21.a:0 "“我们的矛终究比不过敌人啊”"

 change_sov.23:0 "苏联在库尔斯克战役取胜"
 change_sov.23.t:0 "苏联在库尔斯克战役取胜"
 change_sov.23.d:0 "最高指挥部陷入沉默。前线报告称，联军主力装甲集群遭遇重创，各主力装甲部队减员近半。更令人震惊的是，红军不仅顶住了攻击，还迅速转入反攻。\n 情报部门估算，苏军在战役期间每天向库尔斯克方向运送超过800节车厢的物资，其战争潜力远超预期。这场战斗标志着联军失去了最后的战略主动权。"
 change_sov.23.a:0 "“该死的，苏联人现在怎么还有这么多坦克！”"

 change_sov.24:0 "苏联在库尔斯克战役失败"
 change_sov.24.t:0 "苏联在库尔斯克战役失败"
 change_sov.24.d:0 "收到前线战报后，最高指挥部紧绷的神经终于放松了下来。经过数日激战，红军的反击已被粉碎，大量的红军坦克被击毁在开阔地上，如同一片钢铁坟墓。\n 联军成功稳住阵线，并在部分区域发起局部反击。首领办公室里传来消息：“顽强的布尔什维克的神话终于破灭了。”\n 然而，没有人敢说这是一次彻底的胜利——因为代价实在太过沉重。"
 change_sov.24.a:0 "苏联人果然是强弩之末了"

 change_sov.25:0 "明斯克战役胜利"
 change_sov.25.t:0 "明斯克战役胜利"
 change_sov.25.d:0 "敌人曾试图以雷霆之势突破我军防线，但我们的战士用血肉之躯挡住了他们的铁蹄。在明斯克周边的密林与丘陵之间，他们付出了惨重代价却未能实现战略目标。\n 苏维埃的力量在这片土地上再次证明：即使是最猛烈的攻势，也无法动摇我们保卫祖国的决心。"
 change_sov.25.a:0 "敌人来势汹汹，但我岿然不动"

 change_sov.26:0 "明斯克战役失败"
 change_sov.26.t:0 "明斯克战役失败"
 change_sov.26.d:0 "尽管进行了顽强抵抗，敌人的机械化部队还是撕开了我们的防线。明斯克方向的多个防御阵地相继失守，前线陷入了混乱。\n 指挥部不得不下令撤退，以保存有生力量。这是我们最艰难的时刻之一——但也提醒我们，战争才刚刚开始。"
 change_sov.26.a:0 "“前线部队层层阻击，有序撤退！”"

 change_sov.27:0 "成功夺取明斯克"
 change_sov.27.t:0 "成功夺取明斯克"
 change_sov.27.d:0 "电报从东线传来：“明斯克已被攻克。”\n 尽管遭遇了激烈抵抗，我军最终还是占领了这座城市。街道上回荡着坦克履带碾过碎石的声音，曾经的红色旗帜被替换成了新的标志。\n 这是将是在东方迈出的重要一步。"
 change_sov.27.a:0 "“布尔什维克们，好戏才刚刚开始呢”"

 change_sov.28:0 "夺取明斯克失败"
 change_sov.28.t:0 "夺取明斯克失败"
 change_sov.28.d:0 "突破行动未能取得预期成果。敌军在明斯克地区层层阻击，我们的进攻受挫，损失不小。\n 然而，这并不意味着失败——这只是第一回合的较量。我们必须总结经验，等待下一次机会。"
 change_sov.28.a:0 "可恶！"

 change_sov.29:0 "准备库尔斯克战役"
 change_sov.29.t:0 "苏联在库尔斯克地区大规模集结"
 change_sov.29.d:0 "地图上的红色箭头指向库尔斯克突出部，数十个步兵师、机械化军和坦克集团军正悄然进入阵地。\n 工厂昼夜不停地生产弹药与装备，铁路线上挤满了开往前线的列车。朱可夫元帅站在作战室中央，目光坚定地说道：“这不是一场普通的防御战，我们要在这里给敌人致命一击。”\n 敌军也在集结——但这次，我们将先发制人。"
 change_sov.29.a:0 "“好吧，让我们看看布尔什维克有什么本事”"

 change_sov.30:0 "准备明斯克战役"
 change_sov.30.t:0 "明斯克方向遭受阻力"
 change_sov.30.d:0 "情报显示，敌军正向明斯克方向集结大量兵力，意图发起一场大规模攻势。\n 我们的侦察部队已在边境地带发现敌军调动迹象。战云密布，局势紧张，指挥部已下达命令：必须守住这一战略要地，哪怕付出巨大代价。\n 这将是战争初期的一次关键考验——我们将在这里，首次直面敌人的真正实力。"
 change_sov.30.a:0 "碾碎他们！"

 change_sov.31:0 "准备进攻基辅"
 change_sov.31.t:0 "准备进攻基辅"
 change_sov.31.d:0 "地图上的红色箭头指向第聂伯河下游，我军正沿着多个方向集结兵力。\n 基辅不仅是乌克兰的政治中心，更是通往南方资源区的关键门户。我们将在这里展开一场决定性的战役。"
 change_sov.31.a:0 "“布尔什维克们，这一拳你要怎么接住呢？”"

 change_sov.32:0 "基辅保卫战胜利"
 change_sov.32.t:0 "基辅保卫战胜利"
 change_sov.32.d:0 "敌人曾试图以优势兵力突破我们的防线，但基辅的每一块砖石都成为了抵抗的象征。\n 在第聂伯河畔，在森林与丘陵之间，红军顶住了猛烈冲击，将敌人的攻势瓦解于无形。\n 这不仅是一场战术胜利，更是一次对侵略者的有力回击——我们不会放弃一寸土地。"
 change_sov.32.a:0 "敌人不过如此"

 change_sov.33:0 "基辅保卫战失败"
 change_sov.33.t:0 "基辅保卫战失败"
 change_sov.33.d:0 "尽管进行了顽强抵抗，敌人还是撕开了我们的防线。基辅已落入敌手，前线部队被迫向东部撤退。\n 情报显示，敌军利用了多点突破战术，使我们难以集中力量反击。这是沉重的一课——但也提醒我们：战争才刚刚开始。\n 我们会夺回一切，但现在，必须保存力量，等待时机。"
 change_sov.33.a:0 "“敌人强大，切勿心急！”"

 change_sov.34:0 "成功攻破基辅"
 change_sov.34.t:0 "成功攻破基辅"
 change_sov.34.d:0 "电报传来：“基辅已被攻克。”\n 尽管遭遇激烈抵抗，我军最终还是占领了这座城市。街道上回荡着铁蹄声，曾经飘扬的红旗被替换成了新的标志。\n 这是我们在东方推进的重要一步。当然，从这里向东，还有无数城市在等待我们去征服。但不管怎么说，我们已经："
 change_sov.34.a:0 "又拿下了一城"

 change_sov.35:0 "夺取基辅失败"
 change_sov.35.t:0 "夺取基辅失败"
 change_sov.35.d:0 "原以为可以迅速拿下基辅，但敌军的抵抗远比预想中顽强。\n 苏联军队在第聂伯河沿岸设下重重防线，每一寸土地都经过血战。我们的进攻受挫，损失不小。\n 然而这并不意味着失败——这只是第二回合的较量。我们必须总结经验，等待下一次机会。\n 下一次，我们将更加坚决。"
 change_sov.35.a:0 "“有点实力，布尔什维克们”"

 change_sov.36:0 "莫斯科战役"
 change_sov.36.t:0 "拿下莫斯科！"
 change_sov.36.d:0 "电报中传来前线指挥官的命令：“目标——莫斯科。”\n 这不仅是地理意义上的首都，更是布尔什维克政权的心脏。敌人已经退无可退，我们则已积蓄足够力量。\n 雪原之上，铁骑列阵，寒风呼啸着吹过战旗。这是决定性的时刻，通往胜利的最后一战即将开始。"
 change_sov.36.a:0 "“敌人的心脏已经门户大开！”"

 change_sov.37:0 "苏联守住莫斯科"
 change_sov.37.t:0 "莫斯科战役胜利"
 change_sov.37.d:0 "莫斯科没有陷落。在零下三十度的严寒中，红军用血肉之躯挡住了敌人的最后一击。\n 敌军疲惫不堪，补给断裂，士气崩溃。我们的战士不仅守住了首都，更守护了祖国的尊严。\n 这场胜利将被载入史册——它标志着侵略者的狂妄终将被人民的力量粉碎。"
 change_sov.37.a:0 "苏维埃不会消亡！"

 change_sov.38:0 "莫斯科沦陷"
 change_sov.38.t:0 "莫斯科沦陷"
 change_sov.38.d:0 "电报中断，通讯失联。敌人突破了最后的防线，莫斯科……陷落了。\n 红场上不再有红旗飘扬，取而代之的是陌生的旗帜与沉重的脚步声。国家中枢失守，人民陷入恐慌......"
 change_sov.38.a:0 "我们已经没有机会了"

 change_sov.39:0 "成功攻破莫斯科"
 change_sov.39.t:0 "成功攻破莫斯科"
 change_sov.39.d:0 "电报传来：“莫斯科已被攻克。”\n 尽管遭遇了前所未有的抵抗，敌军最终还是被逐出这座城市。街道上回荡着胜利的号角，曾经飘扬的红旗被替换成了新的标志。\n 敌人的抵抗很快将被我们全部歼灭！"
 change_sov.39.a:0 "布尔什维克的老巢是我们的了"

 change_sov.40:0 "苏联守住了莫斯科"
 change_sov.40.t:0 "进攻莫斯科失败"
 change_sov.40.d:0 "电报中写道：“攻势受挫，部队被迫后撤。”\n 我们曾以为可以一鼓作气拿下这座城市，但现实比想象中更加残酷。\n 寒冷、补给不足、敌军的顽强抵抗——一切都超出了预期。莫斯科依旧矗立，而我们只能在雪地中重整队伍。\n 这不是终点，但确实是一个沉重的教训：东方的对手，远比我们想象的强大。"
 change_sov.40.a:0 "“我们的补给线确实被拉的太长了”"

 change_sov.41:0 "斯大林格勒战役"
 change_sov.41.t:0 "进攻斯大林格勒"
 change_sov.41.d:0 "电报传来前线指挥官的命令：“目标——斯大林格勒。”\n 这不仅是一座城市，更是通往高加索油田与伏尔加粮仓的关键门户。\n 情报显示，敌人已在此地集结重兵，但我们也做好了准备。巷战即将开始，每一条街道、每一座建筑都将成为争夺的焦点。\n 谁能控制这座城市，谁就将掌握这场战争的主动权。"
 change_sov.41.a:0 "“是时候对布尔什维克进行一次重创了”"

 change_sov.42:0 "苏联守住斯大林格勒"
 change_sov.42.t:0 "斯大林格勒战役胜利"
 change_sov.42.d:0 "斯大林格勒没有陷落。在这片焦土之上，我们的士兵用鲜血和生命书写了不朽的篇章。\n 每一栋燃烧的房屋、每一条被炸毁的街道，都是我们誓死抵抗的见证。\n 敌人曾以为可以迅速拿下这座城市，但他们低估了红军的意志，也低估了这片土地的力量。\n 我们不仅守住了斯大林格勒，更让侵略者明白：他们已经走到了命运的尽头。"
 change_sov.42.a:0 "我们定将取得最终胜利！"

 change_sov.43:0 "斯大林格勒失守"
 change_sov.43.t:0 "斯大林格勒失守"
 change_sov.43.d:0 "电报中断，通讯失联。敌人突破了最后的防线，斯大林格勒……陷落了。\n 曾经沸腾着战斗呼喊的废墟，如今只剩残垣断壁与沉寂的硝烟。\n 这是一次沉重的打击，但我们不会屈服。总参谋部已经开始制定新的作战计划，只要还有一名战士站立，我们就不会放弃战斗。\n 这只是暂时的失利，而不是终点。"
 change_sov.43.a:0 "还没有结束！"

 change_sov.44:0 "成功夺取斯大林格勒"
 change_sov.44.t:0 "成功夺取斯大林格勒"
 change_sov.44.d:0 "电报传来：“斯大林格勒已被攻克。”\n 尽管遭遇了前所未有的巷战阻力，敌军最终还是被逐出这座城市。\n 街道上回荡着胜利的号角，曾经飘扬的红旗被替换成了新的标志。\n 这是我们推进东方的重要一步——但这并不意味着终结。\n 从这里向南，通往资源腹地的大门已经打开。"
 change_sov.44.a:0 "高加索的门户已经大开"

 change_sov.45:0 "夺取斯大林格勒失败"
 change_sov.45.t:0 "夺取斯大林格勒失败"
 change_sov.45.d:0 "电报中写道：“攻势受挫，部队伤亡惨重。”\n 我们曾以为可以凭借优势兵力快速拿下这座城市，但现实比想象中更加残酷。\n 巷战变成了消耗战，每一栋建筑都成为敌人的堡垒。我们在战术与士气上都付出了沉重代价。\n 这不是终点，但确实是一个沉重的教训：斯大林格勒不是一座普通的城，而是一座炼狱。\n 下一次，我们必须更加谨慎。"
 change_sov.45.a:0 "该死！"

 change_sov.46:0 "进攻列宁格勒"
 change_sov.46.t:0 "进攻列宁格勒"
 change_sov.46.d:0 "电报传来命令：“目标——列宁格勒。”\n 这座城市不仅是布尔什维克的精神象征，更是连接北欧与东方的重要枢纽。\n 情报显示，敌人已在此地布下重重防线，但他们无法阻止我们前进的步伐。\n 冬季将至，寒风呼啸，但我们的意志比冰雪更坚定。是时候让这座城市见证历史的转折了。"
 change_sov.46.a:0 "“拿下他们的‘圣城’”"

 change_sov.47:0 "苏联守住列宁格勒"
 change_sov.47.t:0 "列宁格勒保卫战胜利"
 change_sov.47.d:0 "一年的寒冬，一年的血火，一年的坚守。\n 列宁格勒没有倒下。在这座被封锁的城市里，每一个面包配给都意味着生存的希望，每一发炮弹都承载着不屈的信念。\n 无论是士兵还是工人，老人还是孩子，所有人都用生命守护着这片土地。\n 敌人曾以为饥饿和严寒会让我们屈服，但他们错了——我们以钢铁般的意志击碎了他们的幻想。\n 胜利属于所有苏维埃人民！"
 change_sov.47.a:0 "胜利属于所有苏维埃人民！"

 change_sov.48:0 "列宁格勒失守"
 change_sov.48.t:0 "列宁格勒失守"
 change_sov.48.d:0 "电台沉默了，红旗不再飘扬，敌人踏入了这座曾经的革命摇篮。\n 曾经辉煌的冬宫如今只剩残垣断壁，涅瓦河畔的歌声已被枪声取代。\n 这是一次沉重的打击，但我们不会屈服。只要还有一名战士站立，我们就不会放弃战斗。\n 历史告诉我们：一座城市的陷落，不代表一个民族的终结。\n 反击即将开始，列宁格勒终将回归。"
 change_sov.48.a:0 "可恶！"

 change_sov.49:0 "成功夺取列宁格勒"
 change_sov.49.t:0 "成功夺取列宁格勒"
 change_sov.49.d:0 "尽管遭遇了前所未有的抵抗，敌军最终还是被逐出这座城市。\n 街道上回荡着胜利的号角，曾经飘扬的红旗被替换成了新的标志。\n 这是我们推进东方的重要一步——但这并不意味着终结。\n 自此，苏联北境防线的门户已经大开。"
 change_sov.49.a:0 "伟大的胜利！"

 change_sov.50:0 "进攻列宁格勒失败"
 change_sov.50.t:0 "进攻列宁格勒失败"
 change_sov.50.d:0 "我们曾以为可以凭借优势兵力迅速拿下这座城市，但现实比想象中更加残酷。\n 饥饿、寒冷、巷战、敌人的顽强抵抗——一切都超出了预期。\n 列宁格勒不是一座普通的城，它像一座冰封的堡垒，拒绝一切外来者。\n 或许……"
 change_sov.50.a:0 "这座城真的有‘神迹’？"

 change_sov.51:0 "进攻巴库"
 change_sov.51.t:0 "进攻巴库"
 change_sov.51.d:0 "巴库————苏联的生命线就在这里流淌 \n 这座城市不仅是高加索的心脏，更是布尔什维克政权赖以生存的能源动脉。\n 从伊朗方向突破后，我们已进入战略纵深地带。只要拿下巴库，红军的钢铁洪流将失去燃料，他们的战争机器将陷入停滞。\n 决战即将开始，我们将用铁与火切断他们的血管。"
 change_sov.51.a:0 "“斩断他们的血管”"

 change_sov.52:0 "苏联守住巴库"
 change_sov.52.t:0 "巴库尚未沦陷"
 change_sov.52.d:0 "巴库仍然在我们手中，但敌人已经逼近城外。\n 在黑海与里海之间，在山岭与油田之间，我们的战士与工人并肩作战，誓死保卫这片土地。\n 每一口油井都是一座堡垒，每一条输油管道都是我们的防线。\n 敌人想让我们断血而亡，但我们早已未雨绸缪——北上的列车日夜不停，石油正被源源不断地送往乌拉尔。\n 我们不会让他们得逞。"
 change_sov.52.a:0 "“切勿骄傲，敌人不会善罢甘休”"

 change_sov.53:0 "巴库沦陷"
 change_sov.53.t:0 "巴库沦陷"
 change_sov.53.d:0 "电台沉默，火焰冲天，敌军踏入了这座曾经的工业圣殿。\n 曾经轰鸣不息的炼油厂如今只剩残骸，曾经奔腾的输油管已被切断。\n 这是一次沉重的打击——敌人不仅夺走了我们的资源，更企图掐断我们的未来。\n 然而，他们低估了我们的决心。我们在北方建立了新的储备，在漫长的运输线上，每一滴石油都将成为反击的火种。\n 高加索一览无余……"
 change_sov.53.a:0 "但战争远未结束。"

 change_sov.54:0 "成功夺取巴库"
 change_sov.54.t:0 "成功夺取巴库"
 change_sov.54.d:0 "尽管遭遇了激烈抵抗，敌军最终还是被逐出这座城市。\n 街道上回荡着胜利的号角，曾经飘扬的红旗被替换成了新的标志。\n 更重要的是，我们控制了这片油田。这不仅意味着一场战役的胜利，更是一场战略意义上的转折。\n 苏联的战争机器依赖这里的石油，而现在，它将逐渐陷入停滞。\n 工业巨兽失去了血液————"
 change_sov.54.a:0 "还能坚持多久？"

 change_sov.55:0 "突袭巴库失败"
 change_sov.55.t:0 "突袭巴库失败"
 change_sov.55.d:0 "攻势受挫，部队被迫撤退。\n 我们曾希望通过一次迅猛突击迅速拿下这座城市，但现实比想象中更加残酷。\n 敌人在北方建立了新的储油体系，南方的油田也设置了重重障碍。即便我们未能完全占领巴库，他们依然能维持战争所需。\n 更糟的是，他们在乌拉尔和伏尔加地区的储备已经开始运转。\n 这不是终点，但确实是一个沉重的教训：苏联的战争机器远比我们想象的要坚韧。"
 change_sov.55.a:0 "好吧……至少我们尝试过"

 change_sov.56:0 "第一阶段进攻计划成功"
 change_sov.56.t:0 "第一阶段进攻计划成功"
 change_sov.56.d:0 "我们前线部队在推进过程中虽然受到了一些阻碍，但依然迅速地突破了敌军的防线，成功地在一个月之内达成了战略目标。 \n 前线将士士气高昂，随时准备再次出击。"
 change_sov.56.a:0 "干的漂亮小伙子们"

 change_sov.57:0 "第一阶段进攻计划失败"
 change_sov.57.t:0 "第一阶段进攻计划失败"
 change_sov.57.d:0 "一个月过去了，我们预想的闪电战计划并没有成功，前线部队受到了远超预期的阻碍。苏军的实力远超我们之前交手所有敌人。我们必须总结经验教训，下一次我们会做的更好。 "
 change_sov.57.a:0 "切勿心急"

 change_sov.58:0 "第二阶段进攻计划成功"
 change_sov.58.t:0 "第二阶段进攻计划成功"
 change_sov.58.d:0 "终于，在经过数月的鏖战，苏联的精华区基本落入我们手中。苏联现在已经被我们逼入绝路了！"
 change_sov.58.a:0 "是时候开个香槟了"

 change_sov.59:0 "第二阶段进攻计划失败"
 change_sov.59.t:0 "第二阶段进攻计划失败"
 change_sov.59.d:0 "苏联设置了大量的防线，并且依靠着广阔的战略纵深，严重迟滞了我们的进攻计划。随着冬季的到来，第二阶段进攻计划只能草草收场。我们快速灭亡苏联的计划彻底泡汤了。"
 change_sov.59.a:0 "真是块难啃的骨头"

 change_sov.60:0 "第三阶段进攻计划成功"
 change_sov.60.t:0 "第三阶段进攻计划成功"
 change_sov.60.d:0 "在失去核心精华区后，大批苏联军队撤退到乌拉尔山脉集结，并依托地形在顽强抵抗。但这一切不过是螳臂当车罢了。如今我们的军队已经打开了进入乌拉尔山脉的门户，敌人最后的防线也已被洞穿，已经没有什么能够阻挡我们的军队了！"
 change_sov.60.a:0 "苏联的末日来了"

 change_sov.61:0 "第三阶段进攻计划失败"
 change_sov.61.t:0 "第三阶段进攻计划失败"
 change_sov.61.d:0 "大批苏联红军在乌拉尔山脉建立了根据地，并依托复杂的地形对我们进行了阻击。敌人的严防死守和我们的补给线过长的问题彻底成为了压死骆驼的最后一根稻草。我们的军队每向前进攻一里都会蒙受巨大损失，并且即使突破成功也会被敌人反打回去。前线部队士气开始动摇了。"
 change_sov.61.a:0 "苏联的韧性真是恐怖"

 change_sov.62:0 "进军蒙古"
 change_sov.62.t:0 "进军蒙古"
 change_sov.62.d:0 "在我们与英国结盟之后，曾经的盟友选择了拒绝追随我们，选择了保持中立。现如今，南方的中国彻底倒向了德国，所谓的中立缓冲区变成了极其不稳定的因素。为了拓宽远东的纵深，削减这些不稳定的因素，我们得先下手为强。"
 change_sov.62.a:0 "没错，先下手为强！"

 change_sov.63:0 "发兵外蒙古"
 change_sov.63.t:0 "发兵外蒙古"
 change_sov.63.d:0 "苏联人居然向外蒙古发兵了！好哇，他过江，我们也过江！我们也立刻发兵进攻外蒙古争夺地盘，来扩大我们与苏联的缓冲区，绝对不要和苏联军队发生武力冲突。"
 change_sov.63.a:0 "该动起来了，小伙子们！"
 change_sov.63.b:0 "。。。算了，该死的苏联人！"

 change_sov.64:0 "中华民国进军蒙古"
 change_sov.64.t:0 "中华民国进军蒙古"
 change_sov.64.d:0 "在我们向蒙古进军后的短短2个小时，中华民国军队也开入了蒙古境内和我们争夺地盘。我们是否需要提醒一下士兵们要避免武力冲突呢？"
 change_sov.64.a:0 "就这么做吧。但核心城市一定不能让给他们。"
 change_sov.64.b:0 "给你脸了！"

 change_sov.65:0 "远东防御"
 change_sov.65.t:0 "远东防御建设完成"
 change_sov.65.d:0 "在花费了不少时间和精力，我们的远东防线终于竣工了。"
 change_sov.65.a:0 "很好，不要放松警惕"











 change_hun.1:0 "奥匈帝国希望与我们合作"
 change_hun.1.t:0 "奥匈帝国希望与我们合作"
 change_hun.1.d:0 "在上一次大战的失利使得我们丢失了大量领土，而奥匈帝国甚至解体消亡。现在奥托已经重登王位，并决心收复帝国的法理领土。因此他们希望我们能帮他们一把，事成之后，巴尔干对半分"
 change_hun.1.a:0 "当然"
 change_hun.1.b:0 "自个玩去吧"

 change_hun.2:0 "拒绝"
 change_hun.2.t:0 "他们拒绝了我们的提案"
 change_hun.2.d:0 "看来我们没有说动他们，只能靠我们自己了。"
 change_hun.2.b:0 "道不同不相为谋"

 change_hun.3:0 "奥匈帝国要求归还他们的土地"
 change_hun.3.t:0 "奥匈帝国要求归还他们的土地"
 change_hun.3.d:0 "奥匈帝国要求归还他们的土地，当然他们只是这么说说，具体怎么选择还得看我们"
 change_hun.3.a:0 "不给"
 change_hun.3.b:0 "那就还给他们吧"

 change_prc.1:0 "领导地位"
 change_prc.1.t:0 "确定毛泽东的领导地位"
 change_prc.1.d:0 "工农革命的火苗能从残酷的长征中幸存下来，离不开毛泽东同志的正确领导。中国的革命只有在毛泽东同志的正确领导之下才能走向成功。"
  
 change_prc.2:0 "中共寻求援助"
 change_prc.2.t:0 "中共寻求援助"
 change_prc.2.d:0 "中共的同志于今日向莫斯科方面寻求援助来恢复在长征中的损失。斯大林同志表示将竭尽全力为他们提供帮助。"
 change_prc.2.a:0 "这是国际主义，同志"

 change_prc.3:0 "苏联援助"
 change_prc.3.t:0 "苏联将竭尽所能为我方提供援助"
 change_prc.3.d:0 "莫斯科方面回应了我们的请求，他们将会为我们提供大量武器和资源，并为我们建设一定的工业基础"
 change_prc.3.a:0 "同志，真是雪中送碳了"

 change_prc.4:0 "爱国华侨的援助"
 change_prc.4.t:0 "爱国华侨的援助"
 change_prc.4.d:0 "爱国华侨们共同筹集了大量武器和资源来帮助我们恢复元气。"
 change_prc.4.a:0 "真是帮大忙了"

 change_prc.5:0 "快速工业化的弊端"
 change_prc.5.t:0 "快速工业化的弊端显现"
 change_prc.5.d:0 "一系列强制措施让我们快速的步入了工业化，然而，代价是什么呢？"
 change_prc.5.a:0 "代价？......"

 change_prc.6:0 "国民政府宣布投降"
 change_prc.6.t:0 "国民政府宣布投降"
 change_prc.6.d:0 "在人民解放军势如破竹的攻势之下，反动势力的防线形同虚设，如同决堤的大坝般一溃千里。现在，反动势力的大势已去，他们的将领表示愿意率领部下投降，并摧毁反动政府的内部使战争结束。"
 change_prc.6.a:0 "欢迎加入我军"
 change_prc.6.b:0 "不需要他们的帮助我们照样摧毁反动势力"

 change_prc.7:0 "对日本的战略"
 change_prc.7.t:0 "对日本的战略"
 change_prc.7.d:0 "现在我们已经不同往日了，在经过这几年的修养生息之后，我们的实力已经超过了只能龟缩在本土的日本了。曾经的他们高高在上，不可一世，随意践踏我们祖国的尊严与民众的生命。现在，该我们来决定他们的命运了"
 change_prc.7.a:0 "让他们主动臣服"
 change_prc.7.b:0 "扶持日共从内部击垮他们"

 change_prc.8:0 "中国要求我们臣服"
 change_prc.8.t:0 "中国要求我们臣服"
 change_prc.8.d:0 "中国人要求我们俯首称臣，否则便会动用武力来让我们屈服。"
 change_prc.8.a:0 "我就不行你能登陆的上来"
 change_prc.8.b:0 "投降喵"

 change_prc.9:0 "日本拒绝臣服"
 change_prc.9.t:0 "日本拒绝臣服"
 change_prc.9.d:0 "日本仰仗自己有着强大的海军，认为我们无法威胁到他的本土，因此拒绝了我方的要求。"
 change_prc.9.a:0 "那就来试试吧"
 change_prc.9.b:0 "确实登陆不了，但是我们可以从内部击溃他们"

 change_prc.10:0 "中共支持共产主义者"
 change_prc.10.t:0 "中共支持共产主义者"
 change_prc.10.d:0 "最近国内工团分子活动越来越频繁，甚至准备组织罢工这种严重危害国家安全的行为。好在我们的特高科及时发现并摧毁了工团分子的据点。特高科在清理他们据点时，发现这一切都是中共在秘密支持他们的活动。"
 change_prc_10.a:0 "居然是境外势力在搞鬼吗"
 change_prc.10.b:0 "md忍不了了，直接地毯式搜查把他们全突突了"

 change_prc.11:0 "红色幽灵活动加剧"
 change_prc.11.t:0 "红色幽灵活动加剧"
 change_prc.11.d:0 "国内的“红灾”越来越严重了，事态似乎向着无法控制的方向在不断发展着。也许我们在事态无法挽回之前就重拳出击？"
 change_prc_11.a:0 "问题不大？！"

 change_prc.12:0 "工农起义！"
 change_prc.12.t:0 "工农起义！"
 change_prc.12.d:0 "同志们，一个让国家摆脱军国主义和资本家的机会正摆在我们眼前！是时候摧毁这压在人民身上的枷锁了！我们并不是孤立无援，中共的同志将在战斗中帮助我们。我们将一同点燃这燎原的星火！"
 change_prc_12.a:0 "为了自由！"

 change_prc.13:0 "日本屈服"
 change_prc.13.t:0 "日本屈服"
 change_prc.13.d:0 "日本政府认清了形式，选择向我们臣服。"
 change_prc_13.a:0 "很好"


 change_chi.1:0 "委员长遇害？！"
 change_chi.1.t:0 "委员长遇害？！"
 change_chi.1.d:0 "我们敬爱的委员长、德高望重的黄埔军校的校长在昨日处理完职务之后，不知抽了什么风，执意要试试前段时间他人送的敞篷车。委员长的秘书和警卫好言相劝，奈何就是不听，非要去试驾，并说什么这是要找回青春的感觉。结果，在到达宅邸时，被一名潜伏已久的刺客用手枪射中了三发胸膛，甚至差点脑洞大开。随后刺客被当场击毙，而委员长也当场昏迷。尽管随行的护卫第一时间将委员长送往了医院，但情况依然不然乐观，委员长的家属已经在思考后事了。"
 change_chi.1.a:0 "委员长你似的好惨啊"

 change_chi.2:0 "牢蒋遇害？！"
 change_chi.2.t:0 "牢蒋遇害？！"
 change_chi.2.d:0 "昨日，我们的特务传来了消息，蒋介石在返回宅邸时遭到刺客袭击，连中多发手枪弹，尽管及时送往医院抢救，但情况不容乐观。虽然我方和国民党的矛盾依然深厚，但毛泽东同志认为我们应当派人去慰问表示一番，一来表示这并非我方谋划的，另一方面也借此机会谋得一个喘息的机会。至于人选，如此危险的任务毛泽东同志决定亲自前往"
 change_chi.2.a:0 "让经验丰富的老兵当护卫，随时准备好接应部队，并通知我们的特务时刻保持警惕"
 change_chi.2.b:0 "不行，太危险了，我们不能让毛泽东同志以身犯险"

 change_chi.3:0 "得胜将亲自前来吊唁？！"
 change_chi.3.t:0 "得胜将亲自前来吊唁？！"
 change_chi.3.d:0 "中共方面在今日于我方取得联系，表示对委员长遇害一事深感惋惜，并斥责了筹划刺杀事件的主谋。同时中共方面表示得胜欲拜访探望委员长，因此来询问我方态度。"
 change_chi.3.a:0 "亲自前来？！真是艺高人胆大。那就来吧，我方将保证不会重蹈委员长的覆辙"
 change_chi.3.b:0 "这群家伙肯定不安好心，别来了，在我这出事了麻烦可就大了"

 change_chi.4:0 "国民党谢绝了我方好意"
 change_chi.4.t:0 "国民党谢绝了我方好意"
 change_chi.4.d:0 "南京方面于今日晨间回复：“我方感谢贵军的好意。然委员长头七未过，刺客幕后主使尚未发现，未避免重蹈之覆辙引起巨大误会，因此我方不建议贵军前来吊唁。”也好，这样也不用担心在国统区毛泽东同志的安全问题了。"
 change_chi.4.a:0 "行吧，那我们就吃瓜了。"

 change_chi.5:0 "委员长复原了？！"
 change_chi.5.t:0 "委员长复原了？！"
 change_chi.5.d:0 "在昨日晚间，警卫员进入委员长病房时，竟然发现委员长奇迹般的站在病床前，褪下了病人的衣服，如同没事人一般站在那里打理自己的衣服。“委员长，您...您康复了？！”“哦，小李啊，是啊，我已经痊愈了。毕竟我可是校长，比体育生还高几个等级。”委员长痊愈的消息顿时引爆了南京城，各大报社都加急刊登了这一劲爆消息。"
 change_chi.5.a:0 "我就说扣1有用吧"

 change_chi.6:0 "委员长重新上位"
 change_chi.6.t:0 "委员长重新上位"
 change_chi.6.d:0 "既然委员长已经打赢了复活赛，那么时候回到他的位置上了。不过据秘书透露，委员长这两天在一个人独处的时候总是神神叨叨的一直在念叨着什么上一世退守小岛尽显英雄本色什么的，这一世我应该怎么怎么样。在我们背着委员长和医生讨论了之后，一致认为这是后遗症罢了，毕竟正常人胸口挨了3发子弹就算不死也得丢半条命吧，而我们的委员长就更没事人一样子弹取出来第二天伤口就愈合了，还活蹦乱跳的，没点后遗症说不过去。"
 change_chi.6.a:0 "可惜了，请客的桌子都安排好了，差点就能坐小孩那桌了"

 change_chi.7:0 "奇怪的牢蒋"
 change_chi.7.t:0 "奇怪的牢蒋"
 change_chi.7.d:0 "牢蒋肘赢复活赛之后就和变了个人似的，天天与得胜同志畅谈当今世界局势，而且经常一聊便是一整天。得胜同志也对牢蒋的思想觉悟感到诧异。牢蒋表示之前那是还小，不懂事，在鬼门关走一趟之后想开了，决定要为民族复兴做点什么，希望与我们合作，共同恢复中华的统一。并且还表示如果出现分歧，也绝对不会干涉我们的自由。得胜同志表示牢蒋不像演的，可以相信"
 change_chi.7.a:0 "行吧，那就再信他们一次"

 change_chi.8:0 "中共愿意合作"
 change_chi.8.t:0 "中共愿意合作"
 change_chi.8.d:0 "捏妈妈滴，委员长是拿到传说中的催眠app？这都能说服他们。委员长不会是请神上身了吧。"
 change_chi.8.a:0 "合作愉快"

 change_chi.9:0 "加入世界大战"
 change_chi.9.t:0 "加入世界大战"
 change_chi.9.d:0 "第二次世界大战已经爆发，国内也完成了统一，是时候去追寻更大的理想了，该选择站队那一方了。"
 change_chi.9.a:0 "与德国人并肩作战，收回我们的领土"
 change_chi.9.a:0 "与英国人并肩作战，收回我们的领土"

 change_usa.1:0 "巨人觉醒"
 change_usa.1.t:0 "巨人觉醒"
 change_usa.1.d:0 "世界局势已经不再安定，欧洲大陆上的威胁已经日趋严重，我们不能再奉行孤立政策了。我们将彻底激发我国的工业潜力，让世界在雄鹰的双翼下颤抖"
 change_usa.1.a:0 "巨人觉醒"

 change_usa.2:0 "对墨西哥的裁决方案"
 change_usa.2.t:0 "对墨西哥的裁决方案"
 change_usa.2.d:0 "现在，是时候对墨西哥的命运进行裁决了。麦克阿瑟将军建议他率军前往边境对墨西哥政府施压，要求向我们臣服；而外交官建议先进行谈判，要求墨西哥交出资源开采权，失去了资源带来的效益，墨西哥靠自己是不可能对我们产生威胁的。当然，我们也可以采取更极端的手段：直接入侵墨西哥。"
 change_usa.2.a:0 "要求墨西哥展示忠诚"
 change_usa.2.b:0 "没收墨西哥的资源开采权"
 change_usa.2.c:0 "向全世界展示美利坚的力量"

 change_usa.3:0 "美国要求我们的忠诚"
 change_usa.3.t:0 "美国要求我们的忠诚"
 change_usa.3.d:0 "美国向我们发送了通牒：要求我国展示对他们的忠诚度。也许我们还有斡旋的余地，美国无非就是觊觎我们的石油和矿产资源，如果我们放弃资源开采权，那么美国很有可能会承认我们的忠诚。"
 change_usa.3.a:0 "进行政府更替以向美国表达衷心"
 change_usa.3.b:0 "和美国谈判以资源开采权换取保障"
 change_usa.3.c:0 "绝不和帝国主义妥协！"

 change_usa.4:0 "[Root.GetNameDefCap]将进行政府更迭"
 change_usa.4.t:0 "[Root.GetNameDefCap]将进行政府更迭"
 change_usa.4.d:0 "[Root.GetNameDefCap]方面选择进行政府更迭来表示他们的衷心，在与新政府的谈判中，新的[Root.GetNameDefCap]政府愿意将国内的资源开采权交付给我们。"
 change_usa.4.a:0 "算他们识相"

 change_usa.5:0 "墨西哥希望以资源换取保障"
 change_usa.5.t:0 "墨西哥希望以资源换取保障"
 change_usa.5.d:0 "墨西哥表示国内问题比较复杂，贸然进行政府更迭会造成局势动荡，甚至导致其他势力乘虚而入。出于美国的利益考虑，他们希望以国内的资源换取我们的保护。"
 change_usa.5.a:0 "就这样吧"
 change_usa.5.b:0 "是不是听不懂人话？"

 change_usa.6:0 "最后通牒"
 change_usa.6.t:0 "最后通牒"
 change_usa.6.d:0 "美国拒绝了我们的提案，并下达了最后通牒，要求我们实现美国的要求，否则将对我们采取行动"
 change_usa.6.a:0 "好吧。。。"
 change_usa.6.b:0 "一味的妥协只会让我们陷入万丈深渊"

 change_usa.7:0 "墨西哥拒绝我方提案"
 change_usa.7.t:0 "墨西哥拒绝我方提案"
 change_usa.7.d:0 "墨西哥严词拒绝了我方的要求，并表示不会对帝国主义进行任何妥协。"
 change_usa.7.a:0 "看来他们只会服从于武力了"

 change_usa.8:0 "美国要求资源开采权"
 change_usa.8.t:0 "美国要求资源开采权"
 change_usa.8.d:0 "美国向我国要求境内所有资源的开采权，并希望我们别不识好歹，用资源换取和平是很划算的事。"
 change_usa.8.a:0 "行吧。。。"
 change_usa.8.b:0 "我们不会向帝国主义低头！"

 change_usa.9:0 "美国要求政府更迭"
 change_usa.9.t:0 "美国要求政府更迭"
 change_usa.9.d:0 "由于我们不断的与同盟国进行资源贸易的行为严重阻碍到了协约国的战略布局，美国向我们下达了最后通牒要求进行政府更迭并且上交资源开采权。如果我们不听从他们，那么他们将会派兵让我们服从。"
 change_usa.9.a:0 "好吧好吧。。。"
 change_usa.9.b:0 "我们不会向帝国主义低头！"

 change_usa.10:0 "委内瑞拉拒绝"
 change_usa.10.t:0 "委内瑞拉拒绝提案"
 change_usa.10.d:0 "委内瑞拉拒绝了我方提案，看来有小孩缺乏管教了。"
 change_usa.10.a:0 "呵"

 change_usa.11:0 "盟友引入我国橡胶"
 change_usa.11.t:0 "盟友引入我国殖民地橡胶"
 change_usa.11.d:0 "盟友引入我国殖民地橡胶，这会为我们带来不小的收益"
 change_usa.11.a:0 "cool"

 change_usa.13:0 "巴拿马的命运"
 change_usa.13.t:0 "巴拿马的命运"
 change_usa.13.d:0 "现在，是时候决定巴拿马的命运了。。。"
 change_usa.13.a:0 "扶持一个傀儡政府"
 change_usa.13.b:0 "直接并入巴拿马自治领"



 change_mex.0:0 "更新日志"
 change_mex.0.t:0 "更新日志"
 change_mex.0.d:0 "§R2026/08/02§! \n1.重写了协约国机制：不再直接获取联合民族精神，需消耗政治点数逐步获取 \n2.补全了战争动员的惩罚机制 \n3.修复了战争动员中决议闪烁的 bug \n4.优化了一些决议的展示条件，避免同一时间大量堆积不美观 \n \n 在最后，如果有什么§R好点子§!或者§R愿意帮忙§!都可以在§R创意工坊留言§! "
 change_mex.0.a:0 "已阅"

 change_mex.1:0 "希望我们加入拉丁同盟"
 

 change_chi_third_empire.1.t: "黑金喷涌"
 change_chi_third_empire.1.d: "玉门的钻机终于打穿了地层，黑色的原油裹着气泡喷涌而出，工人们在油污中欢呼拥抱。紧接着，独山子的油井也传来捷报。西北荒原下沉睡亿万年的黑金，开始为帝国流淌——燃料的枷锁，从今天起要松动了。"
 change_chi_third_empire.1.a: "举国欢腾！"
 change_chi_third_empire.2.t: "柏林的贺电与提议"
 change_chi_third_empire.2.d: "中国发现大油田的消息传遍世界。柏林发来贺电，同时提出一个建议：德国愿意提供技术与设备，与中国共同开采这些油田——作为交换，中国将分享一处油田的开采权益。"
 change_chi_third_empire.2.a: "向中国提议共同开采"
 change_chi_third_empire.3.t: "最后通牒"
 change_chi_third_empire.3.d: "廓尔喀人的山国扼守着喜马拉雅南麓。向加德满都发出最后通牒：要么归顺，要么承受帝国的怒火！"
 change_chi_third_empire.3.a: "发出最后通牒"
 change_chi_third_empire.3.b: "暂缓行动"
 change_chi_third_empire.4.t: "中国的最后通牒"
 change_chi_third_empire.4.d: "北京要求我们无条件归顺，中国军队正在边境集结。但尼泊尔人从不向强权低头！"
 change_chi_third_empire.4.a: "拒绝！"
 change_chi_third_empire.4.b: "承认中国宗主权"
 change_chi_third_empire.5.t: "最后通牒"
 change_chi_third_empire.5.d: "不丹，这个夹在西藏与印度之间的弹丸小国，竟敢无视帝国的威严。向廷布发出最后通牒：要么归顺，要么被踏平！"
 change_chi_third_empire.5.a: "发出最后通牒"
 change_chi_third_empire.5.b: "暂缓行动"
 change_chi_third_empire.6.t: "中国的最后通牒"
 change_chi_third_empire.6.d: "北京要求我们归顺中国。虽然廷布的寺院一片恐慌，但不丹的僧侣与武士不会束手就擒！"
 change_chi_third_empire.6.a: "拒绝！"
 change_chi_third_empire.6.b: "接受中国统治"
 change_chi_third_empire.26.t: "[From.GetName]拒绝最后通牒"
 change_chi_third_empire.26.d: "前线传来消息：[From.GetName] 拒绝了我们的最后通牒。那就让战争说话——出兵！"
 change_chi_third_empire.26.a: "那就开战！"
 change_chi_third_empire.7.t: "边疆补给线"
 change_chi_third_empire.7.d: "工程部队已在天山脚下、喜马拉雅山麓与绥远草原上立起了一座座补给站，钢铁的轨道正把它们与内地的工厂紧紧相连。北线与西线的军团，从此有了源源不断的弹药与给养。"
 change_chi_third_empire.7.a: "补给线畅通！"
 change_chi_third_empire.8.t: "租借地的阴影"
 change_chi_third_empire.8.d: "自清末以来，广州湾与澳门便悬挂着法兰西与葡萄牙的旗帜。如今帝国崛起，是时候向巴黎发出照会，要求归还这两处租借地了。"
 change_chi_third_empire.8.a: "向巴黎发出照会"
 change_chi_third_empire.8.b: "暂缓"
 change_chi_third_empire.9.t: "中国的照会"
 change_chi_third_empire.9.d: "北京要求归还广州湾与澳门。作为三皇同盟的盟友，我们应当如何回应？"
 change_chi_third_empire.9.a: "归还租借地，巩固同盟"
 change_chi_third_empire.9.b: "拒绝！那是帝国的财产"
 change_chi_third_empire.10.t: "南方的宝库"
 change_chi_third_empire.10.d: "法属印度支那富产橡胶与钨矿，却远离法国本土、难以防守。若由帝国接管其防务与治权，同时保留法国的资源开采权，于双方都有利。"
 change_chi_third_empire.10.a: "向巴黎提议接管印度支那"
 change_chi_third_empire.10.b: "暂缓"
 change_chi_third_empire.11.t: "北京的建议"
 change_chi_third_empire.11.d: "中国提议接管印度支那的防务与治权，但保证我们的资源开采权不受影响。远东的殖民地终究难以长期维持，这个提议值得考虑。"
 change_chi_third_empire.11.a: "同意：移交治权，保留资源开采权"
 change_chi_third_empire.11.b: "拒绝！印度支那属于法兰西"
 change_chi_third_empire.12.t: "租借地回家了"
 change_chi_third_empire.12.d: "巴黎的答复已经送达：法兰西帝国同意归还广州湾，里斯本也交还了澳门。三色旗与葡萄牙旗在南中国的海岸缓缓降下——悬在帝国心头数十年的刺，终于拔除了。"
 change_chi_third_empire.12.a: "欢迎回家！"
 change_chi_third_empire.13.t: "巴黎的拒绝"
 change_chi_third_empire.13.d: "巴黎拒绝了归还租借地的要求，声称那是法兰西帝国的合法财产。外交部里一片哗然——盟友的态度，令人心寒。"
 change_chi_third_empire.13.a: "强烈抗议！"
 change_chi_third_empire.13.b: "暂时隐忍"
 change_chi_third_empire.14.t: "印度支那易主"
 change_chi_third_empire.14.d: "巴黎同意了！法兰西帝国将印度支那的防务与治权移交帝国，同时保留资源开采权。河内、西贡、金边与万象的旗帜，将换成帝国的旗帜。"
 change_chi_third_empire.14.a: "欢迎新领土！"
 change_chi_third_empire.15.t: "巴黎的拒绝"
 change_chi_third_empire.15.d: "巴黎拒绝移交印度支那。外交部认为，远东的富庶之地不应永远由万里之外的欧洲王朝把持。这笔账，先记下。"
 change_chi_third_empire.15.a: "记下这笔账"
 change_chi_third_empire.15.b: "暂时隐忍"
 change_chi_third_empire.16.t: "[From.GetName]誓死抵抗"
 change_chi_third_empire.16.d: "前线传来消息：[From.GetName] 拒绝屈服，正在动员全国力量负隅顽抗。既然如此，就让战争说话！"
 change_chi_third_empire.16.a: "让战争说话！"
 change_chi_third_empire.21.t: "共同开采的提议"
 change_chi_third_empire.21.d: "柏林提议与我们共同开采油田：德国提供技术与设备，换取一处油田的全部资源开采权。作为回报，德国将协助提升我们全部油田的产量、完善油田地区的基础设施与建设能力，并分享先进的资源挖掘技术。"
 change_chi_third_empire.21.a: "接受！与德意志共同开采"
 change_chi_third_empire.21.b: "拒绝，感谢柏林的好意"
 change_chi_third_empire.22.t: "中国的答复"
 change_chi_third_empire.22.d: "北京同意了我们共同开采的提议！作为交换，德国将获得一处油田的全部资源开采权。"
 change_chi_third_empire.22.a: "合作愉快！"
 change_chi_third_empire.23.t: "中国的答复"
 change_chi_third_empire.23.d: "北京婉拒了共同开采的提议。虽然有些遗憾，但两国的友谊不会因此受损。"
 change_chi_third_empire.23.a: "尊重中国的选择"
 change_chi_third_empire.24.t: "[From.GetName]不战而降"
 change_chi_third_empire.24.d: "前线传来消息：[From.GetName] 的王室放弃了抵抗，选择归顺帝国。喜马拉雅山南麓的土地，兵不血刃地落入了帝国手中。"
 change_chi_third_empire.24.a: "兵不血刃！"
 change_chi_third_empire.25.t: "勘探队的发现"
 change_chi_third_empire.25.d: "勘探队踏遍了帝国的山川河谷，终于传来捷报：在两个地区发现了新的矿脉与油田！"
 change_chi_third_empire.25.a: "继续勘探！"
 change_chi_third_empire.17.t: "柏林援助抵达"
 change_chi_third_empire.17.d: "柏林履行了承诺：成箱的步枪与支援装备运抵港口，工程师们开始为帝国援建新的工厂。德中友谊，在油井与机床的轰鸣中愈发牢固。"
 change_chi_third_empire.17.a: "感谢盟友！"
 change_chi_third_empire.18.t: "来自柏林的祝贺"
 change_chi_third_empire.18.d: "柏林发来贺电，对帝国发现大油田表示祝贺。虽然德国暂时没有提供实质援助，但这份善意依然令人欣慰。"
 change_chi_third_empire.18.a: "礼尚往来"
 change_chi_third_empire.19.t: "中国的请求"
 change_chi_third_empire.19.d: "中华民国请求引入帝国的设计商与军工技术，以充实其工业与设计能力。作为三皇同盟的盟友，我们应当支持这一请求——帝国的军工智慧，将在远东的土地上生根发芽。"
 change_chi_third_empire.19.a: "同意！让德意志的工艺传遍世界"
 change_chi_third_empire.20.t: "柏林同意引入设计商"
 change_chi_third_empire.20.d: "柏林同意了！一批德意志的顶尖设计商即将启程前往中国。他们的图纸与经验，将让帝国的军工体系脱胎换骨。"
 change_chi_third_empire.20.a: "欢迎德意志的工程师们！"
 CHI_third_empire_german_designers_tt: "如果德国同意，你将获得德国全部设计商的使用权限（§Y仅限坦克、飞机、舰船§!），并为每个设计商注入 §Y10000§! 经费"
 change_nightmare.1.t: "炼狱空军模式选择"
 change_nightmare.1.d: "你开启了「炼狱空军」噩梦难度。请选择AI空军的强化模式：\n§G兵海§!：AI刷机数量翻倍。\n§G高质量§!：刷机数量与频率减半（每120天），AI飞机造价提高50%、全属性大幅提升。\n§G不变§!：保持默认（每60天补充一批飞机）。\n\nAI的机场容量也会自动补充，确保刷出的飞机有地方起飞。"
 change_nightmare.1.a: "兵海"
 change_nightmare.1.b: "高质量"
 change_nightmare.1.c: "不变"
 change_nightmare.2.t: "炼狱空军·反扑增援"
 change_nightmare.2.d: "反扑机群正在抵达：额外的5000架飞机已交付前线机场。"
 change_nightmare.2.a: "收到"
