 CHI_third_empire_categories: "三皇同盟·中华民国"
 CHI_third_empire_categories_desc: "自三皇同盟的旗帜在欧陆升起，中华民国亦将目光投向四方。与德意志帝国并肩而立，开发沉睡的油田、收复租借地与故土、统御东亚的天命——这是中华的复兴之路，也是帝国插在远东的利剑。"
 CHI_third_empire_oil_development: "油田开发"
 CHI_third_empire_oil_development_desc: "玉门与独山子的钻机已沉默太久。投入资金与技术，让沉睡的油田日夜轰鸣——西北的荒原下，流淌着帝国的命脉。"
 CHI_invade_nepal: "入侵尼泊尔"
 CHI_invade_nepal_desc: "廓尔喀人的山国扼守着喜马拉雅南麓。为保护帝国侧翼，出兵征服尼泊尔！"
 CHI_invade_bhutan: "入侵不丹"
 CHI_invade_bhutan_desc: "这个弹丸小国挡在通往南亚的门户上。出兵吧，让喜马拉雅山脊尽归帝国所有。"
 CHI_third_empire_oil_development_desc: "玉门、独山子、准噶尔、延长、四川与辽东的钻探队整装待发。投入资金与技术，让沉睡的油田日夜轰鸣——西北、西南与东北的黑金，将流淌成帝国的命脉。"
 CHI_third_empire_border_defense: "边疆补给线"
 CHI_third_empire_border_defense_desc: "为防备北线与西线的漫长边境，工程部队将在乌鲁木齐、喀什、日喀则、陕北与绥远修筑大型补给站，并以铁路将它们与内地工业区相连。从此，帝国的军队将不再为边疆的补给发愁。"
 CHI_third_empire_border_defense_tt: "§Y在乌鲁木齐、喀什、日喀则、陕北与绥远修筑大型补给站§!，并§Y新建铁路§!将其与内地相连。"
 CHI_focus_categories_07_tt: "完成勘探后，将在两个随机州发现新的资源。"
 CHI_third_empire_take_back_guangzhouwan_macau: "收回广州湾与澳门"
 CHI_third_empire_take_back_guangzhouwan_macau_desc: "自清末以来，广州湾与澳门便悬挂着法兰西与葡萄牙的旗帜。如今帝国崛起，是时候向巴黎发出照会，要求归还这两处租借地了。"
 CHI_third_empire_gain_indochina: "接管法属印度支那"
 CHI_third_empire_gain_indochina_desc: "法属印度支那富产橡胶与钨矿，却远离法国本土、难以防守。若由帝国接管其防务与治权，同时保留法国的资源开采权，于双方都有利。"
 CHI_third_empire_eternal_revolution: "永恒的中华革命"
 CHI_third_empire_eternal_revolution_desc: "革命尚未成功，同志仍须努力。推翻旧秩序，建立属于中华的新纪元——让革命的火种燃遍整个世界！"
 CHI_third_empire_reclaim_lost: "收复失地与收服浪子"
 CHI_third_empire_reclaim_lost_desc: "从西伯利亚的冰原到蒙古高原，从唐努乌梁海到雪域西藏，昔日中华的羁縻之地如今四分五裂。我们将宣示对这些土地的权利，但暂不动武——以免过早打破天下的均势。"
 CHI_third_empire_new_middle_kingdom: "新天朝"
 CHI_third_empire_new_middle_kingdom_desc: "旧的天朝上国已经湮灭，新的天朝将从废墟中崛起。完成国策，并整顿军队——腐败的军头们将用他们贪婪的手腕，把军队打造成一支虎狼之师。（陆军攻击、防御、组织度与组织度恢复速率+10%）"
 CHI_third_empire_northern_mandate: "北方天命"
 CHI_third_empire_northern_mandate_desc: "北方的冰原与林海，自古是华夏龙兴之地。宣示北方的天命，但暂不诉诸战争。"
 CHI_third_empire_greater_game: "西域博弈"
 CHI_third_empire_greater_game_desc: "丝绸之路的尽头，中亚的风云变幻。参与这场大博弈，宣示帝国在西域的利益，但暂不动武。"
 CHI_third_empire_southern_mandate: "南方天命"
 CHI_third_empire_southern_mandate_desc: "南洋的怒涛与中南半岛的丛林，都在等待帝国的旗帜。宣示南方的天命，但暂不诉诸战争。"
 CHI_third_empire_cradle_of_civilization: "文明的摇篮"
 CHI_third_empire_cradle_of_civilization_desc: "黄河长江孕育了最初的中华文明。当三方的天命尽归帝国，文明的摇篮将重新接纳它失散已久的儿女——为北疆、西域与南洋的土地带来核心公民的身份。"
 CHI_third_empire_import_german_designers: "引入德国设计商"
 CHI_third_empire_import_german_designers_desc: "德意志帝国的军工体系冠绝欧陆。向柏林提出请求，引入他们的设计商与设计理念，为帝国的军工产业注入新鲜血液。"
