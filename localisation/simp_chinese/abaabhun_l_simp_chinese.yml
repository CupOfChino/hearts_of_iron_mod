 GER_ai_categories:0 "德国ai强化"
 GER_third_empire_categories:0 "三皇同盟"
 GER_third_empire_categories_desc: "自凡尔赛的锁链破碎，欧罗巴的旧血再度沸腾！威廉二世陛下的铁十字鹰旗飘扬于柏林穹顶，拿破仑四世的雄鹰纹章重铸巴黎荣光，奥托·冯·哈布斯堡的圣斯蒂芬王冠在布达佩斯加冕——这是君主与骑士的归来，是帝国血脉对共和虚妄的终极审判！"
 GER_third_empire_war_categories:0 "同盟国战争策略"
 GER_third_empire_war_categories_desc: "战争已然爆发，历史早已经向我们证明：由他人施舍而来的和平能称的上是和平吗？和平，只能是靠我们自己争取而来的！"
 GER_third_empire_prepare_war_categories:0 "战争动员"
 GER_third_empire_prepare_war_categories_desc: "两大集团的对抗让战争的阴霾笼罩在整个世界。我们并未做好战争的准备，倘若战争爆发我们将会极其被动。我们必须抓紧时间进行战争动员"
 GER_with_friend_categories:0 "联合决议"
 GER_with_friend_categories_desc: "“人心齐，泰山移”“不积硅步，无以至千里；不积小流，无以成江海”，一点一点的积累，最后就能成为一辈子。其实也就是：§R这里所得到的加成，将对我们阵营中所有成员生效§!"
 GER_new_third_empire_has_war_categories: "第二次世界大战"
 GER_new_third_empire_has_war_categories_desc: " 你知道的，战争已经开始了。。。 \n 它现在与我们每个人息息相关。 \n §R这场战争的收尾只会以某一方彻底死亡才会宣告结束。。。吗？§!"
 GER_the_new_technologies_categories:0 "特殊科技"
 GER_the_test_categories:0 "测试决议"
 
 

 FRA_ai_categories:0 "法国ai强化"
 FRA_third_empire_categories:0 "三皇同盟"
 FRA_third_empire_categories_desc: "自凡尔赛的锁链破碎，欧罗巴的旧血再度沸腾！威廉二世陛下的铁十字鹰旗飘扬于柏林穹顶，拿破仑四世的雄鹰纹章重铸巴黎荣光，奥托·冯·哈布斯堡的圣斯蒂芬王冠在布达佩斯加冕——这是君主与骑士的归来，是帝国血脉对共和虚妄的终极审判！\n --D指导"
 FRA_old_firend_categories:0 "旧同盟国归来"
 mod_economy_decisions:0 "特殊政策"
 mod_special_decisions:0 "其他决议"
 mod_special_decisions_desc: "\n 一些整来玩的决议 \n"
 FRA_start_industry_categories:0 "工业振兴"
 FRA_start_industry_categories_desc: "尽管拥有悠久的工业传统，法国的工业体系在20世纪30年代已显疲态。分散的小企业、落后的生产技术、频繁的罢工与政治动荡严重制约了产能。钢铁厂效率低下，军工厂产能未被充分动员，民用与军用生产之间缺乏协调。国家尚未准备好应对现代战争的工业挑战。"
 FRA_the_army_rearmament_categories:0 "军队改革"
 FRA_the_army_rearmament_categories_desc: "“索姆河”、“凡尔登”。。。这些名字是荣誉的勋章，亦是深植于军队灵魂的梦魇。第一次世界大战的惨烈胜利，以一代人的鲜血为代价，彻底摧残了这支“欧陆第一陆军”的进取之心。僵化的“步步为营”战术学说成为金科玉律，高级指挥层充斥着保守与悲观情绪，部队装备陈旧，士气依赖于静态的防线而非机动的进攻。军队的灵魂，仿佛仍被困在1916年那泥泞的战壕里。。。"

