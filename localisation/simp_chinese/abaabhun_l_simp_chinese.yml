 change_news.13.a:0 "这对协约国来说是一场大胜"
 change_news.13.b:0 "真是一场灾难"
 change_news.13.c:0 "好！"

 change_news.14:0 "[Root.GetNameDefCap]内战结束"
 change_news.14.t:0 "[Root.GetNameDefCap]恢复统一了"
 change_news.14.d:0 "终于，经过双方的谈判与妥协，[Root.GetNameDefCap]震惊世界的内战最终结束了。这场内战发生的是那么突然，以至于[Root.GetNameDefCap]的盟友都未能反应过来。尽管这场内战破坏规模并不算大，但毫无疑问，[Root.GetNameDefCap]极其盟友的处境将变得不利。"
 change_news.14.a:0 "就这么结束了？还以为要打个你死我活呢"
 change_news.14.b:0 "。。。好在及时止损了"

 change_news.15:0 "重申三国协约"
 change_news.15.t:0 "重申三国协约"
 change_news.15.d:0 "尽管主要成员国的国内出现了小插曲，但好在是顺利解决了。为了确保三国协约的有效性，协约国的主要成员国于华盛顿再次重申三国协约，宣布三国协约长期有效。"
 change_news.15.a:0 "这个世界是个巨大的草台班子"
 change_news.15.c:0 "不是哥们，搁着玩过家家呢，这么搞笑"
 change_news.15.b:0 "只是有点小插曲"

 change_news.16:0 "民族解放阵线的建立"
 change_news.16.t:0 "民族解放阵线的建立"
 change_news.16.d:0 "中华人民共和国和拉丁同盟宣布将共同成立民族解放阵线，并宣称将会为全世界被压迫的民族带来解放。毫无疑问，这对世界的局势产生巨大的冲击。"
 change_news.16.a:0 "团结在红星之下！"
 change_news.16.b:0 "又多了个让人头疼的麻烦"

 change_news.17:0 "日本宣布退出大陆"
 change_news.17.t:0 "日本宣布退出大陆"
 change_news.17.d:0 "随着东北被中国军队收复，日本已经彻底丧失了在中国大陆的立足之处。残余的日本军队败退到朝鲜半岛并于鸭绿江一线构筑防线，希望能守住在大陆的最后踏板。然而，日军的希望于前日晨间被中国军队打破，寄予厚望的鸭绿江防线如同窗户纸般一捅就破，大批中国军队已经度过鸭绿江并朝平襄进军。迫于国内外的压力，日本方面表示：“不打了不打了，那土地我不要了，别再打了。”"
 change_news.17.a:0 "伟大的胜利！"
 change_news.17.b:0 "东亚的格局已经发生天翻地覆的变化了"

 change_news.18:0 "国民政府宣布投降"
 change_news.18.t:0 "国民政府宣布投降"
 change_news.18.d:0 "在人民解放军的攻势之下，国民政府军队一溃千里。在自知大势已去，国民政府宣布将停止抵抗，接受中国共产党的改编。"
 change_news.18.a:0 "东方的巨龙已经苏醒"
 change_news.18.b:0 "看来在东方要捞不到什么好处了"

 change_news.19:0 "国共合作"
 change_news.19.t:0 "国共合作"
 change_news.19.d:0 "不知道是不是因为挨枪子了之后换了脑子还是拿到了传说中的催眠app，蒋介石竟然说服中国共产党加入自己。要知道在前几个月双方的边境还在兵戈相向，现在就又和好了？！"
 change_news.19.a:0 "干嘛，都是为了民族复兴，为什么不能合作呢？"
 change_news.19.b:0 "捏妈妈滴，这也太魔幻了"

 change_news.20:0 "[Root.GetNameDefCap]加入三皇同盟"
 change_news.20.t:0 "[Root.GetNameDefCap]加入三皇同盟"
 change_news.20.d:0 "[Root.GetNameDefCap]宣布将加入三皇同盟并对协约国宣战，[Root.GetNameDefCap]的加入将导致双方力量产生倾斜。但这场大战究竟谁胜谁负，依然尚未可知。"
 change_news.20.a:0 "我们将携手迈向胜利"
 change_news.20.b:0 "又多了个难缠的对手。。。"

 change_news.21:0 "[Root.GetNameDefCap]加入三国协约"
 change_news.21.t:0 "[Root.GetNameDefCap]加入三国协约"
 change_news.21.d:0 "[Root.GetNameDefCap]宣布将加入三国协约并对同盟国宣战，[Root.GetNameDefCap]的加入将导致双方力量产生倾斜。但这场大战究竟谁胜谁负，依然尚未可知。"
 change_news.21.a:0 "我们将携手迈向胜利"
 change_news.21.b:0 "又多了个难缠的对手。。。"

 change_news.22:0 "巨龙逐日"
 change_news.22.t:0 "巨龙逐日"
 change_news.22.d:0 "在[Root.GetNameDefCap]统一中国之后，综合国力得到巨大提升。在经过一段时间的修养生息之后，[Root.GetNameDefCap]于昨日向日本发起突袭。得益于日本内部军种对立问题严重，[Root.GetNameDefCap]的海军陆战队成功抓住机会登陆上日本本土，并控制了部分区域。至于这场战争的结果会如何，就让我们拭目以待。"
 change_news.22.a:0 "有意思"
 change_news.22.b:0 "很好，等主力登岛便是日本的末日"
 change_news.22.c:0 "不是哥们，海军在干嘛？陆军在干嘛？"

 change_news.23:0 "日本向中共屈服"
 change_news.23.t:0 "日本向中共屈服"
 change_news.23.d:0 "在中国的威胁之下，日本被迫接受了中国的提议强制改变了政府。中国的实力已经变得这么强大了吗"
 change_news.23.a:0 "好家伙。。。"
 change_news.23.b:0 "无产阶级事业的伟大胜利"

 change_news.24:0 "大东亚共荣的建成"
 change_news.24.t:0 "大东亚共荣的建成"
 change_news.24.d:0 "日本宣布已经完全控制东亚地区，并在国民政府最后的抵抗城市进行了大规模的阅兵仪式。国民政府以及中共残余的军队被迫转移至广大山区进行游击。东亚战争以日本的胜利告终"
 change_news.24.a:0 "日本的野心不会就此满足"
 change_news.24.b:0 "支那已经成为我们的后方，那么接下来该把目光放的更长远一点。。。"

 change_news.25:0 "东亚大规模游击队起义"
 change_news.25.t:0 "东亚大规模游击队起义"
 change_news.25.d:0 "在[Root.GetNameDefCap]与日本的战争时，中国游击队趁着日本疲于奔命，抓住机会发动一场大几乎波及整个中国的起义。其他地区"
 change_news.25.a:0 "日本要遭重了"
 change_news.25.b:0 "这群刁民"

 change_news.26:0 "拉丁同盟"
 change_news.26.t:0 "拉丁同盟成立"
 change_news.26.d:0 "墨西哥政府宣布为了维护自身以及拉丁美洲各兄弟国家的安全，将组建拉丁同盟这一阵营，并会陆续邀请各个拉丁美洲的国家加入其中。当拉丁美洲的国家成为整体之后，是否能对世界局势产生冲击呢？"
 change_news.26.a:0 "美国的后院已经出现火星了"
 change_news.26.b:0 "伟大的决定"
  
 change_news.27:0 "中东被同盟国掌控"
 change_news.27.t:0 "中东被同盟国掌控"
 change_news.27.d:0 "伊朗、伊拉克、沙特阿拉伯在法兰西帝国的胁迫之下，宣布臣服于法兰西帝国。这标志着同盟国在中东的影响力进一步扩大了，同盟国军队现在进可以威胁高加索区，退也可以协助北非的法国军队对埃及进行夹击。"
 change_news.27.a:0 "情况不太妙"
 change_news.27.b:0 "我们有了一把威胁苏联和北非军队的利剑"

 change_news.28:0 "土耳其加入英国"
 change_news.28.t:0 "土耳其加入英国"
 change_news.28.d:0 "出于自身安全的考虑，土耳其接受了英国的提案，选择加入了协约国。这对同盟国的中东战略有着不小的影响的。现在同盟国与中东的交流只剩下海运了"
 change_news.28.a:0 "算是扳回一城"
 change_news.28.b:0 "有点麻烦"

 change_news.29:0 "奥匈帝国夺回布科维纳"
 change_news.29.t:0 "奥匈帝国夺回布科维纳"
 change_news.29.d:0 "本来将要开赴并接管布科维纳的苏联军队被奥匈帝国的军队给拦截在边境线上，双方剑拔弩张，于边境线上进行对峙。奥匈帝国皇帝表示：“割让布科维纳这一破坏帝国团结统一的行为是绝对不可能接受，帝国陆军将会不惜一切代价维护祖国领土完整”。"
 change_news.29.a:0 "让我们期待苏联人的回答"
 change_news.29.b:0 "奉陪到底"

 change_news.30:0 "苏联撤军"
 change_news.30.t:0 "苏联撤军"
 change_news.30.d:0 "在奥匈的强硬态度之下，苏联人于今日晨间主动撤离边境线。尽管苏联国内有许多不满的声音，但至少保住了和平"
 change_news.30.a:0 "还是奥匈帝国赢了"
 change_news.30.b:0 "至少我们保住了和平不是么"

 change_news.31:0 "布科维纳的枪声"
 change_news.31.t:0 "布科维纳的枪声"
 change_news.31.d:0 "苏联军队正式跨过奥匈帝国的封锁线，并向奥匈帝国军队的驻地进行猛烈的攻击。奥匈军队迅速反应并进行还击，边境线上一时间炮火震天。对于苏联军队的入侵行动，奥匈帝国宣布对苏联全面开战并开始大规模调动军队；苏联军队也在向乌克兰境内大规模集结。战斗已经彻底打响"
 change_news.31.a:0 "真是疯狂"
 change_news.31.b:0 "我们必将凯旋"

 change_news.32:0 "布科维纳的枪声"
 change_news.32.t:0 "布科维纳的枪声"
 change_news.32.d:0 "苏联军队正式跨过奥匈帝国的封锁线，并向奥匈帝国军队的驻地进行猛烈的攻击。奥匈军队迅速反应并进行还击，边境线上一时间炮火震天。对于苏联军队的入侵行动，奥匈帝国宣布对苏联全面开战并开始大规模调动军队；苏联军队也在向乌克兰境内大规模集结。奥匈和苏联之间的战斗已经彻底打响，双方的盟友也将陆续加入战场，一场世纪大战已经开始了。"
 change_news.32.a:0 "咱也得帮帮场子"
 change_news.32.b:0 "我们必将凯旋"
 change_news.32.c:0 "这会是世界大战的开幕式吗？"

 change_news.33:0 "法兰西帝国军队跨越边境"
 change_news.33.t:0 "法兰西帝国军队跨越边境"
 change_news.33.d:0 "在部署完毕后，法国北非军团和中东军团从多个方向，配合空军突然向英国人的阵地发起了进攻。很明显，这是一场蓄谋已久的攻势。在法国军队的猛烈进攻下，前线的英军只能被迫撤退。\n由于事发突然，伦敦、柏林方向暂时没有消息传出。伦敦方面的态度不难猜测，柏林方面不出意外也会支持她的法兰西盟友\n整个世界现在就是装满火药的炸药桶，而法国人的行动无疑就是落入其中的烈火，这个世界马上将会燃烧。"
 change_news.33.a:0 "可怕"
 change_news.33.b:0 "要战，那我们便奉陪到底"
 change_news.33.c:0 "前线部队立刻准备进攻！"

 change_news.34:0 "同盟国空军入侵协约国领空"
 change_news.34.t:0 "同盟国空军入侵协约国领空"
 change_news.34.d:0 "一则令人震惊的消息，根据莫斯科和伦敦方面的报告，由同盟国成员的战机编队组成的机群从东波兰的上空飞到了乌克兰境内，并在协约国空域中长时间逗留；协约国飞行员在多次警告无果，进行鸣枪示警，并以强硬姿态驱逐同盟国空军出境。\n莫斯科方面称此举为严重的挑衅行为，而柏林方面称只是联合演习时飞出现的“乌龙”，具体原因系领队飞行员所驾驶的飞机导航受到同盟国的雷达干扰，使得系统失灵丢失了方向。并且称此为“协约国的阴谋”。\n"
 change_news.34.a:0 "。。。。"
 change_news.34.b:0 "欺人太甚"
 change_news.34.c:0 "情报已经收集到了"

 change_news.35:0 "同盟国军队大规模演习"
 change_news.35.t:0 "同盟国军队大规模演习"
 change_news.35.d:0 "同盟国军队进行了大规模的联合演习，这场演习的规模极其庞大，各种新式步枪和战车也大规模出现在其中。毫无疑问，这是一场规模浩大的“秀肌肉”的行动。"
 change_news.35.a:0 "恐怖的军事力量"
 change_news.35.b:0 "来者不善"
 change_news.35.c:0 "前进!"

 change_news.36:0 "第二次海军竞赛"
 change_news.36.t:0 "第二次海军竞赛"
 change_news.36.d:0 "德国于近期正式开始大力建设海军，一系列新式战列舰和巡洋舰被提上日程。德国此举触动到了世界海军强国的紧绷的神经，也纷纷开始建设新式战舰。毫无疑问，一场新式的海军竞赛开始了"
 change_news.36.a:0 "继续建设"
 change_news.36.b:0 "世界又不安分了"

 change_news.37:0 "法国大规模开发油田"
 change_news.37.t:0 "法国大规模开发油田"
 change_news.37.d:0 "法国在掌握中东后便迅速的对油田进行了大规模的勘探和扩建。在此过程中开发的新技术也被运用在帮助其盟友所掌握的油田上。\n尽管目的不明，但这种合作共研的精神确实很不错。"
 change_news.37.a:0 "油是工业的生命线"
 change_news.37.b:0 "与我何干？"

 change_news.38:0 "[Root.GetNameDefCap]同意了苏联的要求"
 change_news.38.t:0 "[Root.GetNameDefCap]同意了苏联的要求"
 change_news.38.d:0 "今日，[Root.GetNameDefCap]政府宣布，[Root.GetNameDefCap]将同意苏联的要求，接受莫斯科的统治。这对于苏联来说是一场巨大的外交胜利"
 change_news.38.a:0 "享受暂时的胜利吧"
 change_news.38.b:0 "苏联的势力范围又扩大了"

 change_news.39:0 "[Root.GetNameDefCap]拒绝了苏联的要求"
 change_news.39.t:0 "[Root.GetNameDefCap]拒绝了苏联的要求"
 change_news.39.d:0 "[Root.GetNameDefCap]拒绝了苏联的要求，[Root.GetNameDefCap]政府宣布不会向任何强权屈服。"
 change_news.39.a:0 "让我们看看布尔什维克的本事"
 change_news.39.b:0 "如果他们只服从于绝对的力量。。。"

 change_news.40:0 "西伯利亚大开发完成"
 change_news.40.t:0 "西伯利亚大开发完成"
 change_news.40.d:0 "在最近一次的记者招待会上，苏联人骄傲的宣布西伯利亚的开发已经基本完成，跨越整个西伯利亚的铁路也已经通车，如此浩大的工程简直是奇迹。"
 change_news.40.a:0 "祖国的伟大成就"
 change_news.40.b:0 "好吧，他们确实有点能耐"

 change_news.41:0 "墨西哥宣布接受美国提案"
 change_news.41.t:0 "墨西哥宣布接受美国提案"
 change_news.41.d:0 "墨西哥政府宣布接受华盛顿的要求，并将马上付诸行动。具体条约内容暂时不得而知，唯一确定的是华盛顿的战略目标已经更进一步。"
 change_news.41.a:0 "哦"
 change_news.41.b:0 "终于开始对后花园下手了吗"

 change_news.42:0 "墨西哥宣布拒绝美国提案"
 change_news.42.t:0 "墨西哥宣布拒绝美国提案"
 change_news.42.d:0 "墨西哥方面公布了华盛顿方面近期要求墨西哥签订的不平等条约，包括但不限于更迭政府，上交所有资源开采权。墨西哥宣布与美国断绝一切交流，现任政府将会誓死捍卫国家的尊严。"
 change_news.42.a:0 "胆子有点肥啊"
 change_news.42.b:0 "有好戏看了"

 change_news.43:0 "委内瑞拉宣布接受美国提案"
 change_news.43.t:0 "委内瑞拉宣布接受美国提案"
 change_news.43.d:0 "出于美国日益增加的压力，委内瑞拉宣布停止对外资源贸易，并将资源开采权上交给美国。美国方面表示将会接替委内瑞拉进行之前的贸易协定，此举是为了方便美国海军护航贸易航线"
 change_news.43.a:0 "。"
 change_news.43.b:0 "。"

 change_news.45:0 "委内瑞拉宣布拒绝美国提案"
 change_news.45.t:0 "委内瑞拉宣布拒绝美国提案"
 change_news.45.d:0 "委内瑞拉拒绝了美国的贸易法案，并呼吁其他国家协助保卫自由贸易"
 change_news.45.a:0 "胆子有点肥啊"
 change_news.45.b:0 "有好戏看了"

 change_news.46:0 "意大利被瓜分"
 change_news.46.t:0 "意大利被瓜分"
 change_news.46.d:0 "FOR --D指导 \n 根据柏林宫廷发布的战报，德意志帝国、奥匈帝国与法兰西帝国联军于昨日正式接管罗马。在美第奇宫签署的《罗马议定书》确认了意大利领土划分：\n北意大利,南蒂罗尔至的里雅斯特划入奥匈帝国直属经济区\n科西嘉岛及尼斯周边由法兰西帝国驻防\n剩余领土由德国管理\n柏林日报头版宣称这是'对地中海无序状态的必要矫正'，而伦敦泰晤士报则警告'这种拿破仑式的领土交易将破坏整个欧洲均势'。莫斯科广播电台评论员指出：'当皇帝们在餐桌上切割意大利时，刀叉碰撞的声音比炮弹更刺耳。'"
 change_news.46.a:0 "愿上帝怜悯亚平宁"

 change_news.47:0 "苏联卫国战争完全动员！"
 change_news.47.t:0 "苏联卫国战争完全动员！"
 change_news.47.d:0 "工厂昼夜不停地轰鸣，铁路线上挤满了开往前线的列车。\n 从乌拉尔到列宁格勒，从西伯利亚到高加索，整个国家已进入战争状态。\n 每一个工人都成为了战士，每一座城市都化作堡垒。\n 这是一场全民的战争，一场为了祖国生存而战的战争。\n 卫国战争的齿轮已经全面启动——苏维埃将用钢铁与意志迎接命运的考验。"
 change_news.47.a:0 "敌人将会燃烧"
 change_news.47.b:0 "情况不太妙"
 change_news.47.c:0 "有好戏看了"

 change_news.48:0 "苏联开始红场阅兵"
 change_news.48.t:0 "苏联开始红场阅兵"
 change_news.48.d:0 "莫斯科红场上寒风凛冽，受阅部队踏着整齐的步伐走过列宁墓。\n 尽管前线战事胶着，尽管敌军逼近首都，克里姆林宫依然决定举行这场阅兵。\n 它不仅是对军队士气的鼓舞，更是对侵略者最直接的回应：\n 我们不会退缩，我们不会屈服，我们将战斗到底"
 change_news.48.a:0 "入侵者必死"
 change_news.48.b:0 "红场阅兵？红场溃败！"
 change_news.48.c:0 "一次胆大的尝试"

 change_news.49:0 "红场阅兵胜利完成"
 change_news.49.t:0 "红场阅兵胜利完成"
 change_news.49.d:0 "阅兵结束，士兵们整装待发，坦克驶向战场。\n 敌人曾以为红军已是强弩之末，但他们错了。\n 这场阅兵不仅是一次军事展示，更是一种信念的宣告：\n 即使在战火纷飞之时，我们也依然昂首挺胸地前进。\n 苏维埃展示了她的勇气，也向世界宣告了她的决心。"
 change_news.49.a:0 "入侵者必死"
 change_news.49.b:0 "该死！"
 change_news.49.c:0 "苏维埃展示了她的勇气"

 change_news.50:0 "莫斯科沦陷"
 change_news.50.t:0 "莫斯科沦陷"
 change_news.50.d:0 "电报中断，红旗不再飘扬，敌人踏入了这座城市的中心。\n 曾经辉煌的克里姆林宫如今只剩沉默，红场上回荡着陌生的脚步声。\n 这是对苏联的最沉重的一击"
 change_news.50.a:0 "可恶！"
 change_news.50.b:0 "不过如此"
 change_news.50.c:0 "苏联要完了"

 change_news.51:0 "227号命令"
 change_news.51.t:0 "227号命令"
 change_news.51.d:0 "在敌军步步紧逼、前线频频告急的危急时刻，苏联发布了一项前所未有的命令：\n 不准后退一步，违者军法从事。\n 这是对懦弱者的警告，也是对勇敢者的号召。\n 士兵们知道，现在没有退路，只有向前。\n 战局不利，但我们仍有机会扭转乾坤"
 change_news.51.a:0 "一步不退！"
 change_news.51.b:0 "管我屁事"
 change_news.51.c:0 "战局不利"

 change_news.52:0 "苏联库尔斯克战役胜利"
 change_news.52.t:0 "苏联库尔斯克战役胜利"
 change_news.52.d:0 "硝烟尚未散尽，燃烧的敌军坦克残骸在阳光下冒着黑烟。\n 红军不仅挡住了敌人最猛烈的装甲冲击，更在关键时刻转入反攻。\n 库尔斯克不再是战场，而是敌人野心破灭的地方。\n 这一战标志着敌国失去了最后的战略主动权"
 change_news.52.a:0 "我们将继续前进，直到胜利降临"
 change_news.52.b:0 "情况不太妙"
 change_news.52.c:0 "哇奥"

 change_news.53:0 "苏联库尔斯克战役失败"
 change_news.53.t:0 "苏联库尔斯克战役失败"
 change_news.53.d:0 "尽管投入了大量兵力和资源，但在敌军的精准打击下，我们的防线出现了致命裂痕。\n 战术失误、情报泄露、后勤不足——一切问题都在这一刻爆发。\n 当然，这对苏联来说并非终点，而是新的开始。"
 change_news.53.a:0 "敌人或许暂时占了上风，但他们还没赢下整场战争。"
 change_news.53.b:0 "伟大的胜利！"
 change_news.53.c:0 "哇奥"

 change_news.54:0 "库尔斯克地区爆发大规模交战"
 change_news.54.t:0 "库尔斯克地区爆发大规模交战"
 change_news.54.d:0 "地图上的红色箭头指向库尔斯克草原，这里是东线战场最关键的交汇点。\n 双方都投入了前所未有的兵力，坦克洪流在旷野上纵横交错，炮火照亮了夜空。\n 这不仅是一场战役，更是一场决定战争走向的关键对决。\n 谁能掌控库尔斯克，谁就将掌握未来。"
 change_news.54.a:0 "我们必将凯旋"
 change_news.54.b:0 "我们必将凯旋"
 change_news.54.c:0 "哇奥"

 change_news.55:0 "苏联将土地要塞化"
 change_news.55.t:0 "苏联将土地要塞化"
 change_news.55.d:0 "为了抵挡敌人无尽的进攻，苏联红军在所有控制的土地上设置了大量的暗堡、地下网道以及坚固的要塞，红军在其中依托地形优势，不断消耗迟滞敌军。敌国的推进受到极其严重的阻碍。"
 change_news.55.a:0 "让敌人的每一步都付出代价！"
 change_news.55.b:0 "真是烦人"
 change_news.55.c:0 "哇奥"

 change_news.56:0 "欧陆霸权的诞生"
 change_news.56.t:0 "欧陆霸权的诞生"
 change_news.56.d:0 "随着同盟国大军的铁骑踏入最后一个自由国家的首都，整个欧陆的霸权也宣告着彻底来临。毫无疑问，同盟国的势力达到了巅峰。"
 change_news.56.a:0 "我们势不可挡"
 change_news.56.b:0 "该死的"
 change_news.56.c:0 "哈人"

 change_news.57:0 "巴尔干霸权的诞生"
 change_news.57.t:0 "巴尔干霸权的诞生"
 change_news.57.d:0 "奥匈帝国的铁骑摧毁了所有与其接壤的巴尔干国家，整个巴尔干的平衡已经随着最后一块旧奥匈帝国领土被收回而打破。在巴尔干的大地上，一个新的霸权诞生了。"
 change_news.57.a:0 "我们势不可挡"
 change_news.57.b:0 "哈人"

 change_news.58:0 "法国工业振兴计划"
 change_news.58.t:0 "法国全面启动工业振兴计划"
 change_news.58.d:0 "For D指导\n巴黎 —— 法国政府今日正式宣布启动『国家工业振兴计划』，标志着共和国将全面重组其工业体系以应对日益严峻的安全挑战。经济部长在国民议会发表讲话称，政府将推动关键产业国有化、整合分散产能、提升技术效率，并建立军民协同生产机制。\n首批改革将聚焦钢铁、机械与汽车制造业，雷诺、雪铁龙及克勒索-卢瓦尔等企业已被纳入国家优先合作名单。政府强调，此举并非走向计划经济，而是为确保在危机时刻‘每一座工厂都为国家服务’。\n国际观察家认为，这一举措反映出法国正试图摆脱过去十年工业停滞的局面，重新确立其作为欧洲主要工业强国的地位。"
 change_news.58.a:0 "我们将重回巅峰"
 change_news.58.b:0 "法国人展示了他们的决心"

 change_news.59:0 "德国帮助中国统一"
 change_news.59.t:0 "德国帮助中国统一"
 change_news.59.d:0 "在德国的大力援助下，中国最终实现了国家统一。这不仅使东亚大陆的力量对比发生根本性转变，也标志着德国在远东的战略布局取得重大成功。"
 change_news.59.a:0 "盟友就该互相帮助"
 change_news.59.b:0 "东亚的格局已经发生天翻地覆的变化了"

 change_news.60:0 "日本宣布加入协约国"
 change_news.60.t:0 "日本宣布加入协约国"
 change_news.60.d:0 "日本政府正式宣布加入协约国阵营。面对东亚局势的急剧变化，日本选择与欧洲列强结盟，以求在全新的国际秩序中维护自身利益。"
 change_news.60.a:0 "团结才是力量"
 change_news.60.b:0 "如此复杂的联盟真的稳定吗？"

 change_news.61:0 "苏联发兵蒙古"
 change_news.61.t:0 "苏联发兵蒙古"
 change_news.61.d:0 "苏联军队突然越过边境，向蒙古发起进攻！南方的中华民国也开始动员军队。这场特别军事行动是否会演变为全面战争？让我们拭目以待。"
 change_news.61.a:0 "不会花太多时间的"
 change_news.61.b:0 "有意思"
 change_news.61.c:0 "该死的"

 change_news.62:0 "中华民国发兵蒙古"
 change_news.62.t:0 "中华民国发兵蒙古"
 change_news.62.d:0 "苏联出兵蒙古仅两小时后，中华民国的边境军队也发动突袭。在两个大国的夹击下，蒙古已无任何机会。双方争夺地盘的过程中，是否会升级为全面战争？静待后续发展。"
 change_news.62.a:0 "好啊，他过江，我也过江"
 change_news.62.b:0 "有意思"
 change_news.62.c:0 "和我们抢地盘？？？"

 change_news.63:0 "中华民国和苏联演变为全面战争"
 change_news.63.t:0 "中华民国和苏联演变为全面战争"
 change_news.63.d:0 "两国在争夺地盘的过程中，一次摩擦让这场利益争夺演变为真正的战场。双方先头部队已爆发激烈交火，随之而来的是跨越边境的炮火与战机。在这两个国家背后，分别站着两个庞大的军事集团。蔓延全世界的战火，就此点燃。"
 change_news.63.a:0 "那就来吧！"
 change_news.63.b:0 "那就来吧！"
 change_news.63.c:0 "战火已经点燃。"

 change_news.64:0 "苏联入侵阿富汗"
 change_news.64.t:0 "苏联入侵阿富汗"
 change_news.64.d:0 "为了打通通往印度方向的运输线，苏联向阿富汗发起进攻。"
 change_news.64.a:0 "真是暴力"
 change_news.64.b:0 "速战速决"
 change_news.64.c:0 "有趣"

 change_news.65:0 "蒙古被瓜分"
 change_news.65.t:0 "蒙古被瓜分"
 change_news.65.d:0 "在抢夺地盘的过程中，双方都出人意料地保持了克制，未发生武力冲突。最终，蒙古在两国的夹攻下选择向双方投降。两国随后依现有占领区划定了边界。"
 change_news.65.a:0 "至少我们也拿到了一些缓冲区"
 change_news.65.b:0 "虽然被搅局了，不过也足够了"
 change_news.65.c:0 "真是残暴"

 change_news.66:0 "苏联宣布将抵抗到底"
 change_news.66.t:0 "苏联宣布将抵抗到底"
 change_news.66.d:0 "在陆地战场失利后，苏联政府机构撤至盟友境内，并发布公告，号召全苏联军民奋勇抵抗，决不投降！"
 change_news.66.a:0 "该死的"
 change_news.66.b:0 "我们决不投降"
 change_news.66.c:0 "惊人的毅力"

 change_news.67:0 "暹罗向英国屈服"
 change_news.67.t:0 "暹罗向英国屈服"
 change_news.67.d:0 "在英国持续施压下，暹罗最终选择屈服。"
 change_news.67.a:0 "很好"
 change_news.67.b:0 "。。。。"
 change_news.67.c:0 "又少了一个自由国家"

