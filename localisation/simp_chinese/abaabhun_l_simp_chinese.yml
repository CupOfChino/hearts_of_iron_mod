 the_eastern_man_desc:0 "(鸽了，选了没用)（需要满洲国走自立）大清将获得大幅度强化并取得独立，统一中国，并且反向殖民立本。在统一后，会尝试北伐并收回曾经的版图"
 the_eastern_jap_t:0 "大东亚共荣圈"
 the_eastern_jap_desc:0 "立本成功并整合了东亚，随后会朝着东南亚和美洲扩张"
 the_eastern_random_t:0 "东亚吃鸡赛"
 the_eastern_random_desc:0 "所有强化同时启动，东亚将变成完完全全的大混战，因为测试不够，可能会有大量bug，不建议开启。只适用于看海玩玩"

