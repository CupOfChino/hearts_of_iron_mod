 ENG_the_third_empire_categories:0 "三国协约"
 ENG_the_third_empire_categories_desc: "当普鲁士军靴的轰鸣震碎凡尔赛的和平，当波拿巴的野心撕下共和面具，当哈布斯堡的腐朽幽灵吞噬中欧——自由世界已无退路！无论意识形态的分歧，无论大洋与铁幕的阻隔，此刻我们必须并肩！伦敦的议会传统、华盛顿的民主火炬与莫斯科的工农红旗，将在三皇的黑暗狂想前筑成不可逾越的长城！\n --D指导"
