 PRC_land_reform: "土地改革"
 PRC_land_reform_desc: "半殖民地半封建的旧中国，仍维持封建土地制度，占农村人口不到10%的地主和富农，占有可耕土地面积的70%~80%,地租租额占产量的比重普遍在50%以上，有些地方达到70％～80%甚至更高。土地改革运动打碎了几千年来套在农民身上的封建枷锁，改变了农村旧有的生产关系。这一翻天覆地的变化，使亿万农民在政治上、经济上获得了解放，并由此迸发出难以估量的革命热情"
 PRC_Valuing_the_handicraft_industry: "重视手工业"
 PRC_Valuing_the_handicraft_industry_desc: "我们的国家基本上没有工业基础，而且也没有发展工业的条件。因此，我们应该重点关注手工业"
 PRC_Expand_production_in_base_areas: "扩大根据地生产"
 PRC_Construction_of_an_underground_factory: "建设地下工厂"
 PRC_Literacy_campaign: "扫盲运动"
 PRC_Rectification_movement: "整风运动"
 PRC_Rectification_movement_desc: "第五次反围剿的失败正是由于党内的思想错误，导致工农革命的火苗险些被掐灭，我们必须吸取教训，不能再犯同样的错误"
 PRC_Comintern_aid: "共产国际援助"
