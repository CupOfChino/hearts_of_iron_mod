 FRA_start_army_rearmament_desc: "“索姆河”、“凡尔登”。。。这些名字是荣誉的勋章，亦是深植于军队灵魂的梦魇。第一次世界大战的惨烈胜利，以一代人的鲜血为代价，彻底摧残了这支“欧陆第一陆军”的进取之心。僵化的“步步为营”战术学说成为金科玉律，高级指挥层充斥着保守与悲观情绪，部队装备陈旧，士气依赖于静态的防线而非机动的进攻。军队的灵魂，仿佛仍被困在1916年那泥泞的战壕里。\n固步自封只会带来灭亡！惨痛的教训教会了我们坚韧，而非怯懦。一战的教训将化为谨慎与坚韧的基石，我们会将其变为警醒与力量的源泉！通过彻底的学说革新与指挥体系重组，我们会将一战的经验融会贯通，凡尔登的遗产，最终将铸就一支更为审慎、坚韧且致命的武装力量！"

