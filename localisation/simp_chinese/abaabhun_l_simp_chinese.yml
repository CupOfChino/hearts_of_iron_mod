 FRA_straighten_out_house_affairs: "整顿内务"
 FRA_straighten_out_house_affairs_desc: "法兰西的皇帝回到了他忠实的巴黎，是时候对国内混乱的政治进行整顿了"
 FRA_improve_people_livelihood: "发展民生"
 FRA_improve_people_livelihood_desc: "国内的经济状况不容乐观，政府将重点建设民生设施保障人民的生活"
 FRA_improve_engage_in_production: "促进生产"
 FRA_improve_engage_in_production_desc: "下一步便是要促进生产，恢复国家的生产力"
 FRA_plant_site_expansion: "工厂用地扩建"
 FRA_plant_site_expansion_desc: "更改一些地区的用地类型来满足建设工厂需要的地块"
 FRA_improve_army: "发展军事"
 FRA_improve_army_desc: "邻居屯粮我屯枪，邻居就是我粮仓"
 FRA_improve_military_reform: "军队现代化"
 FRA_improve_military_reform_desc: "一些老东西依然沉浸在上一次大战的胜利之中，如果面对新的大战，这种固步自封的状态将会把我们埋葬"
 FRA_building_high_military_command: "建设最高指挥部"
 FRA_building_high_military_command_desc: "德佬的总参谋部的确很有效，我们也应该建设我们的最高指挥部"
 FRA_defence_unsafe_neighboor: "防备不睦之邻"
 FRA_defence_unsafe_neighboor_desc: "周围的邻居都不是很友善，法兰西必须做好准备应对随时可能发生的入侵"
 FRA_organize_militia: "组织非正规军"
 FRA_organize_militia_desc: "训练一些非正规军可以缓解我们的国防压力，也能节省和平时期的军费开支"
 FRA_enlargement_citizenship: "公民范围扩大化"
 FRA_enlargement_citizenship_desc: "如果大肆宣传参加法国军队就能成为法兰西的正式公民，那么就会有不少填线宝宝来扩充我们的人力池"
 FRA_attach_hol: "进攻低地"
 FRA_attach_hol_desc: "时机已到，今日发兵"
 FRA_allied_with_ger: "与德皇结盟"
 FRA_allied_with_ger_desc: "德皇已经回归王位，并且组建了自己的势力范围。也许我们可以尝试和德皇结盟？"
 FRA_attack_spr: "向南进军"
 FRA_attack_spr_desc: "南边的伊比里斯半岛对帝国的后方产生了威胁，我们应该彻底解决后患"
 FRA_attack_ita: "进军罗马"
 FRA_attack_ita_desc: "条条大路通罗马"
 FRA_the_france_empire: "重建辉煌"
 FRA_the_france_empire_desc: "横扫欧陆，做回自己"
 FRA_the_empire_army: "近卫军的荣耀"
 FRA_the_empire_army_desc: "“老近卫军步兵，进攻！”——这声呐喊曾令整个欧洲战栗。如今，皇帝将重建这支传奇部队。帝国近卫军不仅是军队的矛头，更是政权的基石与荣耀的化身。他们将从全军中遴选最忠诚、最悍勇的士兵与军官，配备最精良的武器，接受最严酷的训练。他们将为皇帝一人效死，并作为全军之楷模，将拿破仑式的进攻精神具象化为战无不胜的实体。"
 FRA_the_empire_navy: "皇家海军"
 FRA_the_empire_navy_desc: "还是不想写描述喵"
 FRA_the_empire_air: "皇家空军"
 FRA_the_empire_air_desc: "依然不想写描述喵"
 FRA_start_industry: "工业振兴"
 FRA_start_industry_desc: "尽管拥有悠久的工业传统，法国的工业体系在20世纪30年代已显疲态。分散的小企业、落后的生产技术、频繁的罢工与政治动荡严重制约了产能。钢铁厂效率低下，军工厂产能未被充分动员，民用与军用生产之间缺乏协调。国家尚未准备好应对现代战争的工业挑战"
