 FRA_the_change_politics_desc: "国内党派林立，缺乏一个强力的领导者，这将导致我们行政效率低下。不过这一现象并不会持续太久"
 FRA_the_new_politics: "焕然一新的政治格局"
 FRA_the_new_politics_desc: "拿皇归来了，法国要太平了；拿皇归来了，法国要有主了"
 FRA_military_reform: "军事改革"
 FRA_the_highest_commonder: "最高军事指挥部"
 FRA_imperial_army: "近卫军的荣耀"
 FRA_imperial_army_desc: "曾经那支令整个欧洲战栗的军队回来了！整个欧洲大陆将再一次臣服在帝国的铁骑之下！"
 FRA_defence_neighbour: "抵御不睦之邻"
 FRA_defence_neighbour_desc: "东有德国誓要复仇；南有意大利虎视眈眈；北有大英扼住咽喉"
 FRA_renewed_war_ger: "战火再燃"
 FRA_renewed_war_sov: "第二次的魅力"
 FRA_improve_livelihood: "民生建设"
 FRA_improve_livelihood_desc: "一战对我国的经济影响是毁灭性的，再加上大萧条的影响，我国境内依然有着大量的贫民窟。民生问题现已成为亟待解决的重要问题"
 FRA_improve_armament: "军事建设"
 FRA_improve_armament_desc: "不怀好意的邻居一直觊觎着祖国，一场不可避免之战已经拉开了帷幕"
 FRA_the_irregular_army: "组织非正规军"
 FRA_the_irregular_army_desc: "军队越多，开销也就越大，目前而言，政府难以维持一支庞大的军队。而为了应对未来可能的高烈度战争，训练非正规军或许是一个不错的方案"
 FRA_engage_in_production: "从事生产"
 FRA_engage_in_production: "大量青壮年从事生产可以有效促进我国经济发展"
 FRA_the_inperial_navy: "帝国海军"
 FRA_navy_competition: "海军竞赛"
 FRA_navy_competition_desc: "嗨，英吉利，你动不动以海军威胁我国的日子要结束了，把海上霸主的位置给我。"
 FRA_the_inperial_air: "帝国空军"
 FRA_modular_production_air: "模块化生产"
 FRA_modular_production_air_desc: "新式生产方式有效的节约了飞机生产成本"
 FRA_the_third_empire: "第三帝国"
 FRA_black_man: "公民扩大化"
 FRA_black_man_desc: "随着公民的范围扩大，那么人力池的范围也会跟着扩大"
 FRA_the_industry_change: "工业改革"
 FRA_army_defensive: "防御作战"
 FRA_army_ttk: "机动战法"
 FRA_Undertake_the_heavy_responsibility_of_the_navy: "承担海军重任"
 FRA_Undertake_the_heavy_responsibility_of_the_navy_desc: "我们的联盟有着世界上规模最强大的陆军和空军，唯独海军比不上假想敌们，这个问题必须被重视起来！尽管盟友缺乏完善的海军建设条件，但我们通过长期的积累已经有了完善的产业链，我们必须主动承担起海上的重任，为我们的联盟在海上杀出一条血路。"
 FRA_carrier_fight: "航母作战"
 FRA_battleship_fight: "主力舰队"
 FRA_ship_defend: "舰队防御"
 FRA_undersea_fight: "水下攻击"
 FRA_the_wwi_experience: "大战的历史教训"
 FRA_the_wwi_experience_desc: "大战的绞肉机证明，盲目投入数百万缺乏训练的征召兵是国家的灾难。皇帝的新军队将汲取这一教训，我们将建立一支规模精干、装备精良、训练有素的职业军队。每一位士兵都是宝贵的专家，每一辆坦克都是突破的利刃。我们不再用鲜血去浸泡土地，而是用钢铁与意志精准地摧毁敌人。"
 FRA_napoleon_soul: "拿破仑之魂"
 FRA_napoleon_soul_desc: "伟大的名字本身就是一面旗帜。拿破仑的继承者不仅带来了军事改革，更重新点燃了法兰西民族的荣誉与尚武精神。人民与军队为了一个共同的、辉煌的目标而团结在皇帝周围，愿意为了帝国的伟业付出一切。"
 FRA_the_empire_eyes: "帝国之眼"
 FRA_the_empire_eyes_desc: "阴影中的利剑，王座前的坚盾。‘帝国之眼’将是我们最锐利的武器与最可靠的护甲。它无所不在，无孔不入——在境内，它根除共和派与外国间谍的颠覆阴谋，确保帝国铁板一块；在境外，它于敌国腹地散播恐慌、制造裂痕，为大军团的铁蹄扫清障碍。忠诚、精确、无情，这便是‘帝国之眼’的信条。"

