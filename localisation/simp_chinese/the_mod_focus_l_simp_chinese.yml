 FRA_start_industry: "工业振兴"
 FRA_start_industry_desc: "尽管拥有悠久的工业传统，法国的工业体系在20世纪30年代已显疲态。分散的小企业、落后的生产技术、频繁的罢工与政治动荡严重制约了产能。钢铁厂效率低下，军工厂产能未被充分动员，民用与军用生产之间缺乏协调。国家尚未准备好应对现代战争的工业挑战"
