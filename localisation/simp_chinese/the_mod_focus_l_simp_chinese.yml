 FRA_the_empire_army: "近卫军的荣耀"
 FRA_the_empire_army_desc: "“老近卫军步兵，进攻！”——这声呐喊曾令整个欧洲战栗。如今，皇帝将重建这支传奇部队。帝国近卫军不仅是军队的矛头，更是政权的基石与荣耀的化身。他们将从全军中遴选最忠诚、最悍勇的士兵与军官，配备最精良的武器，接受最严酷的训练。他们将为皇帝一人效死，并作为全军之楷模，将拿破仑式的进攻精神具象化为战无不胜的实体。"
